components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Kayıt, giriş ya da yenilemeyle alınan erişim jetonu (T8.1): HS256 ile
        imzalı JWT, ömrü JWT_TTL (3600 sn). Yalnızca kimlik taşır (`sub`
        kullanıcı, `sid` oturum); telefon ya da ad gibi kişisel veri taşımaz.
        Şema adı büyük-küçük harfe duyarsızdır (`bearer` da kabul edilir).

  headers:
    SessionCookies:
      description: |
        Kayıt ve girişte İKİ çerez yazılır (iki ayrı `Set-Cookie` satırı): cihaz
        çerezi `getir_device` (aşağıda `DeviceCookie`) ve yenileme jetonu
        `getir_refresh` (aşağıda `RefreshCookie`). İkisi de HttpOnly'dir.
      schema:
        type: string
        example: getir_refresh=Wm9w...; Path=/v1/auth; Max-Age=1209600; HttpOnly; SameSite=Strict
    RefreshCookie:
      description: |
        Yenileme jetonu çerezi: `getir_refresh=<opak jeton>; Path=/v1/auth;
        Max-Age=1209600; HttpOnly; SameSite=Strict` (production'da `Secure`).
        HttpOnly: sayfadaki betik okuyamaz, XSS jetonu çalamaz. SameSite=Strict:
        başka siteden gelen istek çerezi taşımaz. `Path=/v1/auth`: jeton yalnızca
        kimlik uçlarına gider. Her yenilemede jeton değişir, süre (REFRESH_TTL)
        yeniden başlar.
      schema:
        type: string
        example: getir_refresh=Wm9w...; Path=/v1/auth; Max-Age=1209600; HttpOnly; SameSite=Strict
    RefreshCookieCleared:
      description: Yenileme çerezi silinir (`Max-Age=0`, aynı yol ve bayraklar).
      schema:
        type: string
        example: getir_refresh=; Path=/v1/auth; Max-Age=0; HttpOnly; SameSite=Strict
    DeviceCookie:
      description: |
        Cihaz çerezi (T8.1): `getir_device=dvc_<32 hex>; Path=/; Max-Age=31536000;
        HttpOnly; SameSite=Lax` (production'da `Secure`). Kimliği gateway üretir;
        biçim dışı değer yok sayılır ve yenisi verilir. "Aynı cihazdan açılmış
        hesap sayısı" risk sinyalinin anahtarıdır; istemci okumaz ve yazmaz.
      schema:
        type: string
        example: getir_device=dvc_6d32883768ffcf73beed3d86fbe9f709; Path=/; Max-Age=31536000; HttpOnly; SameSite=Lax
    NoStore:
      description: |
        Jeton ya da kişisel veri taşıyan cevap tarayıcı önbelleğine ve araya
        giren vekile yazılmaz (RFC 6749 5.1, RFC 9111).
      schema:
        type: string
        const: no-store
    WWWAuthenticate:
      description: |
        401 cevabında beklenen şema (RFC 6750): jeton yoksa `Bearer`, jeton
        geçersiz ya da süresi dolmuşsa `Bearer error="invalid_token"`.
      schema:
        type: string
        example: Bearer error="invalid_token"
    XRequestId:
      description: |
        İsteği log ve trace kayıtlarıyla eşleyen kimlik. İstemci aynı biçimde
        gönderirse korunur; göndermezse ya da biçim dışıysa gateway üretir.
      schema:
        type: string
        pattern: "^req_[0-9a-f]{32}$"
        example: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
    IdempotentReplayed:
      description: |
        Cevap, aynı `Idempotency-Key` ile gelen önceki isteğin KAYDINDAN tekrar
        edildi: uç ikinci kez çalışmadı (ikinci sipariş açılmadı). Yalnızca
        tekrar cevaplarında bulunur; hata cevabının tekrarında da gelir.
      schema:
        type: string
        enum: ["true"]

  parameters:
    RefreshCookieRequired:
      name: getir_refresh
      in: cookie
      required: true
      description: Kayıt, giriş ya da önceki yenilemenin yazdığı yenileme jetonu (tarayıcı kendisi gönderir).
      schema:
        type: string
    RefreshCookieOptional:
      name: getir_refresh
      in: cookie
      required: false
      description: Varsa iptal edilecek yenileme jetonu; yoksa çıkış yine başarılıdır (`revoked:false`).
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Kalıcı durum değiştiren uçlarda zorunludur. İstemci niyet başına bir kez
        üretir (UUID v4 önerilir) ve tekrarlarda aynen gönderir. 8-128 karakter;
        yalnızca harf, rakam, `-` ve `_` (`:` ve `{}` gibi ayırıcılar kabul
        edilmez). Anahtar kullanıcı başınadır: iki kullanıcının aynı anahtarı
        birbirini etkilemez. Tekrar kuralları: bilgi bölümündeki "Idempotency"
        maddesi.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: "^[A-Za-z0-9_-]+$"
      example: "4f1c3a2b-9d8e-4b7a-8c6d-5e4f3a2b1c0d"

    MarketIdPath:
      name: marketId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/MarketId"
    OrderIdPath:
      name: orderId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/RuntimeId"

    OrderIdPathId:
      name: id
      in: path
      required: true
      description: Sipariş kimliği (rezervasyon anında üretilen `orderId`).
      schema:
        $ref: "#/components/schemas/RuntimeId"

    PageTokenParam:
      name: pageToken
      in: query
      required: false
      description: |
        Bir onceki cevaptan gelen `page.nextPageToken`. Ilk sayfa icin bos birakilir.
        Opak degerdir: istemci icerigini yorumlamaz, oldugu gibi geri gonderir.
        Sayfa NUMARASI kullanilmaz - katalog siralamasi stok ve kampanya ile
        surekli degistigi icin offset kayar ve ayni urun iki sayfada gorunur.
        Ayni karar gRPC tarafinda da gecerlidir (getir.common.v1.PageRequest).
      schema:
        type: string

    PageSizeParam:
      name: pageSize
      in: query
      required: false
      description: |
        Sayfa basina kayit sayisi. Sinir disi degerler REDDEDILMEZ, ust sinira
        kirpilir (gRPC tarafiyla ayni davranis).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  examples:
    IdempotencyKeyInvalid:
      summary: VALIDATION_FAILED (anahtar biçimi)
      value:
        success: false
        error:
          code: VALIDATION_FAILED
          message: "Girdiğin bilgilerde bir sorun var, kontrol eder misin?"
          details:
            Idempotency-Key: "8-128 karakter olmali; yalnizca harf, rakam, - ve _"
          requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
    IdempotencyRequestInProgress:
      summary: REQUEST_IN_PROGRESS (aynı anahtarlı istek sürüyor)
      value:
        success: false
        error:
          code: REQUEST_IN_PROGRESS
          message: "İşlemin sürüyor, biraz bekler misin?"
          details:
            Idempotency-Key: ayni anahtarli istek hala isleniyor
          requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
    IdempotencyKeyReused:
      summary: CONFLICT (anahtar farklı gövdeyle kullanılmış)
      value:
        success: false
        error:
          code: CONFLICT
          message: "Bu kayıt az önce değişti. Sayfayı yenileyip tekrar dener misin?"
          details:
            Idempotency-Key: bu anahtar farkli bir istekle kullanildi; yeni bir anahtar uret
          requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"

  responses:
    Unauthenticated:
      description: |
        Erişim jetonu yok, biçimsiz, imzası tutmuyor ya da süresi dolmuş.
        İstemci önce `/v1/auth/refresh` ile yeniler; o da `401` dönerse
        kullanıcıyı girişe yönlendirir. Jetonun kendisi ve doğrulama hatasının
        sebebi cevaba konmaz.
      headers:
        WWW-Authenticate:
          $ref: "#/components/headers/WWWAuthenticate"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          examples:
            missingToken:
              summary: UNAUTHORIZED (jeton yok)
              value:
                success: false
                error:
                  code: UNAUTHORIZED
                  message: "Oturumun sona ermiş. Tekrar giriş yapman gerekiyor."
                  details:
                    Authorization: Bearer erisim jetonu gerekli
                  requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
            invalidToken:
              summary: UNAUTHORIZED (jeton geçersiz ya da süresi dolmuş)
              value:
                success: false
                error:
                  code: UNAUTHORIZED
                  message: "Oturumun sona ermiş. Tekrar giriş yapman gerekiyor."
                  details:
                    Authorization: gecersiz ya da suresi dolmus erisim jetonu
                  requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
            sessionEnded:
              summary: UNAUTHORIZED (oturum kapatılmış; yalnızca POST /v1/orders)
              value:
                success: false
                error:
                  code: UNAUTHORIZED
                  message: "Oturumun sona ermiş. Tekrar giriş yapman gerekiyor."
                  details:
                    Authorization: oturum kapatilmis ya da suresi dolmus; yeniden giris yap
                  requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"

    OrderNotFound:
      description: Sipariş bulunamadı
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          examples:
            orderNotFound:
              summary: NOT_FOUND
              value:
                success: false
                error:
                  code: NOT_FOUND
                  message: "Sipariş bulunamadı."
                  details:
                    orderId: "ord_db77f4c0e24f49919cc1d78a649c9c94"
                  requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"

    RateLimited:
      description: |
        İstek hızı sınırı aşıldı (T8.2, roadmap P2). Sınır kayan pencereyle
        (varsayılan 60 sn) Redis'te tutulur; gateway örnekleri aynı sayacı
        paylaşır. Sayım uç başınadır. Kimliksiz uçlarda istemcinin IP'si,
        kimlik isteyen uçlarda kullanıcı sayılır. Varsayılan sınırlar pencere
        başına: kayıt ve giriş 10; rezervasyon, sipariş ve 3DS 20; diğer uçlar
        (yenileme ve çıkış dahil) 120. Yalnızca kabul edilen istek
        sayılır: beklemeden yeniden denemek süreyi uzatmaz, `Retry-After`
        kadar beklemek yeter. Hız sınırı sayacına ulaşılamazsa istek geçer.
      headers:
        Retry-After:
          description: |
            Yeniden denemeden önce beklenecek tam saniye (yukarı yuvarlanır):
            penceredeki en eski kaydın düşmesine kalan süre.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          examples:
            rateLimited:
              summary: RATE_LIMITED
              value:
                success: false
                error:
                  code: RATE_LIMITED
                  message: "Çok fazla deneme yaptın. Kısa bir süre sonra tekrar dene."
                  details:
                    retryAfterSeconds: 30
                  requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"

    InternalError:
      description: |
        Beklenmeyen hata (T8.3), uçta yakalanan panik dahil. Gateway ayakta
        kalır; iç ayrıntı (panik değeri, yığın izi, bağımlı servisin mesajı)
        cevaba konmaz, günlüğe yazılır ve `requestId` ile eşleşir. Kalıcıysa
        `requestId` ile bildirilir.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          examples:
            internal:
              summary: INTERNAL
              value:
                success: false
                error:
                  code: INTERNAL
                  message: "Beklenmeyen bir sorun oldu. Birazdan tekrar dene."
                  requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"

    ServiceUnavailable:
      description: |
        Bağımlı servise ulaşılamadı ya da süre içinde cevap vermedi; mutasyon
        uçlarında tekrar korumasının deposu (Redis) erişilemez olabilir: koruma
        olmadan uç çalıştırılmaz. Yeniden denenebilir (aynı `Idempotency-Key`
        ile); iç ayrıntı (adres, sürücü mesajı) cevaba konmaz, günlüktedir.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          examples:
            serviceUnavailable:
              summary: SERVICE_UNAVAILABLE
              value:
                success: false
                error:
                  code: SERVICE_UNAVAILABLE
                  message: "Servise şu an ulaşamıyoruz. Birazdan tekrar dene."
                  requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"

  schemas:
    # --- Zarf ---------------------------------------------------------------
    ApiSuccessResponse:
      type: object
      description: Başarılı cevap zarfı. `data` uca göre özelleşir.
      required: [success, data]
      properties:
        success:
          const: true
        data:
          description: Uca özgü yük.
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    ApiErrorResponse:
      type: object
      description: Hatalı cevap zarfı.
      required: [success, error]
      properties:
        success:
          const: false
        error:
          $ref: "#/components/schemas/ApiError"

    ApiResponse:
      description: |
        Her cevap bu iki koldan biridir. `success` alanı ayırt edicidir; JSON
        boolean olduğu için OpenAPI `discriminator` anahtarı kullanılamaz.
      oneOf:
        - $ref: "#/components/schemas/ApiSuccessResponse"
        - $ref: "#/components/schemas/ApiErrorResponse"

    ApiError:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          description: Kullanıcıya gösterilebilir Türkçe açıklama.
        details:
          description: Koda özgü ek bağlam (alan hataları, stok miktarı, risk skoru...).
          type: [object, "null"]
          additionalProperties: true
        requestId:
          type: string
          pattern: "^req_[0-9a-f]{32}$"
          description: X-Request-Id başlığı ile aynı değer (`req_` + 32 küçük onaltılık karakter).

    ResponseMeta:
      type: object
      properties:
        requestId:
          type: string
        servedAt:
          type: string
          format: date-time

    ErrorCode:
      type: string
      description: |
        Makine tarafindan okunan hata sozlugu. Tek dogruluk kaynagi
        `packages/core/src/error-codes.ts` icindeki `ERROR_CODES` sabitidir;
        bu liste onun birebir aynisidir ve ayrisma olursa core kazanir.
        HTTP karsiliklari da orada (`ERROR_CODE_HTTP_STATUS`) tanimlidir,
        burada tekrar edilmez.
      enum:
        # Genel / tasima katmani
        - VALIDATION_FAILED
        - UNAUTHORIZED
        # Giriste telefon ya da sifre hatali (T8.1), HTTP 401
        - INVALID_CREDENTIALS
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        # Kayitta telefon baska hesaba ait (T8.1), HTTP 409
        - PHONE_ALREADY_REGISTERED
        - INTERNAL
        - SERVICE_UNAVAILABLE
        - RATE_LIMITED
        - REQUEST_IN_PROGRESS
        # Sozlesmede olan ama henuz yazilmamis uc (D5), HTTP 501
        - NOT_IMPLEMENTED
        # Stok ve rezervasyon
        - STOCK_INSUFFICIENT
        - RESERVATION_EXPIRED
        - RESERVATION_ACTIVE
        # Risk
        - RISK_BLOCKED
        - RISK_REVIEW
        # Odeme
        - PAYMENT_DECLINED
        - THREEDS_REQUIRED
        - THREEDS_FAILED
        - PAYMENT_METHOD_NOT_ALLOWED
        # Sepet, fiyat ve siparis
        - PRICE_CHANGED
        - COUPON_INVALID
        - MIN_BASKET_NOT_MET
        - ORDER_STATE_INVALID
        # Teslimat bolgesi
        - NO_STORE
    # --- Ortak ilkel tipler -------------------------------------------------
    Money:
      type: object
      description: |
        Tutar minor unit (kuruş) cinsinden TAM SAYIDIR. Float kullanılmaz;
        1 TL = 100. Gösterim bölmesi yalnızca istemcide yapılır.
      required: [amountMinor, currency]
      properties:
        amountMinor:
          type: integer
          format: int64
          minimum: 0
          description: |
            Kuruş cinsinden tutar. Alan adı `getir.common.v1.Money.amount_minor`
            ile birebir aynıdır (gateway yalnızca camelCase'e çevirir). "amount"
            tek başına major/minor belirsizliği taşıdığı için kullanılmaz.
          examples: [15000]
        currency:
          type: string
          enum: [TRY]
      examples:
        - amountMinor: 15000
          currency: TRY

    GeoPoint:
      type: object
      description: WGS84 koordinat çifti.
      required: [lat, lng]
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
      examples:
        - lat: 41.0082
          lng: 28.9784

    Page:
      type: object
      description: |
        Sayfalama ust verisi; liste cevaplarinda `items` ile birlikte doner.
        Imlec (cursor) tabanlidir ve `getir.common.v1.PageResponse` ile birebir
        ayni anlami tasir: gateway alan adlarini camelCase'e cevirmekten baska
        bir donusum yapmaz.
      required: [nextPageToken, totalSize]
      properties:
        nextPageToken:
          type: string
          description: |
            Bir sonraki sayfanin imleci. BOS ise liste bitmistir; istemci dongusunu
            bu alanin bosluguna gore sonlandirir, kayit sayisina gore degil.
        totalSize:
          type: integer
          minimum: 0
          description: |
            Filtreye uyan toplam kayit sayisi. Pahali sayim gereken durumlarda
            sunucu 0 dondurebilir; bu "sonuc yok" DEGIL, "sayilmadi" demektir.

    # --- Kimlik -------------------------------------------------------------
    RegisterRequest:
      type: object
      description: |
        Kimlik doğrulama telefon + şifre ile yapılır (ADR-012). E-posta
        toplanmaz: SMS/OTP altyapısı kurulmadığı için doğrulanamayan bir alan
        kimlik alanı olarak kullanılamaz. Bilinmeyen alan `400` ile reddedilir.
      required: [phone, password, fullName]
      additionalProperties: false
      properties:
        phone:
          $ref: "#/components/schemas/Phone"
        password:
          $ref: "#/components/schemas/Password"
        fullName:
          type: string
          minLength: 2
          maxLength: 80
          description: Baştaki ve sondaki boşluklar atılır; sınırlar karakter cinsindendir.

    LoginRequest:
      type: object
      required: [phone, password]
      additionalProperties: false
      properties:
        phone:
          $ref: "#/components/schemas/Phone"
        password:
          $ref: "#/components/schemas/Password"

    Phone:
      type: string
      pattern: "^\\+905[0-9]{9}$"
      description: |
        E.164 biçimi, yalnızca Türkiye ve yalnızca cep numarası (BTK: `5XX` + 7
        rakam; sabit hat ve servis numaraları reddedilir). `users.phone`
        üzerinde benzersiz indeks vardır.
      example: "+905321234567"

    Password:
      type: string
      minLength: 8
      maxLength: 72
      description: |
        Alt sınır KARAKTER (8), üst sınır BAYT (72, UTF-8): bcrypt girdinin
        ilk 72 baytını kullanır. Türkçe harfler iki bayt sayılır; JSON Schema
        bayt sınırı ifade edemediği için `maxLength` gerekli ama yeterli
        değildir, asıl kural sunucudadır.

    LogoutResult:
      type: object
      required: [revoked]
      properties:
        revoked:
          type: boolean
          description: |
            `false` HATA DEĞİLDİR: jeton zaten iptal edilmiş ya da süresi
            dolmuş olabilir.

    AuthSession:
      type: object
      description: |
        Oturum gövdesi. Yenileme jetonu burada DEĞİL, HttpOnly `getir_refresh`
        çerezindedir (`RefreshCookie`); erişim jetonu bellekte tutulur.
      required: [accessToken, expiresIn, refreshExpiresIn, user]
      properties:
        accessToken:
          type: string
          description: "`Authorization: Bearer <accessToken>` olarak gönderilir."
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          description: Erişim jetonunun saniye cinsinden ömrü (JWT_TTL = 3600).
          examples: [3600]
        refreshExpiresIn:
          type: integer
          description: |
            Çerezdeki yenileme jetonunun saniye cinsinden ömrü (REFRESH_TTL =
            1209600, 14 gün): oturum en çok bu kadar kullanılmadan kalabilir.
          examples: [1209600]
        user:
          $ref: "#/components/schemas/UserProfile"

    UserProfile:
      type: object
      required: [id, phone, fullName]
      properties:
        id:
          $ref: "#/components/schemas/RuntimeId"
        phone:
          $ref: "#/components/schemas/Phone"
        fullName:
          type: string

    # --- Katalog ------------------------------------------------------------
    Category:
      type: object
      description: |
        Kategoriler DÜZ listedir; ağaç yapısı yoktur (proto `Category` ile aynı).
        Sıralama `sortOrder` ile yapılır.
      required: [id, name, slug]
      properties:
        id:
          $ref: "#/components/schemas/CategoryId"
        name:
          type: string
        slug:
          type: string
        imageUrl:
          type: string
          format: uri
          description: |
            Her zaman MUTLAK URL. Veri göreli yol saklar; gateway `ASSET_BASE_URL`
            kökünü ekler. Görsel yoksa alan hiç gönderilmez.
        sortOrder:
          type: integer

    ContentText:
      type: string
      minLength: 1
      maxLength: 200
      description: Ekranda görünen metin; boş olamaz (CONTENT_TEXT_MAX_LENGTH).

    WelcomeContent:
      type: object
      description: |
        Karşılama ekranı (T11.6). Form KURALLARI ve hata cümleleri burada
        değildir; onlar kimlik şemalarından gelir.
      required:
        [header, hero, loginCard, categories, appDownload, features, addressSetup, appHeader]
      properties:
        header:
          type: object
          required: [brand, service, loginLabel, registerLabel]
          properties:
            brand: { $ref: "#/components/schemas/ContentText" }
            service: { $ref: "#/components/schemas/ContentText" }
            loginLabel: { $ref: "#/components/schemas/ContentText" }
            registerLabel: { $ref: "#/components/schemas/ContentText" }
        hero:
          type: object
          required: [title, banner]
          properties:
            title:
              $ref: "#/components/schemas/ContentText"
              description: Sayfanın h1'i ve banner'ın alt metni; slogan görselin içinde yazılıdır.
            banner:
              $ref: "#/components/schemas/Banner"
        loginCard:
          $ref: "#/components/schemas/LoginCardContent"
        categories:
          type: object
          required: [title]
          properties:
            title: { $ref: "#/components/schemas/ContentText" }
        appDownload:
          $ref: "#/components/schemas/AppDownloadContent"
        features:
          type: array
          minItems: 1
          maxItems: 6
          description: Tanıtım kutuları (T11.7); kategorilerin altında.
          items:
            $ref: "#/components/schemas/FeatureContent"
        addressSetup:
          $ref: "#/components/schemas/AddressSetupContent"
        appHeader:
          $ref: "#/components/schemas/AppHeaderContent"

    ContentImage:
      type: object
      description: Tek boy görsel; boyut, tarayıcının yeri önceden ayırması içindir.
      required: [url, width, height]
      properties:
        url:
          type: string
          format: uri
          description: Her zaman MUTLAK URL (gateway `ASSET_BASE_URL` ile kurar).
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }

    StoreLink:
      type: object
      description: |
        Mağaza rozeti (T11.7). `url` dışarı giden bağlantıdır, yalnızca `https`;
        gateway çözmez, olduğu gibi taşır.
      required: [label, url, badge]
      properties:
        label:
          $ref: "#/components/schemas/ContentText"
          description: Bağlantının erişilebilir adı ve rozetin alt metni.
        url:
          type: string
          format: uri
          pattern: "^https://"
        badge:
          $ref: "#/components/schemas/ContentImage"

    AppDownloadContent:
      type: object
      description: Uygulama indirme bandı (T11.7); kategorilerin altında.
      required: [title, subtitle, image, stores]
      properties:
        title: { $ref: "#/components/schemas/ContentText" }
        subtitle: { $ref: "#/components/schemas/ContentText" }
        image:
          $ref: "#/components/schemas/ContentImage"
        stores:
          type: array
          minItems: 1
          maxItems: 4
          items:
            $ref: "#/components/schemas/StoreLink"

    FeatureContent:
      type: object
      required: [image, text]
      properties:
        image:
          $ref: "#/components/schemas/ContentImage"
        text: { $ref: "#/components/schemas/ContentText" }

    AddressSetupContent:
      type: object
      description: |
        Adres ekleme penceresi (T11.8): oturum açık ama kayıtlı adres yoksa
        karşılama ekranının üstünde açılır. 1. adım harita + arama + "Bu adresi
        kullan"; 2. adım detay formu + "Kaydet". Form kuralları ve hata
        cümleleri `CreateAddressRequest`'tedir.
      required:
        - title
        - backLabel
        - pinHint
        - searchLabel
        - searchPlaceholder
        - searchSubmitLabel
        - searchEmptyNotice
        - useAddressLabel
        - resolvingLabel
        - unresolvedNotice
        - kindLabel
        - kinds
        - titleLabel
        - lineLabel
        - buildingLabel
        - floorLabel
        - apartmentLabel
        - noteLabel
        - saveLabel
        - savingLabel
        - noMarketNotice
        - map
      properties:
        title: { $ref: "#/components/schemas/ContentText" }
        backLabel:
          $ref: "#/components/schemas/ContentText"
          description: 2. adımdaki geri düğmesinin erişilebilir adı.
        pinHint: { $ref: "#/components/schemas/ContentText" }
        searchLabel: { $ref: "#/components/schemas/ContentText" }
        searchPlaceholder: { $ref: "#/components/schemas/ContentText" }
        searchSubmitLabel: { $ref: "#/components/schemas/ContentText" }
        searchEmptyNotice: { $ref: "#/components/schemas/ContentText" }
        useAddressLabel: { $ref: "#/components/schemas/ContentText" }
        resolvingLabel: { $ref: "#/components/schemas/ContentText" }
        unresolvedNotice:
          $ref: "#/components/schemas/ContentText"
          description: Pinin olduğu yer için adres bulunamadı; satırı kullanıcı yazar.
        kindLabel: { $ref: "#/components/schemas/ContentText" }
        kinds:
          type: array
          minItems: 1
          maxItems: 3
          description: Adres türleri tekildir.
          items:
            $ref: "#/components/schemas/AddressKindOption"
        titleLabel: { $ref: "#/components/schemas/ContentText" }
        lineLabel: { $ref: "#/components/schemas/ContentText" }
        buildingLabel: { $ref: "#/components/schemas/ContentText" }
        floorLabel: { $ref: "#/components/schemas/ContentText" }
        apartmentLabel: { $ref: "#/components/schemas/ContentText" }
        noteLabel: { $ref: "#/components/schemas/ContentText" }
        saveLabel: { $ref: "#/components/schemas/ContentText" }
        savingLabel: { $ref: "#/components/schemas/ContentText" }
        noMarketNotice:
          $ref: "#/components/schemas/ContentText"
          description: Seçilen yere hizmet veren market yok; uyarıdır, kaydı engellemez.
        map:
          $ref: "#/components/schemas/MapContent"

    AppHeaderContent:
      type: object
      description: |
        Oturumlu sayfaların üst barı (T11.10): logo | arama kutusu (içinde
        teslimat adresi) | Profil. Yalnızca metinler.
      required:
        - searchLabel
        - searchPlaceholder
        - searchClearLabel
        - addressLabel
        - addressListLabel
        - addressBookTitle
        - addressConfirmLabel
        - addressAddPrompt
        - addressAddLabel
        - addressLoginLabel
        - noAddressNotice
        - addressLoadingLabel
        - profileLabel
        - accountLabel
        - logoutLabel
        - logoutPendingLabel
      properties:
        searchLabel: { $ref: "#/components/schemas/ContentText" }
        searchPlaceholder: { $ref: "#/components/schemas/ContentText" }
        searchClearLabel: { $ref: "#/components/schemas/ContentText" }
        addressLabel: { $ref: "#/components/schemas/ContentText" }
        addressListLabel: { $ref: "#/components/schemas/ContentText" }
        addressBookTitle: { $ref: "#/components/schemas/ContentText" }
        addressConfirmLabel: { $ref: "#/components/schemas/ContentText" }
        addressAddPrompt: { $ref: "#/components/schemas/ContentText" }
        addressAddLabel: { $ref: "#/components/schemas/ContentText" }
        addressLoginLabel: { $ref: "#/components/schemas/ContentText" }
        noAddressNotice: { $ref: "#/components/schemas/ContentText" }
        addressLoadingLabel: { $ref: "#/components/schemas/ContentText" }
        profileLabel: { $ref: "#/components/schemas/ContentText" }
        accountLabel: { $ref: "#/components/schemas/ContentText" }
        logoutLabel: { $ref: "#/components/schemas/ContentText" }
        logoutPendingLabel: { $ref: "#/components/schemas/ContentText" }

    AddressKindOption:
      type: object
      required: [kind, label, icon]
      properties:
        kind:
          $ref: "#/components/schemas/AddressKind"
        label: { $ref: "#/components/schemas/ContentText" }
        icon:
          $ref: "#/components/schemas/ContentText"
          description: Emoji ("🏠").

    MapContent:
      type: object
      description: |
        OpenStreetMap karoları. Karo adresi dışarı giden https adresidir;
        gateway çözmez. Atıf metni lisans gereği haritada görünür.
      required: [tileUrl, attribution, center, zoom]
      properties:
        tileUrl:
          type: string
          pattern: "^https://"
          description: "`{z}`, `{x}` ve `{y}` yer tutucularını taşır."
          example: "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
        attribution: { $ref: "#/components/schemas/ContentText" }
        center:
          $ref: "#/components/schemas/GeoPoint"
        zoom:
          type: integer
          minimum: 1
          maximum: 19

    Banner:
      type: object
      description: |
        Aynı görselin boyları (srcset) ve doğal boyutu; boyut oran içindir,
        tarayıcı yeri önceden ayırır. Aynı genişlik iki kez yazılamaz.
      required: [sources, width, height]
      properties:
        sources:
          type: array
          minItems: 1
          maxItems: 4
          items:
            type: object
            required: [url, width]
            properties:
              url:
                type: string
                format: uri
                description: Her zaman MUTLAK URL (gateway `ASSET_BASE_URL` ile kurar).
              width:
                type: integer
                minimum: 1
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1

    PhoneCountry:
      type: object
      description: |
        Ülke kodu seçicisinin bir satırı. Telefon kuralı bugün yalnızca `+90`
        kabul eder; listedeki başka bir kod formda reddedilir.
      required: [code, name, dialCode, flagUrl]
      properties:
        code:
          type: string
          pattern: "^[A-Z]{2}$"
          example: TR
        name:
          $ref: "#/components/schemas/ContentText"
        dialCode:
          type: string
          pattern: "^\\+[1-9][0-9]{0,2}$"
          example: "+90"
        flagUrl:
          type: string
          format: uri

    LoginCardContent:
      type: object
      description: |
        Karşılama kartı (telefon + "Devam Et") ile giriş ve kayıt penceresinin
        metinleri. Geliştirmeye özel demo hesap listesinin metni burada yoktur:
        o araç production paketine girmez.
      required:
        - title
        - countryLabel
        - phoneLabel
        - phonePlaceholder
        - continueLabel
        - closeLabel
        - showPasswordLabel
        - countries
        - forgotPasswordLabel
        - login
        - register
        - resetPassword
      properties:
        title: { $ref: "#/components/schemas/ContentText" }
        countryLabel: { $ref: "#/components/schemas/ContentText" }
        phoneLabel: { $ref: "#/components/schemas/ContentText" }
        phonePlaceholder: { $ref: "#/components/schemas/ContentText" }
        continueLabel: { $ref: "#/components/schemas/ContentText" }
        closeLabel: { $ref: "#/components/schemas/ContentText" }
        showPasswordLabel: { $ref: "#/components/schemas/ContentText" }
        countries:
          type: array
          minItems: 1
          maxItems: 10
          description: Ülke kodları tekildir.
          items:
            $ref: "#/components/schemas/PhoneCountry"
        login:
          type: object
          required:
            [
              passwordLabel,
              submitLabel,
              pendingLabel,
              registerPrompt,
              registerLinkLabel,
              unknownPhoneNotice,
            ]
          properties:
            passwordLabel: { $ref: "#/components/schemas/ContentText" }
            submitLabel: { $ref: "#/components/schemas/ContentText" }
            pendingLabel: { $ref: "#/components/schemas/ContentText" }
            registerPrompt: { $ref: "#/components/schemas/ContentText" }
            registerLinkLabel: { $ref: "#/components/schemas/ContentText" }
            unknownPhoneNotice:
              $ref: "#/components/schemas/ContentText"
              description: Kayıtsız numara yazılınca telefonun altında (T11.7).
        register:
          type: object
          required:
            [
              fullNameLabel,
              passwordLabel,
              submitLabel,
              pendingLabel,
              loginPrompt,
              loginLinkLabel,
              knownPhoneNotice,
            ]
          properties:
            fullNameLabel: { $ref: "#/components/schemas/ContentText" }
            passwordLabel: { $ref: "#/components/schemas/ContentText" }
            submitLabel: { $ref: "#/components/schemas/ContentText" }
            pendingLabel: { $ref: "#/components/schemas/ContentText" }
            loginPrompt: { $ref: "#/components/schemas/ContentText" }
            loginLinkLabel: { $ref: "#/components/schemas/ContentText" }
            knownPhoneNotice:
              $ref: "#/components/schemas/ContentText"
              description: Kayıtlı numara yazılınca telefonun altında (T11.7).
        forgotPasswordLabel:
          $ref: "#/components/schemas/ContentText"
          description: Kartta ve giriş penceresinde "Şifremi unuttum" (T11.9; yalnızca geliştirmede görünür).
        resetPassword:
          type: object
          description: Şifre yenileme penceresi (T11.9); kayıtsız numara uyarısı `login.unknownPhoneNotice`.
          required:
            [
              title,
              description,
              passwordLabel,
              submitLabel,
              pendingLabel,
              loginPrompt,
              loginLinkLabel,
            ]
          properties:
            title: { $ref: "#/components/schemas/ContentText" }
            description: { $ref: "#/components/schemas/ContentText" }
            passwordLabel: { $ref: "#/components/schemas/ContentText" }
            submitLabel: { $ref: "#/components/schemas/ContentText" }
            pendingLabel: { $ref: "#/components/schemas/ContentText" }
            loginPrompt: { $ref: "#/components/schemas/ContentText" }
            loginLinkLabel: { $ref: "#/components/schemas/ContentText" }

    Product:
      type: object
      description: |
        Bir marketin TEKLİFİ olarak ürün (ADR-15): fiyat o markete özeldir.
        Fiyat catalog-svc'den (Offer), `availableQuantity` inventory-svc'den
        gelir; gateway iki cevabı BİRLEŞTİRİR (B27).
      required: [id, offerId, marketId, sku, name, categoryId, price, isActive]
      properties:
        id:
          $ref: "#/components/schemas/ProductId"
        offerId:
          $ref: "#/components/schemas/OfferId"
        marketId:
          $ref: "#/components/schemas/MarketId"
        sku:
          type: string
          description: |
            Servisler arası birleştirme anahtarı; Redis stok anahtarında
            (`stock:{store}:avail:{sku}`) ve stock_ledger'da da bu değer geçer.
            Biçim kuralı tek kaynakta: `packages/core` → `SKU_PATTERN`.
        name:
          type: string
        description:
          type: string
        categoryId:
          $ref: "#/components/schemas/CategoryId"
        imageUrl:
          type: string
          format: uri
          description: |
            Her zaman MUTLAK URL. Veri göreli yol saklar; gateway `ASSET_BASE_URL`
            kökünü ekler. Görsel yoksa alan hiç gönderilmez.
        price:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: |
            BU MARKETTEKİ liste fiyatı; kampanya/indirim UYGULANMAMIŞ hâlidir.
            İndirim `packages/pricing` içinde sepet düzeyinde hesaplanır.
        unit:
          type: string
          enum: [PIECE, KILOGRAM, LITER, PACK]
          description: |
            `getir.common.v1.Unit` ile birebir aynı sözlük. Türkçe etiket
            istemcide üretilir.
        isActive:
          type: boolean
          description: |
            Teklif satışta mı (`getir.catalog.v1.Offer.is_active`). `false`:
            market ürünü satıştan kaldırmıştır; kayıt silinmez. Liste pasif
            teklifi de döndürür; istemci onu "Satışta değil" gösterir ve sepete
            eklemez (T7.6). Bağlayıcı kontrol rezervasyondadır: pasif teklif
            orada bulunamamış sayılır.
        availableQuantity:
          type: integer
          minimum: 0
          description: |
            `marketId` kapsamında satılabilir adet. Kaynağı inventory-svc'dir
            ve TOPLU sorgulanır (`CheckAvailability(marketId, sku[])`, B27).

            `0` "tükendi" demektir. inventory-svc'de stok kaydı olmayan ürün de
            `0` gelir ("satılamaz"): rezervasyon da onu reddeder.

            **İsteğe bağlıdır:** alan YOKSA "stok bilgisi yok" demektir, "stok 0"
            değil. inventory-svc cevap vermediyse (hata ya da gateway'in stok
            süre sınırı, `GATEWAY_STOCK_TIMEOUT_MS`) gateway alanı yazmaz; katalog
            stoksuz görünümle ayakta kalır (T8.4). İstemci bu durumda stok rozeti
            göstermez; bağlayıcı kontrol rezervasyondadır (ADR-13).

    # --- Pazaryeri (ADR-15) -------------------------------------------------
    PricingRules:
      type: object
      description: |
        Marketin sepet kuralları. Market paneli olmadığı için bugün seed'den
        gelir; `packages/pricing` bu değerleri PARAMETRE olarak alır.
      required: [minBasket, deliveryFee, freeDeliveryThreshold]
      properties:
        minBasket:
          $ref: "#/components/schemas/Money"
        deliveryFee:
          $ref: "#/components/schemas/Money"
        freeDeliveryThreshold:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: Ara toplam (indirim ÖNCESİ, B12) buna ulaşırsa teslimat ücretsiz.

    Market:
      type: object
      required:
        [
          id,
          name,
          brand,
          location,
          deliveryRadiusMeters,
          isOpen,
          deliveryTime,
          rating,
          pricingRules,
        ]
      properties:
        id:
          $ref: "#/components/schemas/MarketId"
        name:
          type: string
          example: "Migros Jet - Moda"
        brand:
          type: string
          example: "Migros Jet"
        logoUrl:
          type: string
          format: uri
          description: MUTLAK URL (gateway kurar); logosu olmayan markette alan yok.
        location:
          $ref: "#/components/schemas/GeoPoint"
        deliveryRadiusMeters:
          type: integer
          minimum: 1
        isOpen:
          type: boolean
          description: Kapalı market listede görünür ama sipariş almaz (rezervasyon NO_STORE / STORE_CLOSED).
        deliveryTime:
          type: object
          required: [minMinutes, maxMinutes]
          properties:
            minMinutes: { type: integer, minimum: 0 }
            maxMinutes: { type: integer, minimum: 0 }
        rating:
          type: object
          description: Seed'de sabit; yorum sistemi kapsam dışı. Proto onda bir hassasiyetle tam sayı taşır (47 → 4.7).
          required: [average, count]
          properties:
            average: { type: number, minimum: 0, maximum: 5, example: 4.7 }
            count: { type: integer, minimum: 0 }
        pricingRules:
          $ref: "#/components/schemas/PricingRules"

    NearbyMarket:
      type: object
      required: [market, distanceMeters]
      properties:
        market:
          $ref: "#/components/schemas/Market"
        distanceMeters:
          type: integer
          minimum: 0
          description: Her zaman `market.deliveryRadiusMeters`'tan küçük veya eşittir.

    SearchResult:
      description: |
        Genel aramada bir market (T9.6): yakındaki market satırı (`NearbyMarket`)
        + arama bilgisi. İstemci aynı market kartını ve ürün satırını kullanır.
      allOf:
        - $ref: "#/components/schemas/NearbyMarket"
        - type: object
          required: [marketNameMatched, products, totalProductMatches]
          properties:
            marketNameMatched:
              type: boolean
              description: |
                Market adı sorguyla eşleşti; eşleştiyse market ürünsüz de
                listelenir ve `products` boştur.
            products:
              type: array
              maxItems: 3
              description: |
                Eşleşen AKTİF ürünlerin ilkleri, market sayfasıyla aynı sırada.
                Stok market sayfasındaki kuralla (`Product.availableQuantity`).
              items:
                $ref: "#/components/schemas/Product"
            totalProductMatches:
              type: integer
              minimum: 0
              description: |
                Bu marketteki toplam eşleşen ürün; `products`'tan fazlaysa
                istemci "+N ürün daha" gösterir.

    # --- Kimlikler (ADR-15) -------------------------------------------------
    RuntimeId:
      type: string
      description: Çalışma anında üretilen kimlik (@getir/core ID_PREFIX + 32 hex). UUID DEĞİLDİR.
      pattern: "^(ord|usr|pay|crr|rsv|req)_[0-9a-f]{32}$"
      example: "ord_db77f4c0e24f49919cc1d78a649c9c94"
    MarketId:
      type: string
      pattern: "^mkt_[a-z0-9]+(?:-[a-z0-9]+)*$"
      maxLength: 64
      example: "mkt_migros-jet-moda"
    ProductId:
      type: string
      pattern: "^prd_[a-z0-9]+(?:-[a-z0-9]+)*$"
      maxLength: 64
      example: "prd_sut-1l"
    CategoryId:
      type: string
      pattern: "^cat_[a-z0-9]+(?:-[a-z0-9]+)*$"
      maxLength: 64
      example: "cat_sut-kahvaltilik"
    OfferId:
      type: string
      pattern: "^ofr_[a-z0-9]+(?:-[a-z0-9]+)*$"
      maxLength: 64
      example: "ofr_migros-jet-moda-sut-1l"

    # --- Sepet ve rezervasyon ----------------------------------------------
    CartItemInput:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          $ref: "#/components/schemas/ProductId"
        quantity:
          type: integer
          minimum: 1
          maximum: 99

    ReserveCartRequest:
      type: object
      required: [marketId, items, address, expectedTotal]
      properties:
        marketId:
          $ref: "#/components/schemas/MarketId"
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/CartItemInput"
        address:
          $ref: "#/components/schemas/DeliveryAddress"
        expectedTotal:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: |
            Kullanıcının ekranda gördüğü toplam. Sunucu tutarı kendisi hesaplar;
            tutmazsa 409 PRICE_CHANGED. Zorunlu: isteğe bağlı olsaydı istemci
            göndermeyerek kontrolü atlayabilirdi.
        couponCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Kupon kodu (ör. ILK10). Uygulanamazsa 422 COUPON_INVALID.

    ReservationLine:
      type: object
      required: [productId, name, quantity, unitPrice, lineTotal]
      properties:
        productId:
          $ref: "#/components/schemas/ProductId"
        name:
          type: string
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          $ref: "#/components/schemas/Money"
        lineTotal:
          $ref: "#/components/schemas/Money"

    Reservation:
      type: object
      description: |
        Açılan taslak sipariş. Kalemler ve tutar dönmez: taslak ancak sunucunun
        toplamı `expectedTotal` ile tuttuysa açılır; döküm için GET /v1/orders/{id}.
      required: [orderId, status]
      properties:
        orderId:
          allOf:
            - $ref: "#/components/schemas/RuntimeId"
          description: Rezervasyonun ve ondan doğacak siparişin ortak kimliği.
        status:
          $ref: "#/components/schemas/OrderStatus"
        expiresAt:
          type: string
          format: date-time
          description: Stok kilidinin biteceği an (T11.2). Yalnızca kilitsiz eski taslakta yoktur.
        ttlSeconds:
          type: integer
          minimum: 0
          description: |
            Kilidin kalan saniyesi, sunucunun saatiyle (T11.4); `expiresAt` ile birlikte
            gelir, dolmuşsa 0. İstemcinin saati kaysa da geri sayım bundan başlar.

    ReservationRelease:
      type: object
      required: [orderId, released, releasedAt]
      properties:
        orderId:
          $ref: "#/components/schemas/RuntimeId"
        released:
          type: boolean
        releasedAt:
          type: string
          format: date-time

    # --- Sipariş ------------------------------------------------------------
    OrderStatus:
      type: string
      description: |
        Saga boyunca siparisin gectigi durumlar. Tek dogruluk kaynagi
        `packages/core/src/constants.ts` icindeki `ORDER_STATUS` sabitidir.
      enum:
        - DRAFT
        - RISK_CHECK
        - REVIEW
        - RESERVED
        - AWAITING_PAYMENT
        - PAID
        - PAYMENT_FAILED
        - EXPIRED
        - CANCELLED
        - REJECTED
        - PREPARING
        - ON_THE_WAY
        - DELIVERED
    DeliveryAddress:
      type: object
      description: |
        Teslimat adresi: rezervasyonda verilir, siparişte gösterilir. Adres
        etiketi ("Ev") ve kurye notu sipariş sözleşmesinde olmadığı için yoktur;
        gönderilirse bilinmeyen alan olarak reddedilir.
      required: [line, location]
      properties:
        line:
          type: string
          minLength: 1
          maxLength: 240
          description: Serbest metin adres; yalnızca gösterim içindir.
        location:
          $ref: "#/components/schemas/GeoPoint"

    SavedAddress:
      type: object
      description: |
        Kayıtlı adres (adres defteri, T8.1 users.addresses[]): teslimat adresi +
        etiket + isteğe bağlı not. Siparişe giderken yalnızca `line` ve
        `location` taşınır (`DeliveryAddress`).
      required: [title, line, location]
      properties:
        title:
          type: string
          minLength: 1
          description: Kullanıcının verdiği ad ("Ev", "İş").
        line:
          type: string
          minLength: 1
          maxLength: 240
        location:
          $ref: "#/components/schemas/GeoPoint"
        kind:
          $ref: "#/components/schemas/AddressKind"
        building:
          type: string
          maxLength: 20
        floor:
          type: string
          maxLength: 20
        apartment:
          type: string
          maxLength: 20
        note:
          type: string
          maxLength: 240

    AddressKind:
      type: string
      description: Adres türü (seçicideki ikon); eski kayıtlarda olmayabilir.
      enum: [HOME, WORK, OTHER]

    CreateAddressRequest:
      type: object
      description: |
        Yeni kayıtlı adres (T11.8). Bilinmeyen alan reddedilir. Boş bırakılan
        isteğe bağlı alan kaydedilmez.
      required: [title, kind, line, location]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 40
          description: Adres adı ("Ev", "İş"); defterde tekildir.
        kind:
          $ref: "#/components/schemas/AddressKind"
        line:
          type: string
          minLength: 1
          maxLength: 240
          description: Haritadan gelen ya da kullanıcının yazdığı adres satırı.
        location:
          $ref: "#/components/schemas/GeoPoint"
        building:
          type: string
          maxLength: 20
        floor:
          type: string
          maxLength: 20
        apartment:
          type: string
          maxLength: 20
        note:
          type: string
          maxLength: 240
          description: Adres tarifi (kurye için).

    ReverseGeocodeResult:
      type: object
      required: [line]
      properties:
        line:
          type: string
          minLength: 1
          maxLength: 240

    GeoPlace:
      type: object
      required: [line, location]
      properties:
        line:
          type: string
          minLength: 1
          maxLength: 240
        location:
          $ref: "#/components/schemas/GeoPoint"

    GeoSearchResult:
      type: object
      description: Sınırlı liste (sayfalanmaz); sonuç yoksa boş.
      required: [items]
      properties:
        items:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/GeoPlace"

    CreateOrderRequest:
      type: object
      required: [orderId, payment]
      properties:
        orderId:
          allOf:
            - $ref: "#/components/schemas/RuntimeId"
          description: Rezervasyondan dönen kimlik. Sepet ve adres tekrar gönderilmez.
        payment:
          type: object
          required: [method, cardToken]
          properties:
            method:
              type: string
              enum: [CARD]
            cardToken:
              type: string
              minLength: 1
              description: Demo ödeme sağlayıcısının ürettiği jeton; kart numarası taşınmaz.

    ThreeDsRequest:
      type: object
      required: [challengeId, otp]
      properties:
        challengeId:
          type: string
        otp:
          type: string
          minLength: 6
          maxLength: 6
          pattern: "^[0-9]{6}$"

    ThreeDsChallenge:
      type: object
      description: 3DS bekleyen siparişin doğrulama jetonu.
      required: [challengeId]
      properties:
        challengeId:
          type: string

    OrderPlacement:
      type: object
      description: |
        Sipariş ve 3DS cevabı. `threeDs` yalnızca doğrulama bekleniyorsa
        (`AWAITING_PAYMENT`) vardır; ayrı bir bayrak tutulmaz.
      required: [orderId, status]
      properties:
        orderId:
          $ref: "#/components/schemas/RuntimeId"
        status:
          $ref: "#/components/schemas/OrderStatus"
        threeDs:
          $ref: "#/components/schemas/ThreeDsChallenge"

    OrderTimelineEntry:
      type: object
      required: [status, at]
      properties:
        status:
          $ref: "#/components/schemas/OrderStatus"
        at:
          type: string
          format: date-time
        note:
          type: string
          description: İsteğe bağlı kısa açıklama anahtarı (ör. iptal gerekçesi).

    CourierSummary:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: "#/components/schemas/RuntimeId"
        name:
          type: string
        location:
          $ref: "#/components/schemas/GeoPoint"
        etaMinutes:
          type: integer
          minimum: 0

    Order:
      type: object
      description: Tutarlar taslakta dondurulmuştur; total = subtotal + deliveryFee - discount.
      required:
        [
          id,
          status,
          marketId,
          lines,
          subtotal,
          deliveryFee,
          discount,
          total,
          address,
          timeline,
          createdAt,
        ]
      properties:
        id:
          $ref: "#/components/schemas/RuntimeId"
        status:
          $ref: "#/components/schemas/OrderStatus"
        marketId:
          $ref: "#/components/schemas/MarketId"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/ReservationLine"
        subtotal:
          $ref: "#/components/schemas/Money"
        deliveryFee:
          $ref: "#/components/schemas/Money"
        discount:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: Kupon indirimi; pozitif tutardır ve toplamdan düşülür.
        total:
          $ref: "#/components/schemas/Money"
        address:
          $ref: "#/components/schemas/DeliveryAddress"
        timeline:
          type: array
          description: Durum geçmişi, eskiden yeniye.
          items:
            $ref: "#/components/schemas/OrderTimelineEntry"
        courier:
          $ref: "#/components/schemas/CourierSummary"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        reservationExpiresAt:
          type: string
          format: date-time
          description: |
            Stok kilidinin bitiş anı; yalnızca kilit canlıyken (DRAFT, RESERVED,
            AWAITING_PAYMENT) gelir (T11.4).
        reservationTtlSeconds:
          type: integer
          minimum: 0
          description: Kilidin sunucunun saatiyle kalan saniyesi; `reservationExpiresAt` ile birlikte gelir.

    # --- Gerçek zamanlı -----------------------------------------------------
    RealtimeToken:
      type: object
      required: [token, room, expiresAt, ttlSeconds]
      properties:
        token:
          type: string
        room:
          type: string
          description: Jetonun yetkili olduğu tek oda.
          examples: ["order:ord_db77f4c0e24f49919cc1d78a649c9c94"]
        expiresAt:
          type: string
          format: date-time
        ttlSeconds:
          type: integer
          minimum: 1
