# Gateway REST sözleşmesi (OpenAPI 3.1).
# Bu dosya EL İLE düzenlenen iskelettir; T19.1'de packages/contracts altındaki Zod
# şemalarından üretilen sürüm burayı devralacak. Ayrıntı: docs/api/README.md
openapi: 3.1.0

info:
  title: Quick Commerce Gateway API
  version: 0.1.0
  summary: Hızlı market siparişi için genel REST yüzeyi
  description: |
    Go gateway'in dışarıya açtığı tek REST yüzeyi. Gateway istekleri doğrular,
    kimliği çözer, idempotency anahtarını yönetir ve gRPC ile iç servislere
    (catalog, inventory, order, payment, risk, courier) dağıtır.

    Sözleşme kuralları:

    * **Zarf**: her cevap `ApiResponse` zarfıyla döner; `success` alanı başarıyı
      hatadan ayırır. HTTP durum kodu ile `error.code` birlikte okunur.
    * **Para**: tüm tutarlar minor unit (kuruş) cinsinden **tam sayıdır**.
      Float kullanılmaz, istemci gösterim anında 100'e böler.
    * **Idempotency**: kalıcı durum değiştiren uçlarda `Idempotency-Key` başlığı
      zorunludur. Aynı anahtar + aynı gövde ilk cevabı tekrar döndürür; aynı
      anahtar + farklı gövde `REQUEST_IN_PROGRESS` ile reddedilir.
      `POST /v1/auth/login` ve `POST /v1/darkstores/resolve` kalıcı durum
      değiştirmediği (biri oturum jetonu üretir, diğeri sorgu niteliğindedir)
      için bu başlığı istemez.
    * **İzleme**: her cevapta `X-Request-Id` başlığı bulunur; hata gövdesindeki
      `error.requestId` ile aynı değerdir ve log/trace kayıtlarıyla eşleşir.
      Biçim `req_` + 32 küçük onaltılık karakterdir. İstemci bu biçimde kendi
      kimliğini gönderebilir, gönderdiği korunur; biçim dışı değer yok sayılır
      ve gateway yenisini üretir.
  license:
    name: MIT
  contact:
    name: quick-commerce-microservices

servers:
  - url: http://localhost:8080
    description: Yerel geliştirme (gateway)

tags:
  - name: auth
    description: Kayıt ve oturum açma
  - name: catalog
    description: Kategori ve ürün listeleme
  - name: darkstore
    description: Konumdan karanlık mağaza çözümleme
  - name: cart
    description: Sepet ve stok rezervasyonu
  - name: orders
    description: Sipariş oluşturma, 3DS ve sorgulama
  - name: realtime
    description: Socket.io odaları için kısa ömürlü jeton

security:
  - bearerAuth: []

paths:
  /v1/auth/register:
    post:
      tags: [auth]
      operationId: registerUser
      summary: Yeni kullanıcı kaydı
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Kullanıcı oluşturuldu, oturum açıldı
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AuthSession"
        "400":
          description: Gövde doğrulaması başarısız ya da idempotency başlığı yok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                validationError:
                  summary: VALIDATION_FAILED
                  value:
                    success: false
                    error:
                      code: VALIDATION_FAILED
                      message: "İstek gövdesi geçersiz."
                      details:
                        fieldErrors:
                          password: "En az 8 karakter olmalı."
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
                idempotencyKeyRequired:
                  summary: VALIDATION_FAILED
                  value:
                    success: false
                    error:
                      code: VALIDATION_FAILED
                      message: "Idempotency-Key başlığı zorunludur."
                      details: null
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
        "409":
          description: Telefon numarası kayıtlı ya da anahtar farklı gövdeyle tekrar kullanıldı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                phoneAlreadyRegistered:
                  summary: CONFLICT
                  value:
                    success: false
                    error:
                      code: CONFLICT
                      message: "Bu telefon numarasıyla kayıtlı bir hesap var."
                      details:
                        phone: "+905321234567"
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
                idempotencyKeyReused:
                  summary: REQUEST_IN_PROGRESS
                  value:
                    success: false
                    error:
                      code: REQUEST_IN_PROGRESS
                      message: "Aynı Idempotency-Key farklı bir gövde ile kullanıldı."
                      details:
                        idempotencyKey: "4f1c3a2b-9d8e-4b7a-8c6d-5e4f3a2b1c0d"
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/auth/login:
    post:
      tags: [auth]
      operationId: loginUser
      summary: Oturum açma
      description: |
        Kalıcı durum değiştirmediği için `Idempotency-Key` istemez.
        Dönen erişim jetonu JWT_TTL (3600 sn) boyunca geçerlidir.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Oturum açıldı
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AuthSession"
        "400":
          description: Gövde doğrulaması başarısız
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                validationError:
                  summary: VALIDATION_FAILED
                  value:
                    success: false
                    error:
                      code: VALIDATION_FAILED
                      message: "Telefon numarası biçimi geçersiz."
                      details:
                        fieldErrors:
                          phone: "Telefon +90 ile başlayan 13 haneli olmalı."
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
        "401":
          description: Kimlik bilgileri hatalı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                invalidCredentials:
                  summary: UNAUTHORIZED
                  value:
                    success: false
                    error:
                      code: UNAUTHORIZED
                      message: "Telefon numarası veya parola hatalı."
                      details: null
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/categories:
    get:
      tags: [catalog]
      operationId: listCategories
      summary: Kategori ağacını listele
      description: |
        Sorgu parametresi ALMAZ. Tanınmayan her parametre sessizce yok sayılmaz,
        `400 VALIDATION_FAILED` ile reddedilir ve `details` parametre adını taşır:
        yazım hatalı bir filtre filtrelenmemiş listeyi filtrelenmiş sandırmasın.

        SAYFALANMAZ: kategori taksonomisi sınırlı bir listedir (en fazla 100,
        seed fazlasını yazmaz). Bu yüzden cevapta `page` alanı yoktur.
      security: []
      responses:
        "200":
          description: Kategori listesi
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            maxItems: 100
                            items:
                              $ref: "#/components/schemas/Category"
        "400":
          description: Tanınmayan sorgu parametresi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                unknownQuery:
                  summary: VALIDATION_FAILED
                  value:
                    success: false
                    error:
                      code: VALIDATION_FAILED
                      message: "Girdiğin bilgilerde bir sorun var, kontrol eder misin?"
                      details:
                        categoryID: "bu uc bu parametreyi kabul etmiyor"
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/markets:
    get:
      tags: [catalog]
      operationId: listNearbyMarkets
      summary: Konuma hizmet veren marketler (ADR-15)
      description: |
        Pazaryeri: kullanıcı marketi KENDİSİ seçer. Teslimat yarıçapı konumu
        kapsayan marketler yakından uzağa döner; kapalı marketler de listede
        vardır (`isOpen: false` → "Kapalı" rozeti). Hiçbiri yoksa BOŞ liste
        döner — hata değil ("bölgende market yok").
      security: []
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: lng
          in: query
          required: true
          schema: { type: number, minimum: -180, maximum: 180 }
      responses:
        "200":
          description: Yakındaki marketler
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/NearbyMarket"
        "400":
          description: |
            Konum eksik, sayı değil ya da WGS84 aralığı dışında. Sebep
            `details` alanında Türkçedir, örn. `{"lat": "enlem -90 ile 90 arasinda olmali"}`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/markets/{marketId}:
    get:
      tags: [catalog]
      operationId: getMarket
      summary: Market sayfası başlığı (puan, süre, fiyat kuralları)
      security: []
      parameters:
        - $ref: "#/components/parameters/MarketIdPath"
      responses:
        "200":
          description: Market
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Market"
        "400":
          description: |
            Market kimliği `mkt_` biçiminde değil ya da tanınmayan sorgu
            parametresi (VALIDATION_FAILED; `details.marketId` sebebi taşır).
            Biçimi doğru ama olmayan market 404'tür.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Market yok (NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/markets/{marketId}/categories:
    get:
      tags: [catalog]
      operationId: listMarketCategories
      summary: Marketin teklifi olan kategoriler
      description: |
        Manav yalnızca meyve-sebze kategorisini döndürür. `/v1/categories` gibi
        sayfalanmaz; en fazla 100 kategori.
      security: []
      parameters:
        - $ref: "#/components/parameters/MarketIdPath"
      responses:
        "200":
          description: Kategoriler, sortOrder ile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            maxItems: 100
                            items:
                              $ref: "#/components/schemas/Category"
        "400":
          description: |
            Market kimliği `mkt_` biçiminde değil ya da tanınmayan sorgu
            parametresi (VALIDATION_FAILED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Market yok (NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /v1/markets/{marketId}/products:
    get:
      tags: [catalog]
      operationId: listMarketProducts
      summary: Marketin ürünleri, o marketin fiyatı ve stoğuyla
      description: |
        FİYAT markete özeldir (ADR-15): aynı ürün başka markette farklı fiyattadır.
        `q` verilirse arama yapılır; `categoryId` ile birlikte kullanılabilir.
        Market var ama eşleşme yoksa BOŞ liste döner; market yoksa NOT_FOUND.
      security: []
      parameters:
        - $ref: "#/components/parameters/MarketIdPath"
        - name: categoryId
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CategoryId"
        - name: q
          in: query
          required: false
          schema: { type: string, minLength: 2, maxLength: 64 }
        - $ref: "#/components/parameters/PageTokenParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: Ürün sayfası
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, page]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/Product"
                          page:
                            $ref: "#/components/schemas/Page"
        "400":
          description: |
            Geçersiz istek (VALIDATION_FAILED): `mkt_` biçiminde olmayan market,
            `cat_` biçiminde olmayan kategori ya da 2-64 karakter dışındaki arama.
            Biçimi bozuk kategori BOŞ LİSTE değil 400'dür: yazım hatası "bu
            kategoride ürün yok" sanılmasın.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Market yok (NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/cart/reserve:
    post:
      tags: [cart]
      operationId: reserveCart
      summary: Sepeti fiyatlandır ve taslak sipariş aç
      description: |
        Sepeti sunucuda fiyatlandırıp taslak sipariş açar ve `orderId` üretir
        (T7.5, order-service `CreateDraftOrder`). Tutar istemciye güvenilmeden
        catalog fiyatlarıyla hesaplanır; `expectedTotal` tutmazsa taslak açılmaz,
        `409 PRICE_CHANGED` güncel toplamla döner. Kalem `sku` taşımaz; sunucu
        onu catalog teklifinden alır.

        Stok rezervasyonu (Redis + Lua, süre sınırı) T11.2/T11.4 ile gelir; bugün
        stok kilitlenmez ve cevapta `expiresAt` yoktur.
      security:
        - bearerAuth: []
        - demoUser: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReserveCartRequest"
      responses:
        "201":
          description: Taslak sipariş açıldı
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Reservation"
        "400":
          description: |
            Biçim hatası (bilinmeyen alan, yanlış tip, eksik başlık) ya da kural
            ihlali (boş sepet, markette satışta olmayan ürün). `details` alanı
            istemcinin gönderdiği adla gösterir.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                idempotencyKeyRequired:
                  summary: VALIDATION_FAILED (başlık yok)
                  value:
                    success: false
                    error:
                      code: VALIDATION_FAILED
                      message: "Girdiğin bilgilerde bir sorun var, kontrol eder misin?"
                      details:
                        Idempotency-Key: zorunlu
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
                unknownField:
                  summary: VALIDATION_FAILED (sözleşmede olmayan alan)
                  value:
                    success: false
                    error:
                      code: VALIDATION_FAILED
                      message: "Girdiğin bilgilerde bir sorun var, kontrol eder misin?"
                      details:
                        title: bu uc bu alani kabul etmiyor
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
                unavailableProducts:
                  summary: VALIDATION_FAILED (markette satışta değil)
                  value:
                    success: false
                    error:
                      code: VALIDATION_FAILED
                      message: "Girdiğin bilgilerde bir sorun var, kontrol eder misin?"
                      details:
                        unavailableProductIds: ["prd_yok"]
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: Market bulunamadı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          description: |
            Fiyat değişti (`PRICE_CHANGED`, ayrıntıda güncel toplam). Stok
            yetersizliği (`STOCK_INSUFFICIENT`) T11.2, anahtar tekrarı
            (`REQUEST_IN_PROGRESS`) T8.2 ile gelir.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                priceChanged:
                  summary: PRICE_CHANGED
                  value:
                    success: false
                    error:
                      code: PRICE_CHANGED
                      message: "Sepetindeki fiyatlar güncellendi. Yeni tutarı onaylar mısın?"
                      details:
                        expectedTotalMinor: 19000
                        totalMinor: 19360
                        currency: TRY
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
        "422":
          description: Kupon uygulanamadı ya da minimum sepet tutarına ulaşılmadı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                couponInvalid:
                  summary: COUPON_INVALID
                  value:
                    success: false
                    error:
                      code: COUPON_INVALID
                      message: "Bu kupon kullanılamıyor."
                      details:
                        couponCode: ILK10
                        reason: NOT_FIRST_ORDER
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
                minBasketNotMet:
                  summary: MIN_BASKET_NOT_MET
                  value:
                    success: false
                    error:
                      code: MIN_BASKET_NOT_MET
                      message: "Minimum sepet tutarına ulaşmadın."
                      details:
                        amountToMinBasketMinor: 4000
                        minBasketMinor: 5000
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/cart/reserve/{orderId}:
    delete:
      tags: [cart]
      operationId: releaseCartReservation
      summary: Rezervasyonu iptal et, stoğu geri ver
      parameters:
        - $ref: "#/components/parameters/OrderIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Rezervasyon serbest bırakıldı
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ReservationRelease"
        "400":
          description: Idempotency başlığı yok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                idempotencyKeyRequired:
                  summary: VALIDATION_FAILED
                  value:
                    success: false
                    error:
                      code: VALIDATION_FAILED
                      message: "Idempotency-Key başlığı zorunludur."
                      details: null
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Rezervasyon başka kullanıcıya ait
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                forbidden:
                  summary: FORBIDDEN
                  value:
                    success: false
                    error:
                      code: FORBIDDEN
                      message: "Bu rezervasyon size ait değil."
                      details: null
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
        "404":
          description: Rezervasyon yok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                reservationNotFound:
                  summary: NOT_FOUND
                  value:
                    success: false
                    error:
                      code: NOT_FOUND
                      message: "Rezervasyon bulunamadı."
                      details:
                        orderId: "ord_db77f4c0e24f49919cc1d78a649c9c94"
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
        "409":
          description: Rezervasyon zaten kapanmış
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                alreadyReleased:
                  summary: CONFLICT
                  value:
                    success: false
                    error:
                      code: CONFLICT
                      message: "Rezervasyon daha önce serbest bırakıldı."
                      details:
                        releasedAt: "2026-09-20T18:31:05.000Z"
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
                expired:
                  summary: RESERVATION_EXPIRED
                  value:
                    success: false
                    error:
                      code: RESERVATION_EXPIRED
                      message: "Rezervasyon süresi dolmuş, stok geri verildi."
                      details:
                        expiredAt: "2026-09-20T18:30:00.000Z"
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
                orderStateInvalid:
                  summary: ORDER_STATE_INVALID
                  value:
                    success: false
                    error:
                      code: ORDER_STATE_INVALID
                      message: "Ödemesi alınmış siparişin rezervasyonu iptal edilemez."
                      details:
                        status: PAID
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"

  /v1/orders:
    post:
      tags: [orders]
      operationId: createOrder
      summary: Taslağı siparişe çevir (saga)
      description: |
        Taslak kimliği (`orderId`) ile risk değerlendirmesi ve ödeme saga'sını
        çalıştırır (T7.1, order-service `CreateOrder`). Sepet ve adres TEKRAR
        GÖNDERİLMEZ: tutar ve konum taslakta dondurulmuştur.

        * LOW bant: kart çekilir, sipariş `PAID`.
        * MEDIUM bant: kart + 3DS zorunlu; sipariş `AWAITING_PAYMENT` ve
          `threeDs.challengeId` ile döner, `/v1/orders/{id}/3ds` ile tamamlanır.
        * HIGH bant: manuel inceleme (`202 RISK_REVIEW`), ödeme alınmaz.
        * CRITICAL bant: ret (`403 RISK_BLOCKED`), ödeme alınmaz.

        Risk sinyalleri istemciden alınmaz (B9): gateway bağlantının IP'sini
        order'a iletir; cihaz, oturum konumu ve hesap yaşı T8.1'de oturumdan gelir.
      security:
        - bearerAuth: []
        - demoUser: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Sipariş oluşturuldu; 3DS gerekiyorsa `threeDs` doludur
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/OrderPlacement"
              examples:
                paid:
                  summary: LOW bant, ödeme alındı
                  value:
                    success: true
                    data:
                      orderId: "ord_db77f4c0e24f49919cc1d78a649c9c94"
                      status: PAID
                awaitingThreeDs:
                  summary: MEDIUM bant, 3DS bekleniyor
                  value:
                    success: true
                    data:
                      orderId: "ord_db77f4c0e24f49919cc1d78a649c9c94"
                      status: AWAITING_PAYMENT
                      threeDs:
                        challengeId: "tds_0009d7cd0e904b689aabcacf4458d520"
        "202":
          description: |
            Risk yüksek (HIGH): sipariş `REVIEW` durumunda, manuel inceleme
            bekliyor (`RISK_REVIEW`). Ödeme alınmadı.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "400":
          description: Biçim hatası ya da başlık yok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                notCard:
                  summary: VALIDATION_FAILED (REST'te tek yöntem kart)
                  value:
                    success: false
                    error:
                      code: VALIDATION_FAILED
                      message: "Girdiğin bilgilerde bir sorun var, kontrol eder misin?"
                      details:
                        payment.method: CARD olmali
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          description: |
            Ödeme reddedildi: sipariş `PAYMENT_FAILED` durumuna geçti (tutar
            çekilmedi). Kullanıcı yeni bir sepetle tekrar dener.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                paymentDeclined:
                  summary: PAYMENT_DECLINED
                  value:
                    success: false
                    error:
                      code: PAYMENT_DECLINED
                      message: "Ödeme alınamadı. Başka bir kart deneyebilirsin."
                      details:
                        orderId: "ord_db77f4c0e24f49919cc1d78a649c9c94"
                        status: PAYMENT_FAILED
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
        "403":
          description: |
            Risk kritik (CRITICAL): sipariş `REJECTED` durumunda (`RISK_BLOCKED`).
            Ödeme alınmadı.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          $ref: "#/components/responses/OrderNotFound"
        "409":
          description: |
            Sipariş bu adıma uygun değil (`ORDER_STATE_INVALID`, ayrıntıda denenen
            geçiş) ya da önceki ödeme denemesi hâlâ sonuçlanmadı
            (`REQUEST_IN_PROGRESS`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                orderStateInvalid:
                  summary: ORDER_STATE_INVALID
                  value:
                    success: false
                    error:
                      code: ORDER_STATE_INVALID
                      message: "Siparişin bu adımda bu işlemi yapmaya uygun değil."
                      details:
                        orderId: "ord_db77f4c0e24f49919cc1d78a649c9c94"
                        from: CANCELLED
                        to: RISK_CHECK
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/orders/{id}/3ds:
    post:
      tags: [orders]
      operationId: submitThreeDsChallenge
      summary: 3DS doğrulamasını tamamla
      description: |
        Kod doğruysa sipariş `PAID` olur (order-service `ConfirmPayment`). Yanlış
        kod `402 THREEDS_FAILED` döner ve kalan hak ayrıntıdadır; hak biter ya da
        süre dolarsa sipariş `PAYMENT_FAILED` olur (`attemptsLeft: 0`). Biçimi
        bozuk kod deneme sayılmaz (`400`).
      security:
        - bearerAuth: []
        - demoUser: []
      parameters:
        - $ref: "#/components/parameters/OrderIdPathId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThreeDsRequest"
      responses:
        "200":
          description: 3DS doğrulandı, sipariş ödendi
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/OrderPlacement"
        "400":
          description: Kod 6 hane değil ya da başlık yok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                badOtp:
                  summary: VALIDATION_FAILED
                  value:
                    success: false
                    error:
                      code: VALIDATION_FAILED
                      message: "Girdiğin bilgilerde bir sorun var, kontrol eder misin?"
                      details:
                        otp: 6 haneli kod olmali
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          description: 3DS doğrulaması başarısız
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                wrongCode:
                  summary: THREEDS_FAILED (hak kaldı)
                  value:
                    success: false
                    error:
                      code: THREEDS_FAILED
                      message: "Doğrulama kodu geçersiz. Tekrar dener misin?"
                      details:
                        attemptsLeft: 1
                        reason: wrong_code
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
                exhausted:
                  summary: THREEDS_FAILED (hak bitti, sipariş PAYMENT_FAILED)
                  value:
                    success: false
                    error:
                      code: THREEDS_FAILED
                      message: "Doğrulama kodu geçersiz. Tekrar dener misin?"
                      details:
                        attemptsLeft: 0
                        reason: attempts_exhausted
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
        "404":
          $ref: "#/components/responses/OrderNotFound"
        "409":
          description: Sipariş 3DS beklemiyor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/orders/{id}:
    get:
      tags: [orders]
      operationId: getOrder
      summary: Sipariş ayrıntısı
      description: |
        Kullanıcının kendi siparişi: fiyatı dondurulmuş kalemler, tutarlar,
        teslimat adresi ve durum geçmişi. Başkasının siparişi `404` döner
        (403 değil): "bu kimlikte bir sipariş var" bilgisi bile sızmamalı.
      security:
        - bearerAuth: []
        - demoUser: []
      parameters:
        - $ref: "#/components/parameters/OrderIdPathId"
      responses:
        "200":
          description: Sipariş
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/OrderNotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/orders/{id}/token:
    get:
      tags: [realtime]
      operationId: getOrderRealtimeToken
      summary: "order:{orderId} odası için kısa ömürlü Socket.io jetonu"
      description: |
        Jeton yalnızca tek bir sipariş odasına katılım yetkisi taşır ve
        kısa ömürlüdür (bkz. `ttlSeconds`). Sözleşme: docs/api/socket-events.md
      parameters:
        - $ref: "#/components/parameters/OrderIdPathId"
      responses:
        "200":
          description: Oda jetonu
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/RealtimeToken"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Sipariş başka kullanıcıya ait
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                forbidden:
                  summary: FORBIDDEN
                  value:
                    success: false
                    error:
                      code: FORBIDDEN
                      message: "Bu sipariş odası için jeton alamazsınız."
                      details:
                        room: "order:ord_db77f4c0e24f49919cc1d78a649c9c94"
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
        "404":
          $ref: "#/components/responses/OrderNotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "`POST /v1/auth/login` ile alınan erişim jetonu (JWT_TTL = 3600 sn). T8.1 ile gelir."
    demoUser:
      type: apiKey
      in: header
      name: X-User-Id
      description: |
        GEÇİCİ geliştirme kimliği (T7.5): JWT (T8.1) gelene kadar sipariş uçları
        kullanıcıyı bu başlıktan okur (`usr_` + harf, rakam, `_`, `-`; ör.
        `usr_ali`). YALNIZCA production DIŞINDA kabul edilir; production'da
        okunmaz ve korumalı uçlar 401 döner.

  headers:
    XRequestId:
      description: |
        İsteği log ve trace kayıtlarıyla eşleyen kimlik. İstemci aynı biçimde
        gönderirse korunur; göndermezse ya da biçim dışıysa gateway üretir.
      schema:
        type: string
        pattern: "^req_[0-9a-f]{32}$"
        example: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Kalıcı durum değiştiren uçlarda zorunludur. İstemci üretir (UUID v4
        önerilir). Aynı anahtar + aynı gövde ilk cevabı tekrar döndürür;
        aynı anahtar + farklı gövde `REQUEST_IN_PROGRESS` ile reddedilir.
      schema:
        type: string
        minLength: 8
        maxLength: 128
      example: "ord_db77f4c0e24f49919cc1d78a649c9c94"

    MarketIdPath:
      name: marketId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/MarketId"
    OrderIdPath:
      name: orderId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/RuntimeId"

    OrderIdPathId:
      name: id
      in: path
      required: true
      description: Sipariş kimliği (rezervasyon anında üretilen `orderId`).
      schema:
        $ref: "#/components/schemas/RuntimeId"

    PageTokenParam:
      name: pageToken
      in: query
      required: false
      description: |
        Bir onceki cevaptan gelen `page.nextPageToken`. Ilk sayfa icin bos birakilir.
        Opak degerdir: istemci icerigini yorumlamaz, oldugu gibi geri gonderir.
        Sayfa NUMARASI kullanilmaz - katalog siralamasi stok ve kampanya ile
        surekli degistigi icin offset kayar ve ayni urun iki sayfada gorunur.
        Ayni karar gRPC tarafinda da gecerlidir (getir.common.v1.PageRequest).
      schema:
        type: string

    PageSizeParam:
      name: pageSize
      in: query
      required: false
      description: |
        Sayfa basina kayit sayisi. Sinir disi degerler REDDEDILMEZ, ust sinira
        kirpilir (gRPC tarafiyla ayni davranis).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    Unauthenticated:
      description: |
        Kimlik yok ya da geçersiz. JWT (T8.1) gelene kadar geliştirmede
        `X-User-Id` başlığı eksik/biçimsizse; production'da her zaman.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          examples:
            unauthenticated:
              summary: UNAUTHORIZED
              value:
                success: false
                error:
                  code: UNAUTHORIZED
                  message: "Oturumun sona ermiş. Tekrar giriş yapman gerekiyor."
                  details: null
                  requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
            demoUserInvalid:
              summary: UNAUTHORIZED (geliştirme kimliği biçimsiz)
              value:
                success: false
                error:
                  code: UNAUTHORIZED
                  message: "Oturumun sona ermiş. Tekrar giriş yapman gerekiyor."
                  details:
                    X-User-Id: gecerli bir kullanici kimligi olmali (usr_...)
                  requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"

    OrderNotFound:
      description: Sipariş bulunamadı
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          examples:
            orderNotFound:
              summary: NOT_FOUND
              value:
                success: false
                error:
                  code: NOT_FOUND
                  message: "Sipariş bulunamadı."
                  details:
                    orderId: "ord_db77f4c0e24f49919cc1d78a649c9c94"
                  requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"

    RateLimited:
      description: İstek hızı sınırı aşıldı
      headers:
        Retry-After:
          description: Yeniden denemeden önce beklenecek saniye.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          examples:
            rateLimited:
              summary: RATE_LIMITED
              value:
                success: false
                error:
                  code: RATE_LIMITED
                  message: "Çok fazla istek gönderdiniz."
                  details:
                    retryAfterSeconds: 30
                  requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"

    ServiceUnavailable:
      description: |
        Bağımlı servise ulaşılamadı ya da süre içinde cevap vermedi. Yeniden
        denenebilir; iç ayrıntı (adres, sürücü mesajı) cevaba konmaz, günlüktedir.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          examples:
            serviceUnavailable:
              summary: SERVICE_UNAVAILABLE
              value:
                success: false
                error:
                  code: SERVICE_UNAVAILABLE
                  message: "Servise şu an ulaşamıyoruz. Birazdan tekrar dene."
                  requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"

  schemas:
    # --- Zarf ---------------------------------------------------------------
    ApiSuccessResponse:
      type: object
      description: Başarılı cevap zarfı. `data` uca göre özelleşir.
      required: [success, data]
      properties:
        success:
          const: true
        data:
          description: Uca özgü yük.
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    ApiErrorResponse:
      type: object
      description: Hatalı cevap zarfı.
      required: [success, error]
      properties:
        success:
          const: false
        error:
          $ref: "#/components/schemas/ApiError"

    ApiResponse:
      description: |
        Her cevap bu iki koldan biridir. `success` alanı ayırt edicidir; JSON
        boolean olduğu için OpenAPI `discriminator` anahtarı kullanılamaz.
      oneOf:
        - $ref: "#/components/schemas/ApiSuccessResponse"
        - $ref: "#/components/schemas/ApiErrorResponse"

    ApiError:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          description: Kullanıcıya gösterilebilir Türkçe açıklama.
        details:
          description: Koda özgü ek bağlam (alan hataları, stok miktarı, risk skoru...).
          type: [object, "null"]
          additionalProperties: true
        requestId:
          type: string
          pattern: "^req_[0-9a-f]{32}$"
          description: X-Request-Id başlığı ile aynı değer (`req_` + 32 küçük onaltılık karakter).

    ResponseMeta:
      type: object
      properties:
        requestId:
          type: string
        servedAt:
          type: string
          format: date-time

    ErrorCode:
      type: string
      description: |
        Makine tarafindan okunan hata sozlugu. Tek dogruluk kaynagi
        `packages/core/src/error-codes.ts` icindeki `ERROR_CODES` sabitidir;
        bu liste onun birebir aynisidir ve ayrisma olursa core kazanir.
        HTTP karsiliklari da orada (`ERROR_CODE_HTTP_STATUS`) tanimlidir,
        burada tekrar edilmez.
      enum:
        # Genel / tasima katmani
        - VALIDATION_FAILED
        - UNAUTHORIZED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - INTERNAL
        - SERVICE_UNAVAILABLE
        - RATE_LIMITED
        - REQUEST_IN_PROGRESS
        # Sozlesmede olan ama henuz yazilmamis uc (D5), HTTP 501
        - NOT_IMPLEMENTED
        # Stok ve rezervasyon
        - STOCK_INSUFFICIENT
        - RESERVATION_EXPIRED
        - RESERVATION_ACTIVE
        # Risk
        - RISK_BLOCKED
        - RISK_REVIEW
        # Odeme
        - PAYMENT_DECLINED
        - THREEDS_REQUIRED
        - THREEDS_FAILED
        - PAYMENT_METHOD_NOT_ALLOWED
        # Sepet, fiyat ve siparis
        - PRICE_CHANGED
        - COUPON_INVALID
        - MIN_BASKET_NOT_MET
        - ORDER_STATE_INVALID
        # Teslimat bolgesi
        - NO_STORE
    # --- Ortak ilkel tipler -------------------------------------------------
    Money:
      type: object
      description: |
        Tutar minor unit (kuruş) cinsinden TAM SAYIDIR. Float kullanılmaz;
        1 TL = 100. Gösterim bölmesi yalnızca istemcide yapılır.
      required: [amountMinor, currency]
      properties:
        amountMinor:
          type: integer
          format: int64
          minimum: 0
          description: |
            Kuruş cinsinden tutar. Alan adı `getir.common.v1.Money.amount_minor`
            ile birebir aynıdır (gateway yalnızca camelCase'e çevirir). "amount"
            tek başına major/minor belirsizliği taşıdığı için kullanılmaz.
          examples: [15000]
        currency:
          type: string
          enum: [TRY]
      examples:
        - amountMinor: 15000
          currency: TRY

    GeoPoint:
      type: object
      description: WGS84 koordinat çifti.
      required: [lat, lng]
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
      examples:
        - lat: 41.0082
          lng: 28.9784

    Page:
      type: object
      description: |
        Sayfalama ust verisi; liste cevaplarinda `items` ile birlikte doner.
        Imlec (cursor) tabanlidir ve `getir.common.v1.PageResponse` ile birebir
        ayni anlami tasir: gateway alan adlarini camelCase'e cevirmekten baska
        bir donusum yapmaz.
      required: [nextPageToken, totalSize]
      properties:
        nextPageToken:
          type: string
          description: |
            Bir sonraki sayfanin imleci. BOS ise liste bitmistir; istemci dongusunu
            bu alanin bosluguna gore sonlandirir, kayit sayisina gore degil.
        totalSize:
          type: integer
          minimum: 0
          description: |
            Filtreye uyan toplam kayit sayisi. Pahali sayim gereken durumlarda
            sunucu 0 dondurebilir; bu "sonuc yok" DEGIL, "sayilmadi" demektir.

    # --- Kimlik -------------------------------------------------------------
    RegisterRequest:
      type: object
      description: |
        Kimlik doğrulama telefon + şifre ile yapılır (ADR-012). E-posta
        toplanmaz: SMS/OTP altyapısı kurulmadığı için doğrulanamayan bir alan
        kimlik alanı olarak kullanılamaz.
      required: [phone, password, fullName]
      properties:
        phone:
          type: string
          pattern: "^\\+90[0-9]{10}$"
          description: E.164 biçimi. `users.phone` üzerinde unique indeks vardır.
        password:
          type: string
          minLength: 8
          maxLength: 72
        fullName:
          type: string
          minLength: 2
          maxLength: 80

    LoginRequest:
      type: object
      required: [phone, password]
      properties:
        phone:
          type: string
          pattern: "^\\+90[0-9]{10}$"
        password:
          type: string
          minLength: 8
          maxLength: 72

    AuthSession:
      type: object
      required: [accessToken, expiresIn, user]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          description: Saniye cinsinden ömür (JWT_TTL = 3600).
          examples: [3600]
        user:
          $ref: "#/components/schemas/UserProfile"

    UserProfile:
      type: object
      required: [id, phone, fullName]
      properties:
        id:
          $ref: "#/components/schemas/RuntimeId"
        phone:
          type: string
          pattern: "^\\+90[0-9]{10}$"
        fullName:
          type: string

    # --- Katalog ------------------------------------------------------------
    Category:
      type: object
      description: |
        Kategoriler DÜZ listedir; ağaç yapısı yoktur (proto `Category` ile aynı).
        Sıralama `sortOrder` ile yapılır.
      required: [id, name, slug]
      properties:
        id:
          $ref: "#/components/schemas/CategoryId"
        name:
          type: string
        slug:
          type: string
        imageUrl:
          type: string
          format: uri
          description: |
            Her zaman MUTLAK URL. Veri göreli yol saklar; gateway `ASSET_BASE_URL`
            kökünü ekler. Görsel yoksa alan hiç gönderilmez.
        sortOrder:
          type: integer

    Product:
      type: object
      description: |
        Bir marketin TEKLİFİ olarak ürün (ADR-15): fiyat o markete özeldir.
        Fiyat catalog-svc'den (Offer), `availableQuantity` inventory-svc'den
        gelir; gateway iki cevabı BİRLEŞTİRİR (B27).
      required: [id, offerId, marketId, sku, name, categoryId, price, isActive]
      properties:
        id:
          $ref: "#/components/schemas/ProductId"
        offerId:
          $ref: "#/components/schemas/OfferId"
        marketId:
          $ref: "#/components/schemas/MarketId"
        sku:
          type: string
          description: |
            Servisler arası birleştirme anahtarı; Redis stok anahtarında
            (`stock:{store}:avail:{sku}`) ve stock_ledger'da da bu değer geçer.
            Biçim kuralı tek kaynakta: `packages/core` → `SKU_PATTERN`.
        name:
          type: string
        description:
          type: string
        categoryId:
          $ref: "#/components/schemas/CategoryId"
        imageUrl:
          type: string
          format: uri
          description: |
            Her zaman MUTLAK URL. Veri göreli yol saklar; gateway `ASSET_BASE_URL`
            kökünü ekler. Görsel yoksa alan hiç gönderilmez.
        price:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: |
            BU MARKETTEKİ liste fiyatı; kampanya/indirim UYGULANMAMIŞ hâlidir.
            İndirim `packages/pricing` içinde sepet düzeyinde hesaplanır.
        unit:
          type: string
          enum: [PIECE, KILOGRAM, LITER, PACK]
          description: |
            `getir.common.v1.Unit` ile birebir aynı sözlük. Türkçe etiket
            istemcide üretilir.
        isActive:
          type: boolean
          description: |
            Teklif satışta mı (`getir.catalog.v1.Offer.is_active`). `false`:
            market ürünü satıştan kaldırmıştır; kayıt silinmez. Liste pasif
            teklifi de döndürür; istemci onu "Satışta değil" gösterir ve sepete
            eklemez (T7.6). Bağlayıcı kontrol rezervasyondadır: pasif teklif
            orada bulunamamış sayılır.
        availableQuantity:
          type: integer
          minimum: 0
          description: |
            `marketId` kapsamında satılabilir adet. Kaynağı inventory-svc'dir
            ve TOPLU sorgulanır (`CheckAvailability(marketId, sku[])`, B27).

            **İsteğe bağlıdır:** alan YOKSA "stok bilgisi yok" demektir, "stok 0"
            değil. inventory-svc henüz bağlanmadıysa (T9.x öncesi) ya da cevap
            vermediyse gateway alanı yazmaz; istemci stok rozeti göstermez,
            bağlayıcı kontrol rezervasyondadır (ADR-13).

    # --- Pazaryeri (ADR-15) -------------------------------------------------
    PricingRules:
      type: object
      description: |
        Marketin sepet kuralları. Market paneli olmadığı için bugün seed'den
        gelir; `packages/pricing` bu değerleri PARAMETRE olarak alır.
      required: [minBasket, deliveryFee, freeDeliveryThreshold]
      properties:
        minBasket:
          $ref: "#/components/schemas/Money"
        deliveryFee:
          $ref: "#/components/schemas/Money"
        freeDeliveryThreshold:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: Ara toplam (indirim ÖNCESİ, B12) buna ulaşırsa teslimat ücretsiz.

    Market:
      type: object
      required:
        [
          id,
          name,
          brand,
          location,
          deliveryRadiusMeters,
          isOpen,
          deliveryTime,
          rating,
          pricingRules,
        ]
      properties:
        id:
          $ref: "#/components/schemas/MarketId"
        name:
          type: string
          example: "Migros Jet - Moda"
        brand:
          type: string
          example: "Migros Jet"
        logoUrl:
          type: string
          format: uri
          description: MUTLAK URL (gateway kurar); logosu olmayan markette alan yok.
        location:
          $ref: "#/components/schemas/GeoPoint"
        deliveryRadiusMeters:
          type: integer
          minimum: 1
        isOpen:
          type: boolean
          description: Kapalı market listede görünür ama sipariş almaz (rezervasyon NO_STORE / STORE_CLOSED).
        deliveryTime:
          type: object
          required: [minMinutes, maxMinutes]
          properties:
            minMinutes: { type: integer, minimum: 0 }
            maxMinutes: { type: integer, minimum: 0 }
        rating:
          type: object
          description: Seed'de sabit; yorum sistemi kapsam dışı. Proto onda bir hassasiyetle tam sayı taşır (47 → 4.7).
          required: [average, count]
          properties:
            average: { type: number, minimum: 0, maximum: 5, example: 4.7 }
            count: { type: integer, minimum: 0 }
        pricingRules:
          $ref: "#/components/schemas/PricingRules"

    NearbyMarket:
      type: object
      required: [market, distanceMeters]
      properties:
        market:
          $ref: "#/components/schemas/Market"
        distanceMeters:
          type: integer
          minimum: 0
          description: Her zaman `market.deliveryRadiusMeters`'tan küçük veya eşittir.

    # --- Kimlikler (ADR-15) -------------------------------------------------
    RuntimeId:
      type: string
      description: Çalışma anında üretilen kimlik (@getir/core ID_PREFIX + 32 hex). UUID DEĞİLDİR.
      pattern: "^(ord|usr|pay|crr|rsv|req)_[0-9a-f]{32}$"
      example: "ord_db77f4c0e24f49919cc1d78a649c9c94"
    MarketId:
      type: string
      pattern: "^mkt_[a-z0-9]+(?:-[a-z0-9]+)*$"
      maxLength: 64
      example: "mkt_migros-jet-moda"
    ProductId:
      type: string
      pattern: "^prd_[a-z0-9]+(?:-[a-z0-9]+)*$"
      maxLength: 64
      example: "prd_sut-1l"
    CategoryId:
      type: string
      pattern: "^cat_[a-z0-9]+(?:-[a-z0-9]+)*$"
      maxLength: 64
      example: "cat_sut-kahvaltilik"
    OfferId:
      type: string
      pattern: "^ofr_[a-z0-9]+(?:-[a-z0-9]+)*$"
      maxLength: 64
      example: "ofr_migros-jet-moda-sut-1l"

    # --- Sepet ve rezervasyon ----------------------------------------------
    CartItemInput:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          $ref: "#/components/schemas/ProductId"
        quantity:
          type: integer
          minimum: 1
          maximum: 99

    ReserveCartRequest:
      type: object
      required: [marketId, items, address, expectedTotal]
      properties:
        marketId:
          $ref: "#/components/schemas/MarketId"
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/CartItemInput"
        address:
          $ref: "#/components/schemas/DeliveryAddress"
        expectedTotal:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: |
            Kullanıcının ekranda gördüğü toplam. Sunucu tutarı kendisi hesaplar;
            tutmazsa 409 PRICE_CHANGED. Zorunlu: isteğe bağlı olsaydı istemci
            göndermeyerek kontrolü atlayabilirdi.
        couponCode:
          type: string
          minLength: 1
          maxLength: 32
          description: Kupon kodu (ör. ILK10). Uygulanamazsa 422 COUPON_INVALID.

    ReservationLine:
      type: object
      required: [productId, name, quantity, unitPrice, lineTotal]
      properties:
        productId:
          $ref: "#/components/schemas/ProductId"
        name:
          type: string
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          $ref: "#/components/schemas/Money"
        lineTotal:
          $ref: "#/components/schemas/Money"

    Reservation:
      type: object
      description: |
        Açılan taslak sipariş. Kalemler ve tutar dönmez: taslak ancak sunucunun
        toplamı `expectedTotal` ile tuttuysa açılır; döküm için GET /v1/orders/{id}.
      required: [orderId, status]
      properties:
        orderId:
          allOf:
            - $ref: "#/components/schemas/RuntimeId"
          description: Rezervasyonun ve ondan doğacak siparişin ortak kimliği.
        status:
          $ref: "#/components/schemas/OrderStatus"
        expiresAt:
          type: string
          format: date-time
          description: Geri sayımın biteceği an. Stok rezervasyonu (T11.2) gelene kadar yoktur.

    ReservationRelease:
      type: object
      required: [orderId, released, releasedAt]
      properties:
        orderId:
          $ref: "#/components/schemas/RuntimeId"
        released:
          type: boolean
        releasedAt:
          type: string
          format: date-time

    # --- Sipariş ------------------------------------------------------------
    OrderStatus:
      type: string
      description: |
        Saga boyunca siparisin gectigi durumlar. Tek dogruluk kaynagi
        `packages/core/src/constants.ts` icindeki `ORDER_STATUS` sabitidir.
      enum:
        - DRAFT
        - RISK_CHECK
        - REVIEW
        - RESERVED
        - AWAITING_PAYMENT
        - PAID
        - PAYMENT_FAILED
        - EXPIRED
        - CANCELLED
        - REJECTED
        - PREPARING
        - ON_THE_WAY
        - DELIVERED
    DeliveryAddress:
      type: object
      description: |
        Teslimat adresi: rezervasyonda verilir, siparişte gösterilir. Adres
        etiketi ("Ev") ve kurye notu sipariş sözleşmesinde olmadığı için yoktur;
        gönderilirse bilinmeyen alan olarak reddedilir.
      required: [line, location]
      properties:
        line:
          type: string
          minLength: 1
          maxLength: 240
          description: Serbest metin adres; yalnızca gösterim içindir.
        location:
          $ref: "#/components/schemas/GeoPoint"

    CreateOrderRequest:
      type: object
      required: [orderId, payment]
      properties:
        orderId:
          allOf:
            - $ref: "#/components/schemas/RuntimeId"
          description: Rezervasyondan dönen kimlik. Sepet ve adres tekrar gönderilmez.
        payment:
          type: object
          required: [method, cardToken]
          properties:
            method:
              type: string
              enum: [CARD]
            cardToken:
              type: string
              minLength: 1
              description: Demo ödeme sağlayıcısının ürettiği jeton; kart numarası taşınmaz.

    ThreeDsRequest:
      type: object
      required: [challengeId, otp]
      properties:
        challengeId:
          type: string
        otp:
          type: string
          minLength: 6
          maxLength: 6
          pattern: "^[0-9]{6}$"

    ThreeDsChallenge:
      type: object
      description: 3DS bekleyen siparişin doğrulama jetonu.
      required: [challengeId]
      properties:
        challengeId:
          type: string

    OrderPlacement:
      type: object
      description: |
        Sipariş ve 3DS cevabı. `threeDs` yalnızca doğrulama bekleniyorsa
        (`AWAITING_PAYMENT`) vardır; ayrı bir bayrak tutulmaz.
      required: [orderId, status]
      properties:
        orderId:
          $ref: "#/components/schemas/RuntimeId"
        status:
          $ref: "#/components/schemas/OrderStatus"
        threeDs:
          $ref: "#/components/schemas/ThreeDsChallenge"

    OrderTimelineEntry:
      type: object
      required: [status, at]
      properties:
        status:
          $ref: "#/components/schemas/OrderStatus"
        at:
          type: string
          format: date-time
        note:
          type: string
          description: İsteğe bağlı kısa açıklama anahtarı (ör. iptal gerekçesi).

    CourierSummary:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: "#/components/schemas/RuntimeId"
        name:
          type: string
        location:
          $ref: "#/components/schemas/GeoPoint"
        etaMinutes:
          type: integer
          minimum: 0

    Order:
      type: object
      description: Tutarlar taslakta dondurulmuştur; total = subtotal + deliveryFee - discount.
      required:
        [
          id,
          status,
          marketId,
          lines,
          subtotal,
          deliveryFee,
          discount,
          total,
          address,
          timeline,
          createdAt,
        ]
      properties:
        id:
          $ref: "#/components/schemas/RuntimeId"
        status:
          $ref: "#/components/schemas/OrderStatus"
        marketId:
          $ref: "#/components/schemas/MarketId"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/ReservationLine"
        subtotal:
          $ref: "#/components/schemas/Money"
        deliveryFee:
          $ref: "#/components/schemas/Money"
        discount:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: Kupon indirimi; pozitif tutardır ve toplamdan düşülür.
        total:
          $ref: "#/components/schemas/Money"
        address:
          $ref: "#/components/schemas/DeliveryAddress"
        timeline:
          type: array
          description: Durum geçmişi, eskiden yeniye.
          items:
            $ref: "#/components/schemas/OrderTimelineEntry"
        courier:
          $ref: "#/components/schemas/CourierSummary"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # --- Gerçek zamanlı -----------------------------------------------------
    RealtimeToken:
      type: object
      required: [token, room, expiresAt, ttlSeconds]
      properties:
        token:
          type: string
        room:
          type: string
          description: Jetonun yetkili olduğu tek oda.
          examples: ["order:ord_db77f4c0e24f49919cc1d78a649c9c94"]
        expiresAt:
          type: string
          format: date-time
        ttlSeconds:
          type: integer
          minimum: 1
