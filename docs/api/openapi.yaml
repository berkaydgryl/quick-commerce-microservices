  /v1/orders:
    post:
      tags: [orders]
      operationId: createOrder
      summary: Taslağı siparişe çevir (saga)
      description: |
        Taslak kimliği (`orderId`) ile risk değerlendirmesi ve ödeme saga'sını
        çalıştırır (T7.1, order-service `CreateOrder`). Sepet ve adres TEKRAR
        GÖNDERİLMEZ: tutar ve konum taslakta dondurulmuştur.

        * LOW bant: kart çekilir, sipariş `PAID`.
        * MEDIUM bant: kart + 3DS zorunlu; sipariş `AWAITING_PAYMENT` ve
          `threeDs.challengeId` ile döner, `/v1/orders/{id}/3ds` ile tamamlanır.
        * HIGH bant: manuel inceleme (`202 RISK_REVIEW`), ödeme alınmaz.
        * CRITICAL bant: ret (`403 RISK_BLOCKED`), ödeme alınmaz.

        Risk sinyalleri istemciden alınmaz (B9): IP bağlantıdan; cihaz, önceki
        giriş IP'si ve oturum konumu erişim jetonunun OTURUMUNDAN; hesap yaşı ve
        hesabın açıldığı cihazdan açılmış hesap sayısı kullanıcı kaydından
        (T8.1). Oturum kapatılmışsa (çıkış) jeton süresi dolmamış olsa bile
        `401` döner.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Sipariş oluşturuldu; 3DS gerekiyorsa `threeDs` doludur
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/OrderPlacement"
              examples:
                paid:
                  summary: LOW bant, ödeme alındı
                  value:
                    success: true
                    data:
                      orderId: "ord_db77f4c0e24f49919cc1d78a649c9c94"
                      status: PAID
                awaitingThreeDs:
                  summary: MEDIUM bant, 3DS bekleniyor
                  value:
                    success: true
                    data:
                      orderId: "ord_db77f4c0e24f49919cc1d78a649c9c94"
                      status: AWAITING_PAYMENT
                      threeDs:
                        challengeId: "tds_0009d7cd0e904b689aabcacf4458d520"
        "202":
          description: |
            Risk yüksek (HIGH): sipariş `REVIEW` durumunda, manuel inceleme
            bekliyor (`RISK_REVIEW`). Ödeme alınmadı.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "400":
          description: Biçim hatası, başlık yok ya da anahtar biçimsiz
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                notCard:
                  summary: VALIDATION_FAILED (REST'te tek yöntem kart)
                  value:
                    success: false
                    error:
                      code: VALIDATION_FAILED
                      message: "Girdiğin bilgilerde bir sorun var, kontrol eder misin?"
                      details:
                        payment.method: CARD olmali
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
                idempotencyKeyInvalid:
                  $ref: "#/components/examples/IdempotencyKeyInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          description: |
            Ödeme reddedildi: sipariş `PAYMENT_FAILED` durumuna geçti (tutar
            çekilmedi). Kullanıcı yeni bir sepetle tekrar dener.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                paymentDeclined:
                  summary: PAYMENT_DECLINED
                  value:
                    success: false
                    error:
                      code: PAYMENT_DECLINED
                      message: "Ödeme alınamadı. Başka bir kart deneyebilirsin."
                      details:
                        orderId: "ord_db77f4c0e24f49919cc1d78a649c9c94"
                        status: PAYMENT_FAILED
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
        "403":
          description: |
            Risk kritik (CRITICAL): sipariş `REJECTED` durumunda (`RISK_BLOCKED`).
            Ödeme alınmadı.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          $ref: "#/components/responses/OrderNotFound"
        "409":
          description: |
            Sipariş bu adıma uygun değil (`ORDER_STATE_INVALID`, ayrıntıda denenen
            geçiş) ya da önceki ödeme denemesi hâlâ sonuçlanmadı
            (`REQUEST_IN_PROGRESS`). Aynı anahtarlı istek hâlâ işleniyorsa da
            `REQUEST_IN_PROGRESS` (ayrıntıda `Idempotency-Key`); anahtar farklı
            bir gövdeyle kullanılmışsa `CONFLICT`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                orderStateInvalid:
                  summary: ORDER_STATE_INVALID
                  value:
                    success: false
                    error:
                      code: ORDER_STATE_INVALID
                      message: "Siparişin bu adımda bu işlemi yapmaya uygun değil."
                      details:
                        orderId: "ord_db77f4c0e24f49919cc1d78a649c9c94"
                        from: CANCELLED
                        to: RISK_CHECK
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
                requestInProgress:
                  $ref: "#/components/examples/IdempotencyRequestInProgress"
                keyReused:
                  $ref: "#/components/examples/IdempotencyKeyReused"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/orders/{id}/3ds:
    post:
      tags: [orders]
      operationId: submitThreeDsChallenge
      summary: 3DS doğrulamasını tamamla
      description: |
        Kod doğruysa sipariş `PAID` olur (order-service `ConfirmPayment`). Yanlış
        kod `402 THREEDS_FAILED` döner ve kalan hak ayrıntıdadır; hak biter ya da
        süre dolarsa sipariş `PAYMENT_FAILED` olur (`attemptsLeft: 0`). Biçimi
        bozuk kod deneme sayılmaz (`400`).

        Her kod denemesi ayrı bir niyettir: yeni kod YENİ bir `Idempotency-Key`
        ile gönderilir. Aynı anahtarla farklı kod `409 CONFLICT` alır; aynı kodun
        aynı anahtarla tekrarı ilk cevabı (ör. `402`, aynı `attemptsLeft`) alır,
        hak ikinci kez düşmez.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderIdPathId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThreeDsRequest"
      responses:
        "200":
          description: 3DS doğrulandı, sipariş ödendi
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/OrderPlacement"
        "400":
          description: Kod 6 hane değil, başlık yok ya da anahtar biçimsiz
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                badOtp:
                  summary: VALIDATION_FAILED
                  value:
                    success: false
                    error:
                      code: VALIDATION_FAILED
                      message: "Girdiğin bilgilerde bir sorun var, kontrol eder misin?"
                      details:
                        otp: 6 haneli kod olmali
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
                idempotencyKeyInvalid:
                  $ref: "#/components/examples/IdempotencyKeyInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          description: 3DS doğrulaması başarısız
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                wrongCode:
                  summary: THREEDS_FAILED (hak kaldı)
                  value:
                    success: false
                    error:
                      code: THREEDS_FAILED
                      message: "Doğrulama kodu geçersiz. Tekrar dener misin?"
                      details:
                        attemptsLeft: 1
                        reason: wrong_code
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
                exhausted:
                  summary: THREEDS_FAILED (hak bitti, sipariş PAYMENT_FAILED)
                  value:
                    success: false
                    error:
                      code: THREEDS_FAILED
                      message: "Doğrulama kodu geçersiz. Tekrar dener misin?"
                      details:
                        attemptsLeft: 0
                        reason: attempts_exhausted
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
        "404":
          $ref: "#/components/responses/OrderNotFound"
        "409":
          description: |
            Sipariş 3DS beklemiyor (`ORDER_STATE_INVALID`), aynı anahtarlı istek
            hâlâ işleniyor (`REQUEST_IN_PROGRESS`) ya da anahtar farklı bir kodla
            kullanılmış (`CONFLICT`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                requestInProgress:
                  $ref: "#/components/examples/IdempotencyRequestInProgress"
                keyReused:
                  $ref: "#/components/examples/IdempotencyKeyReused"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/orders/{id}:
