# Gateway REST sözleşmesi (OpenAPI 3.1).
# Bu dosya EL İLE düzenlenen iskelettir; T19.1'de packages/contracts altındaki Zod
# şemalarından üretilen sürüm burayı devralacak. Ayrıntı: docs/api/README.md
openapi: 3.1.0

info:
  title: Quick Commerce Gateway API
  version: 0.1.0
  summary: Hızlı market siparişi için genel REST yüzeyi
  description: |
    Go gateway'in dışarıya açtığı tek REST yüzeyi. Gateway istekleri doğrular,
    kimliği çözer, idempotency anahtarını yönetir ve gRPC ile iç servislere
    (catalog, inventory, order, payment, risk, courier) dağıtır.

    Sözleşme kuralları:

    * **Zarf**: her cevap `ApiResponse` zarfıyla döner; `success` alanı başarıyı
      hatadan ayırır. HTTP durum kodu ile `error.code` birlikte okunur.
    * **Para**: tüm tutarlar minor unit (kuruş) cinsinden **tam sayıdır**.
      Float kullanılmaz, istemci gösterim anında 100'e böler.
    * **Idempotency** (ADR-08 ve T8.2 eki): kalıcı durum değiştiren uçlarda
      `Idempotency-Key` başlığı zorunludur; anahtar niyet başına bir kez üretilir
      ve kullanıcı başınadır. Aynı anahtarla gelen aynı istek ucu İKİNCİ KEZ
      ÇALIŞTIRMAZ: ilk cevap aynen döner ve `Idempotent-Replayed: true`
      başlığını taşır. İlk istek hâlâ işleniyorsa `409 REQUEST_IN_PROGRESS`,
      anahtar farklı bir gövdeyle gelirse `409 CONFLICT` döner. Doğrulama
      (400), oturum (401), hız sınırı (429) ve sunucu (5xx) hataları saklanmaz:
      aynı anahtarla yeniden denenir. Kayıt, başarılı sipariş ve 3DS için 2
      saat, diğerlerinde 24 saat tutulur. Tekrar koruması çalışamıyorsa (Redis
      erişilemez) uç `503 SERVICE_UNAVAILABLE` döner; korumasız sipariş
      alınmaz. `POST /v1/auth/login`, `/v1/auth/refresh` ve `/v1/auth/logout`
      bu başlığı istemez: giriş ve yenileme kalıcı bir kaynak yaratmaz (oturum
      jetonu üretir), çıkışın tekrarı zararsızdır.
    * **Hız sınırı** (T8.2): uç başına kayan pencere; kimliksiz uçlarda IP,
      kimlik isteyen uçlarda kullanıcı sayılır. Aşılınca `429 RATE_LIMITED`,
      `Retry-After` başlığı ve `details.retryAfterSeconds` döner. Sınırlar
      `RateLimited` cevabında; `/healthz` sınırsızdır.
    * **Kimlik**: korumalı uçlar `Authorization: Bearer <erişim jetonu>` ister
      (T8.1). Jeton yoksa ya da geçersizse `401 UNAUTHORIZED` ve
      `WWW-Authenticate` başlığı döner. Jeton ve kişisel veri taşıyan cevaplar
      `Cache-Control: no-store` ile gelir. Yenileme jetonu gövdede DEĞİL,
      gateway'in yazdığı `getir_refresh` çerezindedir (HttpOnly,
      `SameSite=Strict`, `Path=/v1/auth`): sayfadaki betik okuyamaz. İstemci
      erişim jetonunu bellekte tutar; sayfa yenilenince `POST /v1/auth/refresh`
      çağrılır, çerez kendiliğinden gider.
    * **İzleme**: her cevapta `X-Request-Id` başlığı bulunur; hata gövdesindeki
      `error.requestId` ile aynı değerdir ve log/trace kayıtlarıyla eşleşir.
      Biçim `req_` + 32 küçük onaltılık karakterdir. İstemci bu biçimde kendi
      kimliğini gönderebilir, gönderdiği korunur; biçim dışı değer yok sayılır
      ve gateway yenisini üretir.
  license:
    name: MIT
  contact:
    name: quick-commerce-microservices

servers:
  - url: http://localhost:8080
    description: Yerel geliştirme (gateway)

tags:
  - name: auth
    description: Kayıt ve oturum açma
  - name: catalog
    description: Kategori ve ürün listeleme
  - name: darkstore
    description: Konumdan karanlık mağaza çözümleme
  - name: cart
    description: Sepet ve stok rezervasyonu
  - name: orders
    description: Sipariş oluşturma, 3DS ve sorgulama
  - name: realtime
    description: Socket.io odaları için kısa ömürlü jeton

security:
  - bearerAuth: []

paths:
  /v1/auth/register:
    post:
      tags: [auth]
      operationId: registerUser
      summary: Yeni kullanıcı kaydı
      description: |
        Hesabı açar ve oturumu başlatır: cevapta erişim ve yenileme jetonu
        birlikte gelir, ayrıca giriş gerekmez. Şifre yalnızca bcrypt özetiyle
        saklanır. `fullName` baştaki ve sondaki boşluklardan arındırılır.

        `Idempotency-Key` zorunludur. Bu uç tekrar kuralının TEK istisnasıdır
        (ADR-08 eki): cevap jeton taşıdığı için saklanmaz ve tekrar edilmez.
        Aynı anahtarla gelen tekrar, ilki hâlâ işleniyorsa
        `409 REQUEST_IN_PROGRESS` alır; bitmişse uca geçer ve
        `409 PHONE_ALREADY_REGISTERED` döner: ikinci hesap açılmaz,
        `users.phone` benzersiz indeksi bunu garanti eder. Aynı anahtar farklı
        gövdeyle `409 CONFLICT` alır.
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Kullanıcı oluşturuldu, oturum açıldı
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Set-Cookie:
              $ref: "#/components/headers/SessionCookies"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AuthSession"
        "400":
          description: |
            Biçim hatası: eksik başlık, bilinmeyen alan, kural dışı değer. Bütün
            sorunlar TEK cevapta, `details` içinde alan adıyla döner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                validationError:
                  summary: VALIDATION_FAILED (başlık ve alanlar)
                  value:
                    success: false
                    error:
                      code: VALIDATION_FAILED
                      message: "Girdiğin bilgilerde bir sorun var, kontrol eder misin?"
                      details:
                        Idempotency-Key: zorunlu
                        phone: "+90'dan sonra 10 rakam olmalı (örnek +905321234567)"
                        password: en az 8 karakter olmalı
                        fullName: en az 2 karakter olmalı
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
                unknownField:
                  summary: VALIDATION_FAILED (sözleşmede olmayan alan)
                  value:
                    success: false
                    error:
                      code: VALIDATION_FAILED
                      message: "Girdiğin bilgilerde bir sorun var, kontrol eder misin?"
                      details:
                        email: bu uc bu alani kabul etmiyor
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
                idempotencyKeyInvalid:
                  $ref: "#/components/examples/IdempotencyKeyInvalid"
        "409":
          description: |
            Telefon numarası başka bir hesaba ait (`PHONE_ALREADY_REGISTERED`;
            biten kaydın aynı anahtarla tekrarı da bunu alır). Anahtarla ilgili
            iki durum: ilk istek hâlâ işleniyor (`REQUEST_IN_PROGRESS`) ya da
            anahtar farklı bir gövdeyle kullanılmış (`CONFLICT`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                phoneAlreadyRegistered:
                  summary: PHONE_ALREADY_REGISTERED
                  value:
                    success: false
                    error:
                      code: PHONE_ALREADY_REGISTERED
                      message: "Bu telefon numarasıyla kayıtlı bir hesap var. Giriş yapmayı dener misin?"
                      details:
                        phone: bu numarayla kayitli bir hesap var
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
                requestInProgress:
                  $ref: "#/components/examples/IdempotencyRequestInProgress"
                keyReused:
                  $ref: "#/components/examples/IdempotencyKeyReused"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/auth/login:
    post:
      tags: [auth]
      operationId: loginUser
      summary: Oturum açma
      description: |
        Telefon ve şifreyle yeni bir oturum açar. Kalıcı bir kaynak yaratmadığı
        için `Idempotency-Key` istemez.

        Yanlış şifre ile kayıtsız numara AYNI cevabı alır (kod, mesaj, süre):
        kayıtlı numaralar bu uçtan taranamaz. Biçim kuralları (numara biçimi,
        şifre uzunluğu) ise alan adıyla `400` döner; bunlar hesap hakkında
        bilgi vermez.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Oturum açıldı
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Set-Cookie:
              $ref: "#/components/headers/SessionCookies"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AuthSession"
        "400":
          description: Gövde biçimi geçersiz
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                validationError:
                  summary: VALIDATION_FAILED
                  value:
                    success: false
                    error:
                      code: VALIDATION_FAILED
                      message: "Girdiğin bilgilerde bir sorun var, kontrol eder misin?"
                      details:
                        phone: "+90'dan sonra 10 rakam olmalı (örnek +905321234567)"
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
        "401":
          description: Telefon numarası ya da şifre hatalı (hangisi olduğu söylenmez)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                invalidCredentials:
                  summary: INVALID_CREDENTIALS
                  value:
                    success: false
                    error:
                      code: INVALID_CREDENTIALS
                      message: "Telefon numarası ya da şifre hatalı."
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Erişim jetonunu yenile
      description: |
        Yenileme jetonunu YENİSİYLE DEĞİŞTİRİR ve yeni bir erişim jetonu verir;
        oturum (`sid`) aynı kalır. Eski yenileme jetonu bir daha geçmez: çalınan
        jetonla ikinci yenileme reddedilir, aynı jetonla eş zamanlı iki
        istekten yalnızca biri başarır. Süre her yenilemede o andan itibaren
        REFRESH_TTL'e uzar; kullanılmayan oturum REFRESH_TTL sonunda kapanır.

        Erişim jetonu istemez: süresinin dolmuş olması bu ucun çağrılma
        sebebidir. İstemci aynı jetonla iki yenilemeyi aynı anda göndermemeli;
        cevabı kaybolan yenilemede yeniden giriş gerekir.

        Gövdesizdir: jeton `getir_refresh` çerezinden okunur ve yenisi aynı
        çereze yazılır. Kullanılamayan jetonun çerezi silinir (tarayıcı ölü
        jetonu her açılışta yeniden göndermesin).
      security: []
      parameters:
        - $ref: "#/components/parameters/RefreshCookieRequired"
      responses:
        "200":
          description: Yeni erişim jetonu; yenileme jetonu çerezde yenilendi
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AuthSession"
        "401":
          description: |
            Çerez yok ya da içindeki jeton geçersiz, kullanılmış, iptal edilmiş
            veya süresi dolmuş. İstemci girişe yönlenir. Geçersiz jetonun
            çerezi silinir.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookieCleared"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                refreshCookieMissing:
                  summary: UNAUTHORIZED (çerez yok)
                  value:
                    success: false
                    error:
                      code: UNAUTHORIZED
                      message: "Oturumun sona ermiş. Tekrar giriş yapman gerekiyor."
                      details:
                        getir_refresh: zorunlu
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
                refreshTokenInvalid:
                  summary: UNAUTHORIZED (jeton kullanılamaz)
                  value:
                    success: false
                    error:
                      code: UNAUTHORIZED
                      message: "Oturumun sona ermiş. Tekrar giriş yapman gerekiyor."
                      details:
                        getir_refresh: gecersiz, kullanilmis ya da suresi dolmus
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logoutSession
      summary: Oturumu kapat
      description: |
        Yenileme jetonunu iptal eder (oturum kaydı silinir) ve `getir_refresh`
        çerezini siler. Gövdesizdir: jeton çerezden okunur. Tekrarı zararsızdır:
        ikinci çağrı ya da çerezsiz çağrı `revoked: false` alır, bu yüzden
        `Idempotency-Key` istemez. İstemci her iki durumda da yerel oturumu siler.

        Erişim jetonu kendi süresi (JWT_TTL) dolana kadar geçerli kalır:
        durumsuz jetonun bilinen bedeli, ömrünün kısa tutulma sebebi budur.
      security: []
      parameters:
        - $ref: "#/components/parameters/RefreshCookieOptional"
      responses:
        "200":
          description: Çıkış tamam; çerez silindi
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookieCleared"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/LogoutResult"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Oturumdaki kullanıcının profili
      description: |
        Erişim jetonundaki kullanıcının profili. Hesap silinmişse jeton artık
        bir kullanıcıya karşılık gelmez ve `401` döner.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profil
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/UserProfile"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/categories:
    get:
      tags: [catalog]
      operationId: listCategories
      summary: Kategori ağacını listele
      description: |
        Sorgu parametresi ALMAZ. Tanınmayan her parametre sessizce yok sayılmaz,
        `400 VALIDATION_FAILED` ile reddedilir ve `details` parametre adını taşır:
        yazım hatalı bir filtre filtrelenmemiş listeyi filtrelenmiş sandırmasın.

        SAYFALANMAZ: kategori taksonomisi sınırlı bir listedir (en fazla 100,
        seed fazlasını yazmaz). Bu yüzden cevapta `page` alanı yoktur.
      security: []
      responses:
        "200":
          description: Kategori listesi
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            maxItems: 100
                            items:
                              $ref: "#/components/schemas/Category"
        "400":
          description: Tanınmayan sorgu parametresi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                unknownQuery:
                  summary: VALIDATION_FAILED
                  value:
                    success: false
                    error:
                      code: VALIDATION_FAILED
                      message: "Girdiğin bilgilerde bir sorun var, kontrol eder misin?"
                      details:
                        categoryID: "bu uc bu parametreyi kabul etmiyor"
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/markets:
    get:
      tags: [catalog]
      operationId: listNearbyMarkets
      summary: Konuma hizmet veren marketler (ADR-15)
      description: |
        Pazaryeri: kullanıcı marketi KENDİSİ seçer. Teslimat yarıçapı konumu
        kapsayan marketler yakından uzağa döner; kapalı marketler de listede
        vardır (`isOpen: false` → "Kapalı" rozeti). Hiçbiri yoksa BOŞ liste
        döner — hata değil ("bölgende market yok").
      security: []
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: lng
          in: query
          required: true
          schema: { type: number, minimum: -180, maximum: 180 }
      responses:
        "200":
          description: Yakındaki marketler
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/NearbyMarket"
        "400":
          description: |
            Konum eksik, sayı değil ya da WGS84 aralığı dışında. Sebep
            `details` alanında Türkçedir, örn. `{"lat": "enlem -90 ile 90 arasinda olmali"}`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/markets/{marketId}:
    get:
      tags: [catalog]
      operationId: getMarket
      summary: Market sayfası başlığı (puan, süre, fiyat kuralları)
      security: []
      parameters:
        - $ref: "#/components/parameters/MarketIdPath"
      responses:
        "200":
          description: Market
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Market"
        "400":
          description: |
            Market kimliği `mkt_` biçiminde değil ya da tanınmayan sorgu
            parametresi (VALIDATION_FAILED; `details.marketId` sebebi taşır).
            Biçimi doğru ama olmayan market 404'tür.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Market yok (NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/markets/{marketId}/categories:
    get:
      tags: [catalog]
      operationId: listMarketCategories
      summary: Marketin teklifi olan kategoriler
      description: |
        Manav yalnızca meyve-sebze kategorisini döndürür. `/v1/categories` gibi
        sayfalanmaz; en fazla 100 kategori.
      security: []
      parameters:
        - $ref: "#/components/parameters/MarketIdPath"
      responses:
        "200":
          description: Kategoriler, sortOrder ile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            maxItems: 100
                            items:
                              $ref: "#/components/schemas/Category"
        "400":
          description: |
            Market kimliği `mkt_` biçiminde değil ya da tanınmayan sorgu
            parametresi (VALIDATION_FAILED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Market yok (NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/markets/{marketId}/products:
    get:
      tags: [catalog]
      operationId: listMarketProducts
      summary: Marketin ürünleri, o marketin fiyatı ve stoğuyla
      description: |
        FİYAT markete özeldir (ADR-15): aynı ürün başka markette farklı fiyattadır.
        `q` verilirse arama yapılır; `categoryId` ile birlikte kullanılabilir.
        Market var ama eşleşme yoksa BOŞ liste döner; market yoksa NOT_FOUND.
      security: []
      parameters:
        - $ref: "#/components/parameters/MarketIdPath"
        - name: categoryId
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CategoryId"
        - name: q
          in: query
          required: false
          schema: { type: string, minLength: 2, maxLength: 64 }
        - $ref: "#/components/parameters/PageTokenParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: Ürün sayfası
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, page]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/Product"
                          page:
                            $ref: "#/components/schemas/Page"
        "400":
          description: |
            Geçersiz istek (VALIDATION_FAILED): `mkt_` biçiminde olmayan market,
            `cat_` biçiminde olmayan kategori ya da 2-64 karakter dışındaki arama.
            Biçimi bozuk kategori BOŞ LİSTE değil 400'dür: yazım hatası "bu
            kategoride ürün yok" sanılmasın.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Market yok (NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/cart/reserve:
    post:
      tags: [cart]
      operationId: reserveCart
      summary: Sepeti fiyatlandır ve taslak sipariş aç
      description: |
        Sepeti sunucuda fiyatlandırıp taslak sipariş açar ve `orderId` üretir
        (T7.5, order-service `CreateDraftOrder`). Tutar istemciye güvenilmeden
        catalog fiyatlarıyla hesaplanır; `expectedTotal` tutmazsa taslak açılmaz,
        `409 PRICE_CHANGED` güncel toplamla döner. Kalem `sku` taşımaz; sunucu
        onu catalog teklifinden alır.

        Stok rezervasyonu (Redis + Lua, süre sınırı) T11.2/T11.4 ile gelir; bugün
        stok kilitlenmez ve cevapta `expiresAt` yoktur.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReserveCartRequest"
      responses:
        "201":
          description: Taslak sipariş açıldı
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Reservation"
        "400":
          description: |
            Biçim hatası (bilinmeyen alan, yanlış tip, eksik başlık) ya da kural
            ihlali (boş sepet, markette satışta olmayan ürün). `details` alanı
            istemcinin gönderdiği adla gösterir.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                idempotencyKeyRequired:
                  summary: VALIDATION_FAILED (başlık yok)
                  value:
                    success: false
                    error:
                      code: VALIDATION_FAILED
                      message: "Girdiğin bilgilerde bir sorun var, kontrol eder misin?"
                      details:
                        Idempotency-Key: zorunlu
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
                unknownField:
                  summary: VALIDATION_FAILED (sözleşmede olmayan alan)
                  value:
                    success: false
                    error:
                      code: VALIDATION_FAILED
                      message: "Girdiğin bilgilerde bir sorun var, kontrol eder misin?"
                      details:
                        title: bu uc bu alani kabul etmiyor
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
                unavailableProducts:
                  summary: VALIDATION_FAILED (markette satışta değil)
                  value:
                    success: false
                    error:
                      code: VALIDATION_FAILED
                      message: "Girdiğin bilgilerde bir sorun var, kontrol eder misin?"
                      details:
                        unavailableProductIds: ["prd_yok"]
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
                idempotencyKeyInvalid:
                  $ref: "#/components/examples/IdempotencyKeyInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: Market bulunamadı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          description: |
            Fiyat değişti (`PRICE_CHANGED`, ayrıntıda güncel toplam). Aynı
            anahtarlı istek hâlâ işleniyor (`REQUEST_IN_PROGRESS`) ya da anahtar
            farklı bir gövdeyle kullanılmış (`CONFLICT`). Stok yetersizliği
            (`STOCK_INSUFFICIENT`) T11.2 ile gelir.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                priceChanged:
                  summary: PRICE_CHANGED
                  value:
                    success: false
                    error:
                      code: PRICE_CHANGED
                      message: "Sepetindeki fiyatlar güncellendi. Yeni tutarı onaylar mısın?"
                      details:
                        expectedTotalMinor: 19000
                        totalMinor: 19360
                        currency: TRY
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
                requestInProgress:
                  $ref: "#/components/examples/IdempotencyRequestInProgress"
                keyReused:
                  $ref: "#/components/examples/IdempotencyKeyReused"
        "422":
          description: Kupon uygulanamadı ya da minimum sepet tutarına ulaşılmadı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                couponInvalid:
                  summary: COUPON_INVALID
                  value:
                    success: false
                    error:
                      code: COUPON_INVALID
                      message: "Bu kupon kullanılamıyor."
                      details:
                        couponCode: ILK10
                        reason: NOT_FIRST_ORDER
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
                minBasketNotMet:
                  summary: MIN_BASKET_NOT_MET
                  value:
                    success: false
                    error:
                      code: MIN_BASKET_NOT_MET
                      message: "Minimum sepet tutarına ulaşmadın."
                      details:
                        amountToMinBasketMinor: 4000
                        minBasketMinor: 5000
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/cart/reserve/{orderId}:
    delete:
      tags: [cart]
      operationId: releaseCartReservation
