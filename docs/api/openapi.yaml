# Gateway REST sözleşmesi (OpenAPI 3.1).
# Bu dosya EL İLE düzenlenen iskelettir; T19.1'de packages/contracts altındaki Zod
# şemalarından üretilen sürüm burayı devralacak. Ayrıntı: docs/api/README.md
openapi: 3.1.0

info:
  title: Quick Commerce Gateway API
  version: 0.1.0
  summary: Hızlı market siparişi için genel REST yüzeyi
  description: |
    Go gateway'in dışarıya açtığı tek REST yüzeyi. Gateway istekleri doğrular,
    kimliği çözer, idempotency anahtarını yönetir ve gRPC ile iç servislere
    (catalog, inventory, order, payment, risk, courier) dağıtır.

    Sözleşme kuralları:

    * **Zarf**: her cevap `ApiResponse` zarfıyla döner; `success` alanı başarıyı
      hatadan ayırır. HTTP durum kodu ile `error.code` birlikte okunur.
    * **Para**: tüm tutarlar minor unit (kuruş) cinsinden **tam sayıdır**.
      Float kullanılmaz, istemci gösterim anında 100'e böler.
    * **Idempotency** (ADR-08 ve T8.2 eki): kalıcı durum değiştiren uçlarda
      `Idempotency-Key` başlığı zorunludur; anahtar niyet başına bir kez üretilir
      ve kullanıcı başınadır. Aynı anahtarla gelen aynı istek ucu İKİNCİ KEZ
      ÇALIŞTIRMAZ: ilk cevap aynen döner ve `Idempotent-Replayed: true`
      başlığını taşır. İlk istek hâlâ işleniyorsa `409 REQUEST_IN_PROGRESS`,
      anahtar farklı bir gövdeyle gelirse `409 CONFLICT` döner. Doğrulama
      (400), oturum (401), hız sınırı (429) ve sunucu (5xx) hataları saklanmaz:
      aynı anahtarla yeniden denenir. Kayıt, başarılı sipariş ve 3DS için 2
      saat, diğerlerinde 24 saat tutulur. Tekrar koruması çalışamıyorsa (Redis
      erişilemez) uç `503 SERVICE_UNAVAILABLE` döner; korumasız sipariş
      alınmaz. `POST /v1/auth/login`, `/v1/auth/refresh` ve `/v1/auth/logout`
      bu başlığı istemez: giriş ve yenileme kalıcı bir kaynak yaratmaz (oturum
      jetonu üretir), çıkışın tekrarı zararsızdır.
    * **Hız sınırı** (T8.2): uç başına kayan pencere; kimliksiz uçlarda IP,
      kimlik isteyen uçlarda kullanıcı sayılır. Aşılınca `429 RATE_LIMITED`,
      `Retry-After` başlığı ve `details.retryAfterSeconds` döner. Sınırlar
      `RateLimited` cevabında; `/healthz` sınırsızdır.
    * **Kimlik**: korumalı uçlar `Authorization: Bearer <erişim jetonu>` ister
      (T8.1). Jeton yoksa ya da geçersizse `401 UNAUTHORIZED` ve
      `WWW-Authenticate` başlığı döner. Jeton ve kişisel veri taşıyan cevaplar
      `Cache-Control: no-store` ile gelir. Yenileme jetonu gövdede DEĞİL,
      gateway'in yazdığı `getir_refresh` çerezindedir (HttpOnly,
      `SameSite=Strict`, `Path=/v1/auth`): sayfadaki betik okuyamaz. İstemci
      erişim jetonunu bellekte tutar; sayfa yenilenince `POST /v1/auth/refresh`
      çağrılır, çerez kendiliğinden gider.
    * **İzleme**: her cevapta `X-Request-Id` başlığı bulunur; hata gövdesindeki
      `error.requestId` ile aynı değerdir ve log/trace kayıtlarıyla eşleşir.
      Biçim `req_` + 32 küçük onaltılık karakterdir. İstemci bu biçimde kendi
      kimliğini gönderebilir, gönderdiği korunur; biçim dışı değer yok sayılır
      ve gateway yenisini üretir.
  license:
    name: MIT
  contact:
    name: quick-commerce-microservices

servers:
  - url: http://localhost:8080
    description: Yerel geliştirme (gateway)

tags:
  - name: auth
    description: Kayıt ve oturum açma
  - name: catalog
    description: Kategori ve ürün listeleme
  - name: content
    description: Ekran metinleri ve görselleri (T11.6)
  - name: geo
    description: Harita adres çözümleme ve arama (T11.8)
  - name: darkstore
    description: Konumdan karanlık mağaza çözümleme
  - name: cart
    description: Sepet ve stok rezervasyonu
  - name: orders
    description: Sipariş oluşturma, 3DS ve sorgulama
  - name: realtime
    description: Socket.io odaları için kısa ömürlü jeton

security:
  - bearerAuth: []

paths:
  /v1/auth/register:
    post:
      tags: [auth]
      operationId: registerUser
      summary: Yeni kullanıcı kaydı
      description: |
        Hesabı açar ve oturumu başlatır: cevapta erişim ve yenileme jetonu
        birlikte gelir, ayrıca giriş gerekmez. Şifre yalnızca bcrypt özetiyle
        saklanır. `fullName` baştaki ve sondaki boşluklardan arındırılır.

        `Idempotency-Key` zorunludur. Bu uç tekrar kuralının TEK istisnasıdır
        (ADR-08 eki): cevap jeton taşıdığı için saklanmaz ve tekrar edilmez.
        Aynı anahtarla gelen tekrar, ilki hâlâ işleniyorsa
        `409 REQUEST_IN_PROGRESS` alır; bitmişse uca geçer ve
        `409 PHONE_ALREADY_REGISTERED` döner: ikinci hesap açılmaz,
        `users.phone` benzersiz indeksi bunu garanti eder. Aynı anahtar farklı
        gövdeyle `409 CONFLICT` alır.
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Kullanıcı oluşturuldu, oturum açıldı
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Set-Cookie:
              $ref: "#/components/headers/SessionCookies"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AuthSession"
        "400":
          description: |
            Biçim hatası: eksik başlık, bilinmeyen alan, kural dışı değer. Bütün
            sorunlar TEK cevapta, `details` içinde alan adıyla döner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                validationError:
                  summary: VALIDATION_FAILED (başlık ve alanlar)
                  value:
                    success: false
                    error:
                      code: VALIDATION_FAILED
                      message: "Girdiğin bilgilerde bir sorun var, kontrol eder misin?"
                      details:
                        Idempotency-Key: zorunlu
                        phone: "Cep telefonu numarası 5 ile başlayan 10 rakam olmalı (örnek 532 123 45 67)"
                        password: en az 8 karakter olmalı
                        fullName: en az 2 karakter olmalı
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
                unknownField:
                  summary: VALIDATION_FAILED (sözleşmede olmayan alan)
                  value:
                    success: false
                    error:
                      code: VALIDATION_FAILED
                      message: "Girdiğin bilgilerde bir sorun var, kontrol eder misin?"
                      details:
                        email: bu uc bu alani kabul etmiyor
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
                idempotencyKeyInvalid:
                  $ref: "#/components/examples/IdempotencyKeyInvalid"
        "409":
          description: |
            Telefon numarası başka bir hesaba ait (`PHONE_ALREADY_REGISTERED`;
            biten kaydın aynı anahtarla tekrarı da bunu alır). Anahtarla ilgili
            iki durum: ilk istek hâlâ işleniyor (`REQUEST_IN_PROGRESS`) ya da
            anahtar farklı bir gövdeyle kullanılmış (`CONFLICT`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                phoneAlreadyRegistered:
                  summary: PHONE_ALREADY_REGISTERED
                  value:
                    success: false
                    error:
                      code: PHONE_ALREADY_REGISTERED
                      message: "Bu telefon numarasıyla kayıtlı bir hesap var. Giriş yapmayı dener misin?"
                      details:
                        phone: bu numarayla kayitli bir hesap var
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
                requestInProgress:
                  $ref: "#/components/examples/IdempotencyRequestInProgress"
                keyReused:
                  $ref: "#/components/examples/IdempotencyKeyReused"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/auth/login:
    post:
      tags: [auth]
      operationId: loginUser
      summary: Oturum açma
      description: |
        Telefon ve şifreyle yeni bir oturum açar. Kalıcı bir kaynak yaratmadığı
        için `Idempotency-Key` istemez.

        Yanlış şifre ile kayıtsız numara AYNI cevabı alır (kod, mesaj, süre):
        kayıtlı numaralar bu uçtan taranamaz. Biçim kuralları (numara biçimi,
        şifre uzunluğu) ise alan adıyla `400` döner; bunlar hesap hakkında
        bilgi vermez.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Oturum açıldı
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Set-Cookie:
              $ref: "#/components/headers/SessionCookies"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AuthSession"
        "400":
          description: Gövde biçimi geçersiz
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                validationError:
                  summary: VALIDATION_FAILED
                  value:
                    success: false
                    error:
                      code: VALIDATION_FAILED
                      message: "Girdiğin bilgilerde bir sorun var, kontrol eder misin?"
                      details:
                        phone: "Cep telefonu numarası 5 ile başlayan 10 rakam olmalı (örnek 532 123 45 67)"
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
        "401":
          description: Telefon numarası ya da şifre hatalı (hangisi olduğu söylenmez)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                invalidCredentials:
                  summary: INVALID_CREDENTIALS
                  value:
                    success: false
                    error:
                      code: INVALID_CREDENTIALS
                      message: "Telefon numarası ya da şifre hatalı."
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/password-reset:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: Şifre yenileme — demo (T11.9)
      description: |
        "Şifremi unuttum": telefonu kayıtlı hesabın şifresini değiştirir, BÜTÜN
        eski oturumlarını kapatır ve girişteki gibi yeni oturum açar (kullanıcı
        doğrudan girer).

        **Demo akışı:** kimlik kanıtlanmaz (SMS kodu yok). Bu yüzden uç yalnızca
        `NODE_ENV` production DEĞİLKEN bağlanır; production'da yoktur (`404`).
        Girişle aynı IP sınırına tabidir. Giriş gibi oturum ucudur:
        `Idempotency-Key` istemez. Numaranın kayıtlı olmadığını söylemesi yeni
        bir sızıntı değildir (`/v1/auth/phone-check` aynı bilgiyi verir).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Şifre değişti, oturum açıldı
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Set-Cookie:
              $ref: "#/components/headers/SessionCookies"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AuthSession"
        "400":
          description: Biçim hatası ya da numarayla kayıtlı hesap yok (`details.phone`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                unknownPhone:
                  summary: VALIDATION_FAILED (kayıtsız numara)
                  value:
                    success: false
                    error:
                      code: VALIDATION_FAILED
                      message: "Girdiğin bilgilerde bir sorun var, kontrol eder misin?"
                      details:
                        phone: "Bu numarayla kayıtlı bir hesap yok"
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
        "404":
          description: Production'da uç yoktur (demo akışı canlıya çıkmaz).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/phone-check:
    post:
      tags: [auth]
      operationId: checkPhone
      summary: Numarayla kayıtlı hesap var mı (T11.7)
      description: |
        Karşılama ekranının giriş ve kayıt penceresi numara yazılınca erken
        uyarır: kayıtta "hesap var", girişte "hesap yok". **Bilinçli ödünleşim**
        (2 Ekim kararı): cevap bir numaranın kayıtlı olup olmadığını söyler;
        uç IP başına kimlik sınırına tabidir (girişle aynı sınır, ayrı sayaç)
        ve numara günlüğe yazılmaz. Numara gövdededir, adreste değil.

        Kalıcı bir şey değiştirmez: `Idempotency-Key` istemez. Cevap
        önbelleklenmez (`Cache-Control: no-store`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone]
              properties:
                phone:
                  type: string
                  pattern: "^\\+90[0-9]{10}$"
      responses:
        "200":
          description: Kayıt durumu
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [registered]
                        properties:
                          registered:
                            type: boolean
        "400":
          description: Biçimsiz numara, tanınmayan alan ya da sorgu parametresi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Erişim jetonunu yenile
      description: |
        Yenileme jetonunu YENİSİYLE DEĞİŞTİRİR ve yeni bir erişim jetonu verir;
        oturum (`sid`) aynı kalır. Eski yenileme jetonu bir daha geçmez: çalınan
        jetonla ikinci yenileme reddedilir, aynı jetonla eş zamanlı iki
        istekten yalnızca biri başarır. Süre her yenilemede o andan itibaren
        REFRESH_TTL'e uzar; kullanılmayan oturum REFRESH_TTL sonunda kapanır.

        Erişim jetonu istemez: süresinin dolmuş olması bu ucun çağrılma
        sebebidir. İstemci aynı jetonla iki yenilemeyi aynı anda göndermemeli;
        cevabı kaybolan yenilemede yeniden giriş gerekir.

        Gövdesizdir: jeton `getir_refresh` çerezinden okunur ve yenisi aynı
        çereze yazılır. Kullanılamayan jetonun çerezi silinir (tarayıcı ölü
        jetonu her açılışta yeniden göndermesin).
      security: []
      parameters:
        - $ref: "#/components/parameters/RefreshCookieRequired"
      responses:
        "200":
          description: Yeni erişim jetonu; yenileme jetonu çerezde yenilendi
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AuthSession"
        "401":
          description: |
            Çerez yok ya da içindeki jeton geçersiz, kullanılmış, iptal edilmiş
            veya süresi dolmuş. İstemci girişe yönlenir. Geçersiz jetonun
            çerezi silinir.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookieCleared"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                refreshCookieMissing:
                  summary: UNAUTHORIZED (çerez yok)
                  value:
                    success: false
                    error:
                      code: UNAUTHORIZED
                      message: "Oturumun sona ermiş. Tekrar giriş yapman gerekiyor."
                      details:
                        getir_refresh: zorunlu
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
                refreshTokenInvalid:
                  summary: UNAUTHORIZED (jeton kullanılamaz)
                  value:
                    success: false
                    error:
                      code: UNAUTHORIZED
                      message: "Oturumun sona ermiş. Tekrar giriş yapman gerekiyor."
                      details:
                        getir_refresh: gecersiz, kullanilmis ya da suresi dolmus
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logoutSession
      summary: Oturumu kapat
      description: |
        Yenileme jetonunu iptal eder (oturum kaydı silinir) ve `getir_refresh`
        çerezini siler. Gövdesizdir: jeton çerezden okunur. Tekrarı zararsızdır:
        ikinci çağrı ya da çerezsiz çağrı `revoked: false` alır, bu yüzden
        `Idempotency-Key` istemez. İstemci her iki durumda da yerel oturumu siler.

        Erişim jetonu kendi süresi (JWT_TTL) dolana kadar geçerli kalır:
        durumsuz jetonun bilinen bedeli, ömrünün kısa tutulma sebebi budur.
      security: []
      parameters:
        - $ref: "#/components/parameters/RefreshCookieOptional"
      responses:
        "200":
          description: Çıkış tamam; çerez silindi
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookieCleared"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/LogoutResult"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Oturumdaki kullanıcının profili
      description: |
        Erişim jetonundaki kullanıcının profili. Hesap silinmişse jeton artık
        bir kullanıcıya karşılık gelmez ve `401` döner.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profil
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/UserProfile"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/me/addresses:
    get:
      tags: [auth]
      operationId: listSavedAddresses
      summary: Oturumdaki kullanıcının adres defteri (T9.5)
      description: |
        Kayıtlı adresler, kayıt sırasında. Web'in adres seçimi buradan okur;
        seçilen adres yakındaki marketleri ve genel aramayı besler. Demo
        personalarında hazır üç adres vardır (Ev, İş, Yazlık); adresi olmayan
        hesapta BOŞ liste döner — hata değil.

        Sayfasız SINIRLI liste: en fazla 10 adres (`SAVED_ADDRESSES_MAX`; proje
        kuralları, "Sınırlı listeler istisnası"). Yazan her yol sınırı aşan
        kaydı reddeder. Kişisel veridir: önbelleğe alınmaz.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Adres defteri
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            maxItems: 10
                            items:
                              $ref: "#/components/schemas/SavedAddress"
        "400":
          description: Bilinmeyen sorgu parametresi (VALIDATION_FAILED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [auth]
      operationId: createSavedAddress
      summary: Adres defterine adres ekle (T11.8)
      description: |
        Oturumdaki kullanıcının defterine yeni adres; cevap GÜNCEL defterdir
        (kayıt sırasında). Web, kayıtlı adresi olmayan kullanıcıya adres ekleme
        penceresini açar (harita + detay) ve kaydedince market listesine geçer.

        Metinler baştaki ve sondaki boşluklardan arındırılır. Aynı adla ikinci
        adres olmaz (seçici adla seçer) ve defter en fazla 10 adres tutar
        (`SAVED_ADDRESSES_MAX`); iki kural da tek atomik yazımda uygulanır, eş
        zamanlı iki istek sınırı aşamaz. `Idempotency-Key` zorunludur.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAddressRequest"
      responses:
        "201":
          description: Adres eklendi; güncel defter
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            maxItems: 10
                            items:
                              $ref: "#/components/schemas/SavedAddress"
        "400":
          description: |
            Biçim ya da kural hatası; hepsi tek cevapta. `details` alanı
            gövdedeki adla gösterir (`title`, `location.lat`, `Idempotency-Key`).
            Aynı adla kayıtlı adres `title`, dolu defter `addresses` alanındadır.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                titleTaken:
                  summary: VALIDATION_FAILED (aynı ad)
                  value:
                    success: false
                    error:
                      code: VALIDATION_FAILED
                      message: "Girdiğin bilgilerde bir sorun var, kontrol eder misin?"
                      details:
                        title: "Bu adla kayıtlı bir adresin var"
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
                bookFull:
                  summary: VALIDATION_FAILED (dolu defter)
                  value:
                    success: false
                    error:
                      code: VALIDATION_FAILED
                      message: "Girdiğin bilgilerde bir sorun var, kontrol eder misin?"
                      details:
                        addresses: "En fazla 10 adres kaydedebilirsin"
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          description: |
            Aynı `Idempotency-Key` ile ilk istek hâlâ işleniyor
            (`REQUEST_IN_PROGRESS`) ya da anahtar farklı bir gövdeyle geldi
            (`CONFLICT`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                inProgress:
                  $ref: "#/components/examples/IdempotencyRequestInProgress"
                keyReused:
                  $ref: "#/components/examples/IdempotencyKeyReused"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/geo/reverse:
    get:
      tags: [geo]
      operationId: reverseGeocode
      summary: Noktanın adres satırı (T11.8)
      description: |
        Adres ekleme penceresinde pinin olduğu noktanın Türkçe adres satırı
        ("Osmanağa Mahallesi, Nail Bey Sokağı 23, 34710 Kadıköy/İstanbul,
        Türkiye"); satır doğrudan adres formuna yazılır.

        Kaynak OpenStreetMap Nominatim'dir; tarayıcı ona gitmez. Kullanım koşulu
        gereği gateway bütün istekleri tek sıraya dizer (saniyede en fazla bir)
        ve cevapları 24 saat önbellekler (~1 m içindeki nokta aynı sorudur).
        Sıra `GEO_TIMEOUT_MS` içinde ilerlemezse ya da Nominatim cevap vermezse
        `503`: kullanıcı satırı kendisi yazar. Konum kişisel veridir: cevap
        önbelleğe alınmaz.
      security:
        - bearerAuth: []
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: lng
          in: query
          required: true
          schema: { type: number, minimum: -180, maximum: 180 }
      responses:
        "200":
          description: Adres satırı
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ReverseGeocodeResult"
        "400":
          description: Eksik ya da aralık dışı koordinat, bilinmeyen parametre (VALIDATION_FAILED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: Noktada adres yok (deniz, orman); satırı kullanıcı yazar (NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/geo/search:
