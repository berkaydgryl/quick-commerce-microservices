  /v1/markets/{marketId}/products:
    get:
      tags: [catalog]
      operationId: listMarketProducts
      summary: Marketin ürünleri, o marketin fiyatı ve stoğuyla
      description: |
        FİYAT markete özeldir (ADR-15): aynı ürün başka markette farklı fiyattadır.
        `q` verilirse arama yapılır; `categoryId` ile birlikte kullanılabilir.
        Market var ama eşleşme yoksa BOŞ liste döner; market yoksa NOT_FOUND.

        STOK (T8.4, B27): sayfadaki bütün ürünlerin adedi inventory-svc'ye TEK
        çağrıyla sorulur. Stok servisi cevap vermezse sayfa yine döner, ürünlerde
        `availableQuantity` olmaz (bkz. `Product.availableQuantity`).
      security: []
      parameters:
        - $ref: "#/components/parameters/MarketIdPath"
        - name: categoryId
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CategoryId"
        - name: q
          in: query
          required: false
          description: |
            Arama (T9.4): ad ve açıklamada, büyük/küçük harf ve Türkçe karakter
            duyarsız ("sut" → "Süt"), kelime içinde de ("çik" → "Çikolata").
            Boşluklu sorguda kelimelerin HEPSİ geçmeli, sıra önemsiz
            ("peynir beyaz" → "Beyaz Peynir"). Baş/son boşluk kırpılır; tek
            harf `VALIDATION_FAILED` (`details.q`).
          schema: { type: string, minLength: 2, maxLength: 64 }
        - $ref: "#/components/parameters/PageTokenParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: Ürün sayfası
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, page]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/Product"
                          page:
                            $ref: "#/components/schemas/Page"
        "400":
          description: |
            Geçersiz istek (VALIDATION_FAILED): `mkt_` biçiminde olmayan market,
            `cat_` biçiminde olmayan kategori ya da 2-64 karakter dışındaki arama.
            Biçimi bozuk kategori BOŞ LİSTE değil 400'dür: yazım hatası "bu
            kategoride ürün yok" sanılmasın.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Market yok (NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/search:
    get:
      tags: [catalog]
      operationId: searchNearby
      summary: Genel arama — markete girmeden, yakındaki marketlerde (T9.6)
      description: |
        "Market ya da Ürün ara…": konuma hizmet veren marketlerde (yakındaki
        marketlerle aynı kural, kapalılar dahil) ürün YA DA market adı. Eşleşme
        market içi aramayla aynıdır (T9.4: harf ve Türkçe karakter duyarsız,
        boşluklu sorguda her kelime geçmeli).

        Sonuç MARKET MARKET döner; SIRA MESAFEDİR (fiyat değil: farklı ürünlerde
        gramaj farkı yanıltır): açık marketler yakından uzağa, kapalı marketler
        en sonda. Adı eşleşen market, ürün eşleşmesi olmasa da listelenir
        (`marketNameMatched: true`, `products: []`). Market başına eşleşen
        ürünlerin ilk 3'ü (market sayfasıyla aynı sıra) ve toplam sayı döner;
        istemci fazlası için "+N ürün daha" gösterir. Satıştan kaldırılmış
        (pasif) ürün genel aramada yoktur.

        STOK (T8.4 kurallarıyla): ürünü olan her market için inventory-svc'ye
        BİR `CheckAvailability`, hepsi paralel (stok sayaçları market bazında
        tutulur). Bir marketin stoğu gelmezse yalnızca o marketin ürünlerinde
        `availableQuantity` olmaz.

        Sayfasız SINIRLI liste: en fazla 20 market, market başına en fazla 3 ürün
        (proje kuralları, "Sınırlı listeler istisnası"). Eşleşme yoksa ya da
        bölgede market yoksa BOŞ liste döner — hata değil.
      security: []
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: lng
          in: query
          required: true
          schema: { type: number, minimum: -180, maximum: 180 }
        - name: q
          in: query
          required: true
          description: |
            Arama metni. Baş/son boşluk kırpılır; boşsa `zorunlu`, kırpılmış
            metin 2-64 karakter (`details.q`).
          schema: { type: string, minLength: 2, maxLength: 64 }
      responses:
        "200":
          description: Eşleşen marketler, mesafe sırasında
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/SearchResult"
        "400":
          description: |
            Konum eksik, sayı değil ya da WGS84 dışında; arama eksik ya da 2-64
            karakter dışında. Sebep `details` alanında Türkçedir, örn.
            `{"q": "en az 2 karakter olmali"}`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/cart/reserve:
    post:
      tags: [cart]
      operationId: reserveCart
      summary: Sepeti fiyatlandır ve taslak sipariş aç
      description: |
        Sepeti sunucuda fiyatlandırıp taslak sipariş açar ve `orderId` üretir
        (T7.5, order-service `CreateDraftOrder`). Tutar istemciye güvenilmeden
        catalog fiyatlarıyla hesaplanır; `expectedTotal` tutmazsa taslak açılmaz,
        `409 PRICE_CHANGED` güncel toplamla döner. Kalem `sku` taşımaz; sunucu
        onu catalog teklifinden alır.

        Stok taslak açılırken kilitlenir (T11.2; inventory, Redis + Lua). Cevapta
        kilidin bitiş anı (`expiresAt`) ve sunucunun saatiyle kalan saniye
        (`ttlSeconds`, T11.4) döner: istemci geri sayımı bundan başlatır. Sepet tek
        markettendir (`marketId`); o markette satılmayan ürün `400 VALIDATION_FAILED`.
        Kilidi bırakmak için `DELETE /v1/cart/reserve/{orderId}`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReserveCartRequest"
      responses:
        "201":
          description: Taslak sipariş açıldı
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Reservation"
        "400":
          description: |
            Biçim hatası (bilinmeyen alan, yanlış tip, eksik başlık) ya da kural
            ihlali (boş sepet, markette satışta olmayan ürün). `details` alanı
            istemcinin gönderdiği adla gösterir.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                idempotencyKeyRequired:
                  summary: VALIDATION_FAILED (başlık yok)
                  value:
                    success: false
                    error:
                      code: VALIDATION_FAILED
                      message: "Girdiğin bilgilerde bir sorun var, kontrol eder misin?"
                      details:
                        Idempotency-Key: zorunlu
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
                unknownField:
                  summary: VALIDATION_FAILED (sözleşmede olmayan alan)
                  value:
                    success: false
                    error:
                      code: VALIDATION_FAILED
                      message: "Girdiğin bilgilerde bir sorun var, kontrol eder misin?"
                      details:
                        title: bu uc bu alani kabul etmiyor
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
                unavailableProducts:
                  summary: VALIDATION_FAILED (markette satışta değil)
                  value:
                    success: false
                    error:
                      code: VALIDATION_FAILED
                      message: "Girdiğin bilgilerde bir sorun var, kontrol eder misin?"
                      details:
                        unavailableProductIds: ["prd_yok"]
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
                idempotencyKeyInvalid:
                  $ref: "#/components/examples/IdempotencyKeyInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: Market bulunamadı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          description: |
            Fiyat değişti (`PRICE_CHANGED`, ayrıntıda güncel toplam). Aynı
            anahtarlı istek hâlâ işleniyor (`REQUEST_IN_PROGRESS`) ya da anahtar
            farklı bir gövdeyle kullanılmış (`CONFLICT`). Stok yetersizliği
            (`STOCK_INSUFFICIENT`) T11.2 ile gelir.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                priceChanged:
                  summary: PRICE_CHANGED
                  value:
                    success: false
                    error:
                      code: PRICE_CHANGED
                      message: "Sepetindeki fiyatlar güncellendi. Yeni tutarı onaylar mısın?"
                      details:
                        expectedTotalMinor: 19000
                        totalMinor: 19360
                        currency: TRY
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
                requestInProgress:
                  $ref: "#/components/examples/IdempotencyRequestInProgress"
                keyReused:
                  $ref: "#/components/examples/IdempotencyKeyReused"
        "422":
          description: Kupon uygulanamadı ya da minimum sepet tutarına ulaşılmadı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                couponInvalid:
                  summary: COUPON_INVALID
                  value:
                    success: false
                    error:
                      code: COUPON_INVALID
                      message: "Bu kupon kullanılamıyor."
                      details:
                        couponCode: ILK10
                        reason: NOT_FIRST_ORDER
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
                minBasketNotMet:
                  summary: MIN_BASKET_NOT_MET
                  value:
                    success: false
                    error:
                      code: MIN_BASKET_NOT_MET
                      message: "Minimum sepet tutarına ulaşmadın."
                      details:
                        amountToMinBasketMinor: 4000
                        minBasketMinor: 5000
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/cart/reserve/{orderId}:
    delete:
      tags: [cart]
      operationId: releaseCartReservation
      summary: Rezervasyonu iptal et, stoğu geri ver
      description: |
        Taslağı ya da ödeme bekleyen siparişi bırakır, stok geri döner (T11.4,
        order-service `CancelOrder`). Taslağı bırakmak risk geçmişinde sipariş
        iptali sayılmaz (`CART_RELEASED`); ödeme aşamasından iptal sayılır.

        Zaten bırakılmış (kullanıcı iptali ya da süresi dolup süpürülmüş) rezervasyon
        HATA DEĞİLDİR: `200`, `released: false`, `releasedAt` o an. Başkasının
        siparişi `404` (var olduğu sızdırılmaz). Parası alınmış ya da kart çekimi
        süren sipariş `409 REQUEST_IN_PROGRESS`; ödenmiş ya da başka son durumdaki
        sipariş `409 ORDER_STATE_INVALID`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Rezervasyon serbest bırakıldı
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ReservationRelease"
        "400":
          description: Idempotency başlığı yok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                idempotencyKeyRequired:
                  summary: VALIDATION_FAILED
                  value:
                    success: false
                    error:
                      code: VALIDATION_FAILED
                      message: "Idempotency-Key başlığı zorunludur."
                      details: null
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: Rezervasyon yok ya da başka kullanıcıya ait
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                reservationNotFound:
                  summary: NOT_FOUND
                  value:
                    success: false
                    error:
                      code: NOT_FOUND
                      message: "Rezervasyon bulunamadı."
                      details:
                        orderId: "ord_db77f4c0e24f49919cc1d78a649c9c94"
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
        "409":
          description: Sipariş bu durumda bırakılamaz
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                paymentInProgress:
                  summary: REQUEST_IN_PROGRESS
                  value:
                    success: false
                    error:
                      code: REQUEST_IN_PROGRESS
                      message: "Ödeme işleniyor; sipariş tamamlanınca ya da süresi dolunca iade edilir."
                      details:
                        orderId: "ord_db77f4c0e24f49919cc1d78a649c9c94"
                        paymentStatus: SUCCEEDED
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
                orderStateInvalid:
                  summary: ORDER_STATE_INVALID
                  value:
                    success: false
                    error:
                      code: ORDER_STATE_INVALID
                      message: "Bu durumdaki sipariş iptal edilemez: PAID"
                      details:
                        orderId: "ord_db77f4c0e24f49919cc1d78a649c9c94"
                        status: PAID
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/orders:
    post:
      tags: [orders]
      operationId: createOrder
      summary: Taslağı siparişe çevir (saga)
      description: |
        Taslak kimliği (`orderId`) ile risk değerlendirmesi ve ödeme saga'sını
        çalıştırır (T7.1, order-service `CreateOrder`). Sepet ve adres TEKRAR
        GÖNDERİLMEZ: tutar ve konum taslakta dondurulmuştur.

        * LOW bant: kart çekilir, sipariş `PAID`.
        * MEDIUM bant: kart + 3DS zorunlu; sipariş `AWAITING_PAYMENT` ve
          `threeDs.challengeId` ile döner, `/v1/orders/{id}/3ds` ile tamamlanır.
        * HIGH bant: manuel inceleme (`202 RISK_REVIEW`), ödeme alınmaz.
        * CRITICAL bant: ret (`403 RISK_BLOCKED`), ödeme alınmaz.

        Risk sinyalleri istemciden alınmaz (B9): IP bağlantıdan; cihaz, önceki
        giriş IP'si ve oturum konumu erişim jetonunun OTURUMUNDAN; hesap yaşı ve
        hesabın açıldığı cihazdan açılmış hesap sayısı kullanıcı kaydından
        (T8.1). Oturum kapatılmışsa (çıkış) jeton süresi dolmamış olsa bile
        `401` döner.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Sipariş oluşturuldu; 3DS gerekiyorsa `threeDs` doludur
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/OrderPlacement"
              examples:
                paid:
                  summary: LOW bant, ödeme alındı
                  value:
                    success: true
                    data:
                      orderId: "ord_db77f4c0e24f49919cc1d78a649c9c94"
                      status: PAID
                awaitingThreeDs:
                  summary: MEDIUM bant, 3DS bekleniyor
                  value:
                    success: true
                    data:
                      orderId: "ord_db77f4c0e24f49919cc1d78a649c9c94"
                      status: AWAITING_PAYMENT
                      threeDs:
                        challengeId: "tds_0009d7cd0e904b689aabcacf4458d520"
        "202":
          description: |
            Risk yüksek (HIGH): sipariş `REVIEW` durumunda, manuel inceleme
            bekliyor (`RISK_REVIEW`). Ödeme alınmadı.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "400":
          description: Biçim hatası, başlık yok ya da anahtar biçimsiz
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                notCard:
                  summary: VALIDATION_FAILED (REST'te tek yöntem kart)
                  value:
                    success: false
                    error:
                      code: VALIDATION_FAILED
                      message: "Girdiğin bilgilerde bir sorun var, kontrol eder misin?"
                      details:
                        payment.method: CARD olmali
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
                idempotencyKeyInvalid:
                  $ref: "#/components/examples/IdempotencyKeyInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          description: |
            Ödeme reddedildi: sipariş `PAYMENT_FAILED` durumuna geçti (tutar
            çekilmedi). Kullanıcı yeni bir sepetle tekrar dener.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                paymentDeclined:
                  summary: PAYMENT_DECLINED
                  value:
                    success: false
                    error:
                      code: PAYMENT_DECLINED
                      message: "Ödeme alınamadı. Başka bir kart deneyebilirsin."
                      details:
                        orderId: "ord_db77f4c0e24f49919cc1d78a649c9c94"
                        status: PAYMENT_FAILED
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
        "403":
          description: |
            Risk kritik (CRITICAL): sipariş `REJECTED` durumunda (`RISK_BLOCKED`).
            Ödeme alınmadı.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          $ref: "#/components/responses/OrderNotFound"
        "409":
          description: |
            Sipariş bu adıma uygun değil (`ORDER_STATE_INVALID`, ayrıntıda denenen
            geçiş) ya da önceki ödeme denemesi hâlâ sonuçlanmadı
            (`REQUEST_IN_PROGRESS`). Aynı anahtarlı istek hâlâ işleniyorsa da
            `REQUEST_IN_PROGRESS` (ayrıntıda `Idempotency-Key`); anahtar farklı
            bir gövdeyle kullanılmışsa `CONFLICT`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                orderStateInvalid:
                  summary: ORDER_STATE_INVALID
                  value:
                    success: false
                    error:
                      code: ORDER_STATE_INVALID
                      message: "Siparişin bu adımda bu işlemi yapmaya uygun değil."
                      details:
                        orderId: "ord_db77f4c0e24f49919cc1d78a649c9c94"
                        from: CANCELLED
                        to: RISK_CHECK
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
                requestInProgress:
                  $ref: "#/components/examples/IdempotencyRequestInProgress"
                keyReused:
                  $ref: "#/components/examples/IdempotencyKeyReused"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/orders/{id}/3ds:
    post:
      tags: [orders]
      operationId: submitThreeDsChallenge
      summary: 3DS doğrulamasını tamamla
      description: |
        Kod doğruysa sipariş `PAID` olur (order-service `ConfirmPayment`). Yanlış
        kod `402 THREEDS_FAILED` döner ve kalan hak ayrıntıdadır; hak biter ya da
        süre dolarsa sipariş `PAYMENT_FAILED` olur (`attemptsLeft: 0`). Biçimi
        bozuk kod deneme sayılmaz (`400`).

        Her kod denemesi ayrı bir niyettir: yeni kod YENİ bir `Idempotency-Key`
        ile gönderilir. Aynı anahtarla farklı kod `409 CONFLICT` alır; aynı kodun
        aynı anahtarla tekrarı ilk cevabı (ör. `402`, aynı `attemptsLeft`) alır,
        hak ikinci kez düşmez.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderIdPathId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThreeDsRequest"
      responses:
        "200":
          description: 3DS doğrulandı, sipariş ödendi
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/OrderPlacement"
        "400":
          description: Kod 6 hane değil, başlık yok ya da anahtar biçimsiz
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                badOtp:
                  summary: VALIDATION_FAILED
                  value:
                    success: false
                    error:
                      code: VALIDATION_FAILED
                      message: "Girdiğin bilgilerde bir sorun var, kontrol eder misin?"
                      details:
                        otp: 6 haneli kod olmali
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
                idempotencyKeyInvalid:
                  $ref: "#/components/examples/IdempotencyKeyInvalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "402":
          description: 3DS doğrulaması başarısız
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                wrongCode:
                  summary: THREEDS_FAILED (hak kaldı)
                  value:
                    success: false
                    error:
                      code: THREEDS_FAILED
                      message: "Doğrulama kodu geçersiz. Tekrar dener misin?"
                      details:
                        attemptsLeft: 1
                        reason: wrong_code
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
                exhausted:
                  summary: THREEDS_FAILED (hak bitti, sipariş PAYMENT_FAILED)
                  value:
                    success: false
                    error:
                      code: THREEDS_FAILED
                      message: "Doğrulama kodu geçersiz. Tekrar dener misin?"
                      details:
                        attemptsLeft: 0
                        reason: attempts_exhausted
                      requestId: "req_7f3c9a1e5b2d4c6f8a0b1c2d3e4f5a6b"
        "404":
          $ref: "#/components/responses/OrderNotFound"
        "409":
          description: |
            Sipariş 3DS beklemiyor (`ORDER_STATE_INVALID`), aynı anahtarlı istek
            hâlâ işleniyor (`REQUEST_IN_PROGRESS`) ya da anahtar farklı bir kodla
            kullanılmış (`CONFLICT`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              examples:
                requestInProgress:
                  $ref: "#/components/examples/IdempotencyRequestInProgress"
                keyReused:
                  $ref: "#/components/examples/IdempotencyKeyReused"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/orders/{id}:
