# Gelistirme ortami altyapisi (yalnizca durum tutan servisler).
#
# Bu compose dosyasi SADECE MongoDB'yi, Redis'i, iz goruntuleyicisini
# (Jaeger, D15) ve sahte posta sunucusunu (Mailpit, T11.14) ayaga kaldirir. Uygulama servisleri (apps/*) host uzerinde
# "pnpm dev" ile calisir; bilerek konteynerize edilmemislerdir (hizli yeniden
# yukleme + kolay hata ayiklama).
#
# Kullanim:
#   docker compose -f infra/docker/docker-compose.dev.yml up -d
#
# Ayrintili adimlar icin ayni klasordeki README.md dosyasina bakin.

name: getir-dev

services:
  # ---------------------------------------------------------------------------
  # MongoDB 7 - tek dugumlu replica set (rs0)
  # ---------------------------------------------------------------------------
  # NEDEN replica set? Cok belgeli ACID transaction (siparis olusturma akisinda
  # gerekiyor) MongoDB'de yalnizca replica set uzerinde calisir. Tek dugum de
  # olsa replica set olarak baslatmak zorundayiz.
  #
  # KIMLIK DOGRULAMA (D14, ADR-05): her servisin KENDI kullanicisi vardir ve
  # yalnizca kendi veritabaninda (getir_catalog, getir_order...) yetkilidir.
  # Kullanicilar kok .env'den gelir (env_file): kok kullanici MONGO_ROOT_*,
  # servis kullanicilari <SERVIS>_MONGO_URI adreslerinden. Ilk acilista (bos
  # hacim) mongo/init/service-users.js olusturur; mongo/entrypoint.sh replica
  # set'in istedigi anahtar dosyasini (keyFile) her acilista uretir.
  mongo:
    image: mongo:7
    container_name: getir-mongo
    restart: unless-stopped
    env_file:
      - path: ../../.env
        required: false
    entrypoint: ["bash", "/opt/getir/mongo/entrypoint.sh"]
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      # D14 ile yeni hacim: D14 oncesi kimlik dogrulamasiz hacim (getir-mongo-data)
      # oldugu gibi kalir; istenirse elle silinir (infra/docker/README.md).
      - getir-mongo-auth-data:/data/db
      - ./mongo/entrypoint.sh:/opt/getir/mongo/entrypoint.sh:ro
      - ./mongo/init:/docker-entrypoint-initdb.d:ro
    networks:
      - getir-net
    # -------------------------------------------------------------------------
    # Kendi kendine baslayan replica set (healthcheck icinde rs.initiate)
    # -------------------------------------------------------------------------
    # Healthcheck iki is birden yapar:
    #   1) rs.status().myState === 1 ise (dugum PRIMARY) -> saglikli say.
    #   2) hata firlatirsa -> ilk acilistir, rs.initiate ile rs0'i baslat ve
    #      bu kosuyu BASARISIZ say; bir sonraki denemede PRIMARY'e gecmis olur.
    #      (rs.initiate anindan PRIMARY secimine kadar kisa bir pencere vardir;
    #       healthcheck o pencerede "healthy" derse transaction'lar patlar.)
    # Boylece ayri bir "init" konteyneri veya elle mongosh adimi gerekmez;
    # konteyner "healthy" oldugunda replica set de hazirdir.
    #
    # KRITIK KARAR - member host'u NEDEN "localhost:27017"?
    # Node servisleri konteyner icinde DEGIL, host makinede calisir ve
    # <SERVIS>_MONGO_URI = mongodb://<kullanici>:<parola>@localhost:27017/?directConnection=true&authSource=admin
    # ile baglanir. Replica set uyesini "mongo:27017" (konteyner adi) diye
    # kaydedersek, surucu replica set topolojisini kesfedip bu adrese yeniden
    # baglanmaya calisir ve host'tan "mongo" adi cozulemedigi icin transaction'lar
    # patlar. Uyeyi "localhost:27017" olarak kaydedip istemci tarafinda
    # directConnection=true kullanmak, surucunun topoloji kesfini atlayip
    # dogrudan bu dugume konusmasini saglar -> host'tan transaction calisir.
    #
    # NOT: directConnection=true ile replicaSet=rs0 ayni baglanti dizesinde
    # BIRLIKTE KULLANILAMAZ; bu yuzden URI'de sadece directConnection vardir.
    #
    # Yoklama kok kullaniciyla baglanir: kimlik dogrulama acikken rs.status ve
    # rs.initiate yetki ister. ("$$": compose degiskeni degil, konteynerin ortami.)
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          mongosh --quiet -u "$$MONGO_ROOT_USERNAME" -p "$$MONGO_ROOT_PASSWORD" --authenticationDatabase admin --eval "try { quit(rs.status().myState === 1 ? 0 : 1) } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}); quit(1) }"
      interval: 5s
      retries: 20
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Redis 7 - stok sayaclari, rezervasyon indeksi, oran sinirlama, idempotency
  # ---------------------------------------------------------------------------
  # Ayarlar bilerek dosyadan okunur (redis.conf): her ayarin gerekcesi orada
  # yorum olarak durur, komut satirinda kaybolmaz.
  redis:
    image: redis:7-alpine
    container_name: getir-redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "6379:6379"
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
      - getir-redis-data:/data
    networks:
      - getir-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Jaeger v2 - dagitik izlerin goruntuleyicisi (D15, ADR-20)
  # ---------------------------------------------------------------------------
  # Gateway ve Node servisleri izleri OTLP/HTTP ile 4318'e gonderir
  # (OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318); arayuz
  # http://localhost:16686. Izler BELLEKTE tutulur, konteyner yeniden baslayinca
  # gider: yerel gelistirme icin kalici depo gerekmez. v1'in all-in-one imaji
  # Aralik 2025'ten beri guncellenmiyor; v2 ayni isi tek ikiliyle yapar.
  jaeger:
    image: jaegertracing/jaeger:2.21.0
    container_name: getir-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "4318:4318"
    networks:
      - getir-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:13133/status"]
      interval: 5s
      retries: 20
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Mailpit - sahte posta sunucusu (T11.14: e-posta dogrulama kodu)
  # ---------------------------------------------------------------------------
  # Gateway dogrulama kodunu SMTP ile 1025'e gonderir (SMTP_URL=smtp://localhost:1025);
  # ileti disari CIKMAZ, arayuzde gorunur: http://localhost:8025. Iletiler
  # BELLEKTE tutulur (Jaeger gibi), konteyner yeniden baslayinca gider. Gercek
  # SMTP (TLS, kimlik dogrulama) bekleyen is #90.
  mailpit:
    image: axllent/mailpit:v1.31.4
    container_name: getir-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - getir-net
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      retries: 20
      start_period: 5s

volumes:
  getir-mongo-auth-data:
    name: getir-mongo-auth-data
  getir-redis-data:
    name: getir-redis-data

networks:
  getir-net:
    name: getir-net
    driver: bridge
