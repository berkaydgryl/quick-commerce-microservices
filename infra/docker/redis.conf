# =============================================================================
# Redis yapilandirmasi - getir hizli market (gelistirme ortami)
# =============================================================================
# Bu dosyadaki her ayarin bir gerekcesi vardir. Ayar eklemeden/degistirmeden
# once gerekceyi okuyun: burada "performans" degil "dogruluk" onceliklidir,
# cunku Redis bu sistemde sadece onbellek degil, STOK SAYACLARININ kaynagidir.

# -----------------------------------------------------------------------------
# Bellek politikasi
# -----------------------------------------------------------------------------
# noeviction: Redis bellegi dolarsa ANAHTAR SILMEZ, yazma isteklerine hata
# dondurur. Bu bilincli bir tercihtir. Stok sayaclari (stock:*) ve rezervasyon
# indeksi (resv:index) tahliye edilirse "onbellek isabetsizligi" degil VERI
# KAYBI olur: olmayan stogu satmis ya da var olan stogu kaybetmis oluruz.
# Gurultulu bir hata, sessiz bir fazla satistan iyidir.
# allkeys-lru gibi bir politika bu sistemde ASLA kullanilmamalidir.
maxmemory-policy noeviction

# maxmemory bilincli olarak ayarlanmamistir (0 = sinirsiz). Gelistirme
# ortaminda veri kumesi kucuktur; uretimde bu deger kapasite planlamasiyla
# birlikte belirlenir ve noeviction ile ayni anda izlenmelidir.

# -----------------------------------------------------------------------------
# Kalicilik (AOF)
# -----------------------------------------------------------------------------
# appendonly yes: Redis yeniden baslarsa stok sayaclari sifirdan kurulmaz.
# appendfsync everysec: en kotu senaryoda ~1 saniyelik yazma kaybi. always
# secenegi her komutta diske fsync yapar (cok yavas), no secenegi ise isletim
# sistemine birakir (kayip penceresi ongorulemez). everysec bu ikisi arasindaki
# dogru dengedir.
appendonly yes
appendfsync everysec
appendfilename "appendonly.aof"
appenddirname "appendonlydir"

# AOF yeniden yazma esikleri: dosya iki katina ciktiginda ve en az 64mb ise
# sikistir. Varsayilanlarla ayni; acikca yaziliyor ki degistirilirse fark edilsin.
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# -----------------------------------------------------------------------------
# RDB anlik goruntuleri kapali
# -----------------------------------------------------------------------------
# AOF zaten kalicilik sagliyor. RDB'yi de acik birakmak, fork sirasinda
# duraklamalara ve iki ayri kurtarma yoluna sebep olur. Tek kalicilik yolu =
# tek dogruluk kaynagi. ("save" bos deger ile tamamen kapatilir.)
save ""
stop-writes-on-bgsave-error no

# -----------------------------------------------------------------------------
# Keyspace notification - BILEREK KAPALI
# -----------------------------------------------------------------------------
# ADR-02: Rezervasyon suresi dolmasi keyspace notification'a GUVENMEZ.
# Sebep: Redis'in expired olayi "en fazla bir kez" ve garantisizdir - Redis
# yeniden baslarsa, istemci baglantisi koparsa veya olay pub/sub kuyrugunda
# duserse rezervasyon sonsuza kadar asili kalir ve stok geri verilmez.
# Gercek dogruluk kaynagi: resv:index ZSET'i (skor = son kullanma zamani) ve
# onu periyodik tarayan supurucu (sweeper, SWEEPER_INTERVAL_MS).
# Bu satir BOS birakilmistir; doldurmak mimari karari sessizce bozar.
notify-keyspace-events ""

# -----------------------------------------------------------------------------
# Lua betikleri
# -----------------------------------------------------------------------------
# Stok rezervasyonu/iadesi atomik Lua betikleriyle yapilir. lua-time-limit,
# betigi OLDURMEZ; yalnizca bu sureden (ms) sonra Redis'in SCRIPT KILL ve
# BUSY yanitlari vermesine izin verir. 5000 ms, sonsuz donguye girmis bir
# betikte sunucuyu kurtarabilmek icin yeterli bir tavandir.
lua-time-limit 5000

# -----------------------------------------------------------------------------
# Baglanti ve gunlukleme
# -----------------------------------------------------------------------------
# timeout 0: bosta kalan istemci baglantisi kapatilmaz. Uzun omurlu servis
# havuzlari ve pub/sub aboneleri (realtime-service) icin gereklidir.
timeout 0
tcp-keepalive 300

bind 0.0.0.0
protected-mode no
port 6379

# Gelistirme ortami: kimlik dogrulama yok. Redis yalnizca docker agina ve
# localhost'a aciktir; uretimde requirepass/ACL zorunludur.

loglevel notice
databases 16
