name: CI

# Tetikleyiciler: main ve feat/** dallarina push, ayrica tum pull request'ler.
on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

# Ayni dal icin yeni bir kosu basladiginda devam eden eski kosuyu iptal et.
# Boylece pesi sira gelen push'lar runner dakikasi harcamaz.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# En az yetki ilkesi: is akisinin repoyu okumaktan baska hakki yok.
permissions:
  contents: read

jobs:
  quality:
    name: Kalite (lint, format, typecheck, build, unit)
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      # pnpm, setup-node'dan ONCE kurulmali: "cache: pnpm" ayari pnpm ikilisini
      # PATH'te bulamazsa adim hata verir.
      # Surum TEK yerden gelir: kok package.json'daki "packageManager" alani.
      # Buraya ayrica "version" yazilirsa action iki kaynak arasinda celiski
      # gorup hata firlatir.
      - name: pnpm kur
        uses: pnpm/action-setup@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile: lockfile ile package.json ayrisirsa CI kirmizi olur,
      # sessizce lockfile guncellenmez.
      - name: Bagimliliklari kur
        run: pnpm install --frozen-lockfile

      # buf BU ISTE DE GEREKLI (T2.3'ten beri). Sebebi ilk bakista gorunmuyor:
      # packages/proto'nun TypeScript kaynagi depoda YOKTUR, .proto dosyalarindan
      # uretilir. turbo.json icinde "typecheck" ve "build" gorevleri "generate:ts"
      # gorevine bagli; o da "buf generate" kosar. buf kurulmazsa asagidaki
      # "Tip kontrolu" adimi "buf: command not found" ile duser.
      # Go eklentileri burada GEREKMEZ: TS uretimi yalnizca node_modules'teki
      # ts-proto'yu kullanir (bkz. buf.gen.ts.yaml). Go tarafi ayri "codegen" isinde.
      - name: buf kur
        uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.73.0
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Uretim, LINT'TEN ONCE kosmak zorunda. Sebebi: eslint turbo uzerinden
      # degil dogrudan ("eslint .") kosar, yani turbo'daki "generate:ts"
      # bagimliligi onu kapsamaz. packages/proto/test icindeki testler
      # gen/ts'ten import eder; dosyalar yoksa tip bilgili kurallar tipi
      # cozemez ve "Unsafe member access" yagmuruyla kirilir. Ayni sira yerelde
      # "pnpm verify" icinde de var.
      - name: Sozlesme kodunu uret (TypeScript)
        run: pnpm proto:gen:ts

      # Adimlar bilerek ayri tutuldu: kirmizi olan asamayi is akisi ozetinde
      # tek bakista gormek icin.
      - name: Lint
        run: pnpm lint

      - name: Stil kapisi (token disi renk/olcu)
        run: pnpm lint:style

      - name: Bicim kontrolu
        run: pnpm format:check

      - name: Tip kontrolu
        run: pnpm typecheck

      - name: Derleme
        run: pnpm build

      - name: Birim testleri
        run: pnpm test:unit

  integration:
    name: Entegrasyon (Testcontainers)
    runs-on: ubuntu-latest
    # Kalite kapisi gecmeden entegrasyon testlerine runner harcamiyoruz.
    needs: quality
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: pnpm kur
        uses: pnpm/action-setup@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Bagimliliklari kur
        run: pnpm install --frozen-lockfile

      # NEDEN "services:" BLOGU YOK?
      # Entegrasyon testleri Mongo ve Redis konteynerlerini Testcontainers ile
      # testin kendi icinden ayaga kaldirir; ubuntu-latest runner'inda Docker
      # daemon hazir geldigi icin ek bir kuruluma gerek kalmaz. Ayni testler
      # boylece yerelde ve CI'da bire bir ayni yoldan calisir, iki ayri
      # yapilandirma (docker-compose + services) bakimi kalmaz.
      # Ayrica: tek dugumlu Mongo replica set'i GitHub "services" blogu ile
      # kurmak zahmetlidir, cunku servis konteynerine ozel bir komut/healthcheck
      # verilemedigi icin rs.initiate() ve replica set'in PRIMARY'e gecmesini
      # bekleme adimlari elle disaridan yazilmak zorunda kalir; Testcontainers'in
      # Mongo modulu bunu kendi yapar.
      - name: Entegrasyon testleri
        run: pnpm test:int

  contract:
    name: Sozlesme (buf lint + format + breaking)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 ZORUNLU - "buf breaking" karsilastirma tabani olarak
      # main dalini .git uzerinden okur; sig klonda o dal hic bulunmaz.
      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Iki ayri sorunun cevabi aliniyor:
      #   exists   -> bu dalda packages/proto var mi (yoksa tum adimlar atlanir)
      #   baseline -> MAIN dalinda packages/proto var mi
      # baseline kontrolu olmadan, paketi main'e ilk tasiyan PR kesin kirmizi
      # olurdu: buf breaking bos bir tabanla "Module had no .proto files" der.
      # Asagidaki fetch'te --depth=1 YOK: sig bir fetch .git/shallow dosyasi
      # yazip yukaridaki "fetch-depth: 0" ile alinan tam gecmisi geri budar.
      - name: proto klasoru ve karsilastirma tabani var mi?
        id: detect
        run: |
          if [ -d "packages/proto" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "packages/proto bu dalda yok; buf adimlari atlandi." >> "$GITHUB_STEP_SUMMARY"
          fi
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main" || true
          if git cat-file -e refs/remotes/origin/main:packages/proto/buf.yaml 2>/dev/null; then
            echo "baseline=true" >> "$GITHUB_OUTPUT"
          else
            echo "baseline=false" >> "$GITHUB_OUTPUT"
            echo "main dalinda packages/proto henuz yok; geriye uyum kontrolu bu kosuda atlandi (ilk merge'den sonra devreye girer)." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Surum sabitlendi: buf'in yeni surumu yeni lint kurallari getirdiginde
      # CI kendiliginden kirmiziya donmesin, yukseltme bilincli yapilsin.
      - name: buf kur
        if: steps.detect.outputs.exists == 'true'
        uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.73.0
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # buf-lint-action / buf-breaking-action KULLANILMIYOR: ikisi de kullanimdan
      # kaldirildi. Duz "run:" hem yerelde hem CI'da BIREBIR ayni komuttur.
      - name: buf lint
        if: steps.detect.outputs.exists == 'true'
        run: buf lint packages/proto

      # Bicim kapisi: prettier .proto uzantisini tanimaz, bu yuzden proto
      # dosyalari baska hicbir kapida bicim denetiminden gecmiyor.
      - name: buf format
        if: steps.detect.outputs.exists == 'true'
        run: buf format --diff --exit-code packages/proto

      # Geriye uyum yalnizca PR'da ve taban varken anlamlidir.
      #
      # "ref=origin/main" - "branch=main" DEGIL: buf, .git girdisini okumak icin
      # depoyu `git clone file://...` ile kopyalar ve clone YALNIZCA refs/heads/*
      # altindaki yerel dallari tasir. Pull request kosusunda actions/checkout
      # merge commit'ini detached HEAD olarak alir; yerel bir "main" dali hic
      # olusmaz, main sadece refs/remotes/origin/main olarak durur. Bu yuzden
      # "branch=main" `fatal: couldn't find remote ref main` ile duser.
      - name: buf breaking
        if: steps.detect.outputs.exists == 'true' && steps.detect.outputs.baseline == 'true' && github.event_name == 'pull_request'
        run: buf breaking packages/proto --against ".git#ref=origin/main,subdir=packages/proto"

  # T2.3'un kapisi: ".proto dosyalarindan uretilen kod IKI DILDE de derleniyor mu?"
  #
  # Neden "quality" isinden ayri: bu is Go kurulumu ve iki Go eklentisinin
  # derlenmesini gerektirir. Bunu her ise yuklemek gereksiz; TypeScript tarafi
  # "quality" icinde zaten typecheck ve build ile dogrulaniyor. Burada asil kazanc
  # GO yarisidir - Go kodunu baska hicbir is derlemiyor.
  #
  # Neden gerekli: gen/ klasoru depoya GIRMEZ. Yani bir .proto degisikliginin
  # uretilen kodu kirip kirmadigi ancak burada, uretim gercekten kosturularak
  # anlasilir. Bu is olmadan "buf lint" gecer ama uretilen Go derlenmez halde
  # main'e girebilir.
  codegen:
    name: Kod uretimi (TS + Go derlenir)
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: pnpm kur
        uses: pnpm/action-setup@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Surum TEK yerden gelir: packages/proto/go.mod. "go-version-file" ayari
      # oradaki "go" satirini okur; boylece go.mod yukseltilince CI kendiliginden
      # dogru surume gecer ve burada ikinci bir surum numarasi bakimi kalmaz.
      - name: Go kur
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/proto/go.mod
          cache-dependency-path: packages/proto/go.sum

      - name: buf kur
        uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.73.0
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bagimliliklari kur
        run: pnpm install --frozen-lockfile

      # "@latest" YOK: surumler packages/proto/go.mod icinden gelir (tools.go o
      # satirlari canli tutar). Boylece CI ile gelistirici makinesi ayni eklenti
      # surumunu kullanir ve uretilen kod ikisinde de birebir ayni cikar.
      - name: protoc eklentilerini kur
        working-directory: packages/proto
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc
          # GOPATH/bin ACIKCA PATH'e ekleniyor. setup-go bunu genelde kendi
          # yapar, ama "genelde" yeterli degil: buf, local eklentileri YALNIZCA
          # PATH uzerinden bulur ve bulamazsa hata uretimin ortasinda
          # "protoc-gen-go: executable file not found in $PATH" olarak cikar.
          # Tek satirlik sigorta, teshisi zor bir hatayi bastan kapatiyor.
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Eklentiler gercekten cagrilabiliyor mu? Uretimden ONCE soruyoruz ki
      # hata, uzun bir uretim ciktisinin icinde degil kendi adiminda gorunsun.
      - name: Eklentiler PATH'te mi?
        run: |
          protoc-gen-go --version
          protoc-gen-go-grpc --version

      # pnpm proto:check = generate:ts -> tsc -> generate:go -> go build
      - name: Uret ve iki dilde derle
        run: pnpm proto:check

      # go.mod/go.sum ile gercek bagimliliklar ayrisirsa burada yakalanir.
      # "-diff" bayragi dosyalari DEGISTIRMEDEN farki basar ve fark varsa
      # sifirdan farkli cikar. Once "go mod tidy" kosup sonra "git diff" bakmaya
      # gore ustunlugu: is alanini kirletmez, bu yuzden sonraki adimlar
      # (ya da yeniden kosumlar) tidy'nin yan etkisinden etkilenmez.
      - name: go.mod ve go.sum guncel mi?
        working-directory: packages/proto
        run: go mod tidy -diff
