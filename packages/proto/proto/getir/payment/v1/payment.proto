syntax = "proto3";

// payment-svc sozlesmesi.
//
// Bu servis payments koleksiyonunun TEK sahibidir. Gercek bir odeme
// saglayicisi yoktur; cekim, 3DS dogrulamasi ve iade MOCK'tur. Buna ragmen
// sozlesme gercek bir saglayici takilabilecek sekilde yazilmistir: durum
// makinesi, idempotency ve iade yolu bastan yerindedir.
//
// KART VERISI BU SOZLESMEDEN GECMEZ. Ham kart numarasi, CVV ve son kullanma
// tarihi hicbir alanda tasinmaz; yalnizca saklanmis kart jetonu (card_token)
// kullanilir. Bu, mock bir serviste bile bilincli bir sinirdir. Tek istisna
// ayri sozlesmededir: kart kasasinin AddCard'i (getir/cardvault/v1, T11.17)
// numarayi ve CVV'yi bir kez alir, dogrular, maskeleyip saklar; tam numara ve
// CVV saklanmaz. Kasa ayni servisin (payment-svc) icindedir.
//
// Bu servisin ISI DEGILDIR: siparis durumunu degistirmek (order-svc), stok
// dusurmek (inventory-svc), riski hesaplamak (risk-svc). Odeme basarisiz
// olursa telafiyi saga yurutur; bu servis yalnizca sonucu bildirir.

package getir.payment.v1;

import "getir/common/v1/common.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/berkaydgryl/quick-commerce-microservices/packages/proto/gen/go/getir/payment/v1;paymentv1";

// Odeme servisi.
service PaymentService {
  // Tutari ceker. Orta bantta 3DS gerektirebilir.
  rpc Charge(ChargeRequest) returns (ChargeResponse);

  // 3DS kodunu dogrular ve cekimi tamamlar.
  rpc Confirm3Ds(Confirm3DsRequest) returns (Confirm3DsResponse);

  // Siparise ait odemenin son halini okur.
  rpc GetPayment(GetPaymentRequest) returns (GetPaymentResponse);

  // Cekilmis tutari geri verir (mock iade).
  rpc Refund(RefundRequest) returns (RefundResponse);
}

// Odeme yontemi.
//
// TANIM BURADA DURUR ve order-svc bu enum'u import eder. Iki dosyada iki ayri
// kopya tutulsaydi, bir gun birine deger eklendiginde digeri sessizce eskir
// ve gateway'de elle esleme kodu gerekirdi.
//
// Kapida odeme YALNIZCA dusuk risk bandinda (0-30) secilebilir; bu kural
// order-svc'de uygulanir, burada degil.
enum PaymentMethod {
  PAYMENT_METHOD_UNSPECIFIED = 0;
  PAYMENT_METHOD_CARD = 1;
  PAYMENT_METHOD_CASH_ON_DELIVERY = 2;
}

// Odemenin yasam dongusundeki yeri.
enum PaymentStatus {
  PAYMENT_STATUS_UNSPECIFIED = 0;

  // Cekim baslatildi, sonuc henuz belli degil.
  PAYMENT_STATUS_PENDING = 1;

  // 3DS dogrulamasi bekleniyor; tutar henuz cekilmedi.
  PAYMENT_STATUS_REQUIRES_3DS = 2;

  PAYMENT_STATUS_SUCCEEDED = 3;
  PAYMENT_STATUS_FAILED = 4;

  // Iade edildi. Bu deger BASTAN vardir cunku saga'da somut bir yolu var:
  // Commit sirasinda rezervasyon dusmusse (ZREM 0) odeme geri verilir ve
  // siparis CANCELLED olur (B3, B20).
  PAYMENT_STATUS_REFUNDED = 5;

  // Tahsil edilmeden kapatildi (T11.2 PR 3): siparis iptal edildi; kapida
  // odeme PENDING'di ya da 3DS bekleniyordu. Para hic alinmadi, iade yok.
  PAYMENT_STATUS_CANCELLED = 6;
}

// Odeme kaydi.
message Payment {
  string id = 1;

  // Bir siparisin en fazla bir odemesi olur; eslesme bu alan uzerindendir.
  string order_id = 2;

  string user_id = 3;

  // Cekilen tutar (kurus). Siparis toplamiyla birebir ayni olmalidir.
  getir.common.v1.Money amount = 4;

  PaymentMethod method = 5;
  PaymentStatus status = 6;

  // Basarisizlik nedeni; ERROR_CODES sozlugunden bir anahtar (ornegin
  // "PAYMENT_DECLINED"). Yalnizca FAILED durumunda doludur.
  string failure_code = 7;

  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message ChargeRequest {
  string order_id = 1;
  string user_id = 2;

  // Cekilecek tutar (kurus). Istemciden GELMEZ; order-svc'nin hesapladigi
  // siparis toplamidir.
  getir.common.v1.Money amount = 3;

  PaymentMethod method = 4;

  // DEPRECATED (T12.4; yorumla, secenekle degil: hala okunuyor): card_id
  // kullanin. Demo saglayicisinin test jetonu;
  // personalar ve eski cagiranlar icin kabul edilir (kaldirma bekleyen is 118).
  // CASH_ON_DELIVERY icin bos birakilir.
  string card_token = 5;

  // ADR-08: ayni anahtarla gelen ikinci cagri TEKRAR cekim yapmaz, ilk
  // cekimin kaydini doner. Odeme tarafinda bu kural en kritik yerdedir.
  string idempotency_key = 6;

  // true ise banka onaylayacak olsa bile 3DS istenir (T7.1). Orta risk
  // bandinda order-svc doldurur ("kart + 3DS zorunlu"); karar risk'e aittir,
  // payment yalnizca uygular. Reddedilecek kart yine reddedilir. Kapida
  // odemede anlamsizdir: true gelirse VALIDATION_FAILED.
  bool require_three_ds = 7;

  // Kayitli kart (T12.4): kart kasasindaki kartin kimligi (crd_). payment-svc
  // kartin bu user_id'ye ait ve ACTIVE oldugunu denetler, saglayici jetonunu
  // kendi kasasindan cozer; jeton cagirana DONMEZ. Kart yoksa, silinmisse ya da
  // baskasininsa NOT_FOUND (ayrinti resource = "card"; varlik sizdirmaz) ve
  // HICBIR kayit yazilmaz: idempotency anahtari harcanmaz, ayni siparis baska
  // kartla yeniden cekilebilir. card_token ile birlikte gelirse VALIDATION_FAILED.
  string card_id = 8;
}

// Cekim cevabi.
//
// Kart reddedilirse BOS CEVAP DONMEZ: payment.status = FAILED ve
// failure_code = "PAYMENT_DECLINED" ile doner. Red, teknik bir hata degil
// normal bir is sonucudur; saga bunu okuyup rezervasyonu serbest birakir ve
// siparisi PAYMENT_FAILED yapar.
message ChargeResponse {
  Payment payment = 1;

  // Bos DEGILSE 3DS dogrulamasi bekleniyor demektir (status = REQUIRES_3DS).
  // Bu jeton Confirm3Ds cagrisina oldugu gibi geri verilir.
  string challenge_id = 2;

  // 3DS kodunun gecerlilik bitisi (T12.4): yalnizca challenge_id doluyken.
  // Pencere cekim anindan baslar (T5.2); tekrar istekte ilk cekimin bitisi doner.
  google.protobuf.Timestamp challenge_expires_at = 3;
}

message Confirm3DsRequest {
  string order_id = 1;

  // Charge cevabindan gelen jeton.
  string challenge_id = 2;

  // Kullanicinin girdigi dogrulama kodu: 6 hane (contracts OTP_PATTERN).
  // Mock saglayicida sabit bir kod beklenir: packages/core MOCK_THREEDS_CODE.
  // Bicimi bozuk kod DENEME SAYILMAZ, INVALID_ARGUMENT (VALIDATION_FAILED) doner.
  string code = 3;
}

// 3DS dogrulama cevabi (T5.2).
//
// Dogru kod: payment.status = SUCCEEDED doner.
//
// Ret HATA olarak doner: FAILED_PRECONDITION + x-app-error kodu THREEDS_FAILED.
// Ayrinti (details) kalan hakki ve sebebi tasir: { attemptsLeft, reason }.
//   - Yanlis kod, hak kaldi: reason "wrong_code", attemptsLeft 2 ya da 1; odeme
//     REQUIRES_3DS kalir, ayni jetonla yeniden denenir.
//   - Son hak da yanlis: reason "attempts_exhausted", attemptsLeft 0; odeme
//     FAILED ve failure_code = "THREEDS_FAILED", jeton kilitlenir.
//   - Jetonun 60 sn omru doldu: reason "expired", attemptsLeft 0; odeme FAILED.
// Kart reddi (PAYMENT_DECLINED) ile karismasin diye 3DS hatasi ayri koddadir.
//
// Tekrar istek (ag kaybi): sonuclanmis odemeye ayni jetonla gelen istek durumu
// DEGISTIRMEZ, onceki sonucu yeniden alir (basari ya da ayni sebeple ret).
//
// Jeton bu siparise ait degilse ya da hic yoksa NOT_FOUND doner.
message Confirm3DsResponse {
  Payment payment = 1;
}

message GetPaymentRequest {
  string order_id = 1;
}

// Odeme okuma cevabi. Kayit yoksa NOT_FOUND doner.
message GetPaymentResponse {
  Payment payment = 1;

  // 3DS dogrulamasinin durumu (#163 B1): odeme 3DS bekliyorsa (acik ya da
  // suresi dolmus) ya da dogrulamasi kapanip FAILED olduysa (suresi doldu, hakki
  // bitti) dolu; dogrulama yoksa ya da odeme 3DS disinda sonuclandiysa
  // (basarili, iade, iptal, kart reddi) bos.
  ThreeDsStatus three_ds = 2;
}

// 3DS dogrulamasinin durumu (#163 B1). order GetOrder bunu siparis ayrintisina
// tasir (sayfa yenilense de dogrulama surdurulur). Kod (OTP) hicbir zaman
// tasinmaz.
//
// REST'e cevirme (gateway, TEK SAAT): ttlSeconds = expires_at'a kalan sure,
// gateway'in saatiyle, en az 0. challengeId yalnizca ttlSeconds > 0 VE
// attempts_left > 0 ise konur; aksi halde dogrulama kapalidir (hak bittiyse
// "hakki bitti", yoksa "suresi doldu"). Ayrinti: contracts order-three-ds.ts.
message ThreeDsStatus {
  // Confirm3Ds jetonu. Payment dogrulama acikken doldurur; gateway yine de
  // kendi hesabina gore (yukarida) kullanir.
  string challenge_id = 1;

  // Kodun gecerlilik bitisi; dogrulama varsa HER ZAMAN dolu.
  google.protobuf.Timestamp expires_at = 2;

  // Kalan yanlis kod hakki: en fazla hak - yanlis kod sayisi, dogrulama hangi
  // sebeple kapanmis olursa olsun (suresi dolanda da). 0 = hakki bitti.
  int32 attempts_left = 3;
}

message RefundRequest {
  string order_id = 1;

  // Iade gerekcesi anahtari (ornegin "reservation_expired"). Ledger ve
  // outbox olayina oldugu gibi yazilir.
  string reason = 2;

  string idempotency_key = 3;
}

// Iade cevabi.
//
// Ayni siparis icin ikinci iade cagrisi TEKRAR para hareketi uretmez; zaten
// REFUNDED olan kaydi doner. Bu, at-least-once olay teslimati altinda
// tuketicilerin iadeyi birden fazla tetikleyebilmesi yuzunden zorunludur.
message RefundResponse {
  Payment payment = 1;

  // true ise odeme bu cagridan ONCE de iade edilmisti.
  bool already_refunded = 2;
}
