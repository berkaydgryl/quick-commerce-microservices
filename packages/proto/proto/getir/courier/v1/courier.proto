syntax = "proto3";

// courier-svc sozlesmesi.
//
// Bu servis couriers koleksiyonunun TEK sahibidir. Gercek kurye yoktur; bir
// worker sahte GPS uretir (2 saniyede bir nokta), Redis'e yazar ve
// courier.location olayini yayinlar. Tarayici iki nokta arasini kendi
// interpole eder; bu yuzden tick araligi sozlesmede yer almaz, sunucu
// yapilandirmasidir (COURIER_TICK_MS).
//
// Bu servisin ISI DEGILDIR: siparis durumunu degistirmek (order-svc),
// odayi yonetmek ve olayi istemciye itmek (realtime-svc).
//
// KONUM AKISI BU SOZLESMEDEN GECMEZ. Canli konum bir RPC ile degil,
// courier.location olayi ve socket odasi uzerinden tasinir; saniyede bir
// unary cagri ile konum cekmek hem gereksiz yuk hem de gecikmeli sonuc
// uretirdi. Buradaki RPC'ler atama ve rota baslatma gibi DURUM DEGISTIREN
// adimlar ve tek seferlik okumalar icindir. Istisna (T13.3, asama 1): canli
// akis gelene kadar web takibi GetTracking'i gateway uzerinden 2 sn'de bir
// yoklar; asama 2'de konum courier.location olayi ve soketle akar.

package getir.courier.v1;

import "getir/common/v1/common.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/berkaydgryl/quick-commerce-microservices/packages/proto/gen/go/getir/courier/v1;courierv1";

// Kurye servisi.
service CourierService {
  // Siparise uygun kuryeyi atar.
  rpc AssignCourier(AssignCourierRequest) returns (AssignCourierResponse);

  // Kuryenin o anki halini ve son bilinen konumunu okur.
  rpc GetCourier(GetCourierRequest) returns (GetCourierResponse);

  // Siparisin rotasini baslatir. T13.2'den beri rota ATAMADA uretilir ve
  // saklanir; bu cagri ayni rotayi already_started = true ile doner. GPS
  // simulasyonu T13.3'te.
  rpc StartRoute(StartRouteRequest) returns (StartRouteResponse);

  // Siparisi tasiyan kuryeyi bosa cikarir (BUSY -> IDLE).
  rpc ReleaseCourier(ReleaseCourierRequest) returns (ReleaseCourierResponse);

  // Siparisin takibi (T13.3, asama 1): kuryenin o anki konumu, asama ve
  // teslimata kalan; gateway GET /v1/orders/{id}/tracking'i bununla doldurur.
  // Okumadir, durum degistirmez.
  rpc GetTracking(GetTrackingRequest) returns (GetTrackingResponse);
}

// Kuryenin musaitlik durumu.
enum CourierStatus {
  COURIER_STATUS_UNSPECIFIED = 0;

  // Atanmaya hazir.
  COURIER_STATUS_IDLE = 1;

  // Bir siparise bagli, yolda.
  COURIER_STATUS_BUSY = 2;

  // Vardiya disi; atama havuzuna girmez.
  COURIER_STATUS_OFFLINE = 3;
}

// Kurye kaydi.
message Courier {
  string id = 1;

  // Istemcide gosterilecek ad (ornegin "Mehmet K.").
  string name = 2;

  // DEPRECATED (ADR-15): kuryenin bagli oldugu depoydu. Alan silinmez; numara ve
  // JSON adi korunur (buf breaking WIRE_JSON). Sunucu bu alani doldurmaz (bos gelir).
  string dark_store_id = 3 [deprecated = true];

  // T13.1'de kuryenin bagli oldugu marketti. T13.2'den beri kurye bir markete
  // BAGLI DEGIL (ortak havuz: siparisin marketinin cevresindeki bos kuryeler);
  // sunucu bu alani doldurmaz (bos gelir). Alan silinmez (buf breaking WIRE_JSON).
  string market_id = 8;

  CourierStatus status = 4;

  // BUSY ise tasidigi siparis; aksi halde bostur.
  string current_order_id = 5;

  // Son bilinen konum ve okundugu an. Kaynak Redis'teki
  // courier:{courierId}:last anahtaridir.
  getir.common.v1.GeoPoint last_location = 6;
  google.protobuf.Timestamp last_location_at = 7;
}

// Kuryenin atama anindaki konumundan markete (paket alma), oradan teslimat
// adresine cizilen iki parcali rota (T13.2).
message Route {
  // Buyuk daire uzerinde noktalar (20-40 adet; ceil(toplam m / 100),
  // sinirlara kirpilir). Ilk nokta kuryenin konumu, son nokta teslimat
  // adresidir; market noktasi birebir rotanin kosesidir (kurye marketteyse
  // ilk nokta). Iki parca uzunluk oraninda bolunur; aralik HER BACAKTA esittir,
  // iki bacagin araligi yakin ama esit olmayabilir. Ilerleme nokta basina
  // degil mesafeyle olculmeli.
  repeated getir.common.v1.GeoPoint points = 1;

  // Toplam yol uzunlugu, METRE cinsinden.
  int32 distance_meters = 2;

  // Tahmini varis suresi, SANIYE cinsinden, tam sayi (yukari yuvarlanir).
  // Hesap basittir: kalan mesafe bolu sabit hiz (COURIER_SPEED_KMH). Atamada
  // butun rota, distance_meters'tan (ayni tam sayi mesafe); T13.3'ten
  // itibaren her 10 tick'te bir guncellenir.
  int32 eta_seconds = 3;
}

message AssignCourierRequest {
  string order_id = 1;
  // DEPRECATED (ADR-15): market_id kullanin. Alan silinmez; numara ve JSON adi
  // korunur (buf breaking WIRE_JSON). Yeni istemci doldurmaz; sunucu bu alani OKUMAZ, market_id zorunlu.
  string dark_store_id = 2 [deprecated = true];

  // Pazaryerinde siparisin/stogun ait oldugu market (ADR-15): mkt_ onekli kimlik.
  string market_id = 4;
  getir.common.v1.GeoPoint delivery_location = 3;
}

// Atama cevabi.
//
// HAVUZ (T13.2): siparisin marketinin cevresindeki (3 km) IDLE kuryelerden,
// en yakin dilimde en uzun suredir bosta olani atanir.
//
// ATAMA ATOMIKTIR (B7): kurye ancak HALA IDLE ise BUSY isaretlenir ve siparise
// baglanir (kosullu findOneAndUpdate). Iki siparis ayni kuryeyi kapamaz.
//
// Uygun kurye yoksa NOT_FOUND doner. Bu bir hata degil BEKLENEN bir durumdur:
// siparis PREPARING'de kalir ve 30 saniye sonra yeniden denenir.
message AssignCourierResponse {
  Courier courier = 1;

  // Atama anindaki ilk tahmin: rotanin (Route.eta_seconds) degeri. Tekrar
  // istek ayni rotayi ve ayni tahmini doner. Market konumu bilinmiyorsa 0.
  // courier.assigned olayiyla istemciye de gider (T13.4).
  int32 eta_seconds = 2;
}

message GetCourierRequest {
  string courier_id = 1;
}

// Kurye okuma cevabi. Kayit yoksa NOT_FOUND doner.
message GetCourierResponse {
  Courier courier = 1;
}

message StartRouteRequest {
  string order_id = 1;
  string courier_id = 2;
}

// Rota baslatma cevabi.
//
// Ayni siparis icin ikinci cagri YENI rota uretmez ve simulasyonu bastan
// baslatmaz; calisan rotayi oldugu gibi doner. Aksi halde yeniden denenen
// bir worker, haritadaki ikonu basa isinlardi. T13.2'den beri rota atamada
// baslar: cevap hep already_started = true, started_at atama anidir.
// Siparisin bu kuryeyle rotasi yoksa NOT_FOUND.
message StartRouteResponse {
  Route route = 1;

  // Simulasyonun basladigi an. Istemci gecen sureyi buradan hesaplar.
  google.protobuf.Timestamp started_at = 2;

  // true ise rota bu cagridan ONCE de baslatilmisti.
  bool already_started = 3;
}

message ReleaseCourierRequest {
  // Kurye siparisle bulunur: bir siparisi en fazla bir kurye tasir.
  string order_id = 1;
}

// Bosa cikarma cevabi.
//
// Tekrar guvenlidir: siparisi tasiyan kurye yoksa (zaten birakilmis ya da hic
// atanmamis) hata degil released = false doner. Order, atamadan sonra siparisi
// yazamazsa (siparis bu arada iptal edildi) kuryeyi bununla geri verir.
message ReleaseCourierResponse {
  // true ise bu cagri bir kuryeyi IDLE'a dondurdu.
  bool released = 1;

  // Birakilan kurye; released = false ise bostur.
  string courier_id = 2;
}

// Takibin asamasi (T13.3).
enum TrackingPhase {
  TRACKING_PHASE_UNSPECIFIED = 0;
  // Kurye markete gidiyor ya da markette hazirligin bitmesini bekliyor
  // (siparis PREPARING).
  TRACKING_PHASE_TO_MARKET = 1;
  // Paket alindi, kurye teslimat adresine gidiyor (siparis ON_THE_WAY).
  TRACKING_PHASE_TO_CUSTOMER = 2;
  // Rota bitti, paket teslim edildi (siparis DELIVERED).
  TRACKING_PHASE_DELIVERED = 3;
}

message GetTrackingRequest {
  string order_id = 1;
}

// Takip cevabi. Degerler cagri ANINDA, rotanin baslangicindan gecen sureden
// hesaplanir (kurye hizi COURIER_SPEED_KMH, marketteki hazirlik
// ORDER_PREP_SECONDS; ikisi courier yapilandirmasi); tick ile ayni saf
// fonksiyon. Siparisin rotasi yoksa ya da rota birakildiysa (siparis iptal,
// kurye yeniden atandi) NOT_FOUND: birakilan rota ilerlemez.
//
// Courier kullaniciyi BILMEZ: sahiplik denetimi cagirandadir (gateway once
// siparisin kullanicinin oldugunu order'dan dogrular).
//
// GIZLILIK: kurye bir teslimattan sonra oldugu yerde (ONCEKI musterinin
// adresinde) bosa cikar ve oradan atanir. Bu yuzden paket alinmadan
// (TO_MARKET) konum BOS doner, rotanin ilk bacagi (kurye -> market) hic
// donmez, kalan yol yalnizca market -> adres bacagidir ve varis tahmini
// dakikaya yukari yuvarlanir (kalanin azalisi kurye -> market uzakligini ele
// vermesin). Degerler yalnizca BU siparisin saklanan rotasindan hesaplanir;
// kuryenin baska siparisteki canli konumu kullanilmaz. Kurallar contracts
// tracking.ts enforceTrackingPhase ile ayni.
message GetTrackingResponse {
  string courier_id = 1;
  // Gosterim adi ("Mehmet K."); gercek kisi degil.
  string courier_name = 2;
  TrackingPhase phase = 3;
  // Kuryenin o anki konumu: TO_CUSTOMER ve DELIVERED'da var, TO_MARKET'ta BOS.
  getir.common.v1.GeoPoint location = 4;
  // Degerlerin hesaplandigi an.
  google.protobuf.Timestamp at = 5;
  // Teslimat adresine kalan yol, METRE; TO_MARKET'ta 2. bacagin tamami,
  // DELIVERED'da 0.
  int32 remaining_meters = 6;
  // Teslimata kalan, SANIYE (marketteki bekleme dahil, yukari yuvarlanir);
  // TO_MARKET'ta dakikaya yuvarlanir, DELIVERED'da 0.
  int32 eta_seconds = 7;
  // Rotanin market -> adres parcasi: ilk nokta market, son nokta adres (1-40;
  // adres marketin kendisiyse tek nokta).
  repeated getir.common.v1.GeoPoint route = 8;
  getir.common.v1.GeoPoint market_location = 9;
  getir.common.v1.GeoPoint delivery_location = 10;
  // Paket alindiysa an; yoksa bos.
  google.protobuf.Timestamp picked_up_at = 11;
  // Teslim edildiyse an; yoksa bos.
  google.protobuf.Timestamp delivered_at = 12;
}
